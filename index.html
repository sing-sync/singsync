  /* 💡 語義・文法の注釈v2（PV画面・単語アンカー方式）。canvas（renderFrame）は書き出しと共用なので触らず、
     layoutLineの単語箱（canvas座標・キャッシュ済・仕込みのwiと1:1）を実画面座標に写像してDOMで重ねる。
     指定した語/フレーズの下にプリセット色の下線＋歌詞ブロック（和訳込み）のすぐ下の余白にグロス。
     余白が使えない画面（デュエット下段など）は同じxのままブロックの真上に退避。書体もプリセットを継承 */
  const ANNOT_STYLES = { // 色・質感・動きはCSSの .pv-annot2.preset-* 側。書体はここ（衝突計算の実測と表示を同値に保つ）
    aurora:    { font: (px) => `600 ${px}px "Noto Sans JP", sans-serif` },
    cinema:    { font: (px) => `500 ${px}px "Noto Serif JP", "Hiragino Mincho ProN", serif` },
    classroom: { font: (px) => `700 ${px}px Inter, "Noto Sans JP", sans-serif` },
    neon:      { font: (px) => `500 ${px}px "M PLUS 1p", "Noto Sans JP", sans-serif` },
    bold:      { font: (px) => `800 ${px}px "Noto Sans JP", sans-serif` },
    acoustic:  { font: (px) => `500 ${px}px "Zen Maru Gothic", "Noto Sans JP", sans-serif` },
  };
  const ANNOT_LEAD = 0.9; // 歌い出しよりワンテンポ先にグロスを出す秒数（目が意味を拾ってから歌える）
  const UNDERLINE_LEAD = 0.25; // 下線の先行秒数。着地アニメ終盤なので残りの動きは数px＝線が語を迎える見え方になる
  const PvAnnot = React.memo(function PvAnnot({ projRef, ov2Ref, canvasRef }) {
    const [, setTick] = useState(0);
    useEffect(() => { const iv = setInterval(() => setTick((n) => n + 1), 200); return () => clearInterval(iv); }, []);
    const holdRef = useRef({ id: null, outAt: 0 }); // 表示中の行id＋フェードアウト完了時刻
    const p = projRef.current;
    const t = AE.t();
    let cur = null, nxt = null;
    for (const l of p.lines) { // PresentOverlay.currentLine と同じ判定
      if (l.type !== "lyric" || l.tStart == null) continue;
      if (l.tStart <= t + 0.01) cur = l; else { nxt = l; break; }
    }
    const annotated = (l) => !!(l && ((l.notes || []).length || (l.point || "").trim()));
    // 出: 歌い出しのワンテンポ前（ANNOT_LEAD）からグロスを予告表示。下線は着地の少し前（UNDERLINE_LEAD）から
    //     ＝エントランス終盤は残りの動きが数pxなので、線が先に引かれても語とズレて見えない
    // 消: tEndでフェード開始＝歌詞の退場フェードと同時に消えきる（注釈だけ残さない）
    const show = annotated(cur) && t <= cur.tEnd ? cur
      : annotated(nxt) && t >= nxt.tStart - ANNOT_LEAD ? nxt : null;
    const h = holdRef.current;
    if (show) { h.id = show.id; h.outAt = 0; }
    else if (h.id && !h.outAt) h.outAt = Date.now() + 300; // CSSのopacity遷移(.25s)ぶん残してから消す
    if (h.outAt && Date.now() > h.outAt) { h.id = null; h.outAt = 0; }
    if (!h.id) return null;
    const line = p.lines.find((l) => l.id === h.id); // 参照でなくidで毎回引く（onCommitの差し替えに強い）
    const canvas = canvasRef.current;
    if (!line || !canvas) return null;
    const pre = t < line.tStart - UNDERLINE_LEAD; // 予告中＝下線は歌い出しの少し前から「すっ」と引かれる
    const rect = canvas.getBoundingClientRect(); // 毎tick実測＝リサイズ/全画面に追従。present-rootはfixed inset:0前提
    const s = rect.width / CANVAS_W;
    if (!s) return null;

    const o = ov2Ref.current || {};
    const mode = o.nextPreview || "single";
    const preset = PRESETS[p.style.presetId] || PRESETS.aurora;
    const as = ANNOT_STYLES[preset.id] || ANNOT_STYLES.aurora;
    const fs = p.style.overrides.fontScale || 1; // ov2はfontScaleを上書きしない（renderProjectと同じ実効値）
    const effFs = mode === "duet" ? fs * 0.88 * (enSegments(line.en).length > 2 ? 0.72 : 1) : fs; // renderDuet.scaleForと同式
    const lay = layoutLine(line, preset, effFs);
    if (!lay.words.length) return null;
    let slot = 0;
    if (mode === "duet") { const e = lyricTimeline(p).find((x) => x.line.id === line.id); slot = e ? e.slot : 0; }
    const centerY = mode === "duet" ? (slot === 0 ? DUET_TOP : DUET_BOT) : CANVAS_H * 0.52;
    const baseY0 = centerY - (lay.rows.length - 1) * lay.rowH / 2; // drawLyricLineと同式（着地後なのでdy=0）
    const lastRowY = baseY0 + (lay.rows.length - 1) * lay.rowH;

    const notes = (line.notes || []).filter((nt) => nt.wi >= 0 && (nt.we ?? nt.wi) < lay.words.length);
    const orphans = (line.notes || []).filter((nt) => nt.wi < 0);
    const compact = notes.length >= 6;
    const glossPx = preset.id === "classroom" ? (compact ? 21 : 25) : (compact ? 22 : 26); // canvas-px
    const K = preset.underline ? 0.30 : preset.id === "bold" ? 0.24 : 0.26; // 下線のy係数。classroomはワイプ下線(+0.14)から逃がす

    // 語/フレーズごとの下線セグメント（「/」の段またぎ対応）。lay.wordsのwは末尾スペース込みなので右端は実測
    const items = notes.map((nt, idx) => {
      const we = nt.we ?? nt.wi;
      measureCtx.font = preset.enFont(lay.size);
      const segs = [];
      for (let r = lay.words[nt.wi].row; r <= lay.words[we].row; r++) {
        const row = lay.rows[r];
        let x1 = r === lay.words[nt.wi].row ? lay.words[nt.wi].x : row.left;
        let x2 = r === lay.words[we].row
          ? lay.words[we].x + measureCtx.measureText(lay.words[we].text).width
          : row.left + row.width;
        if (preset.id === "acoustic") { const ins = (x2 - x1) * 0.03; x1 += ins; x2 -= ins; } // 柔線=語幅より少し内側
        segs.push({ x1, x2, y: baseY0 + r * lay.rowH + lay.size * K });
      }
      measureCtx.font = as.font(glossPx);
      const a = segs[segs.length - 1];
      return { key: idx, nt, segs, row: lay.words[we].row, cx: (a.x1 + a.x2) / 2, w: measureCtx.measureText(nt.text).width + glossPx };
    });

    // グロスの上下振り分け: 「/」で2段以上に折り返した行は、1段目の語=行の上／2段目以降の語=行の下。
    // 1段の行は従来どおり全部下グループ（下に入らなければ上へ退避）
    const multiRow = lay.rows.length > 1;
    const labeled = items.filter((it) => it.nt.text); // text空＝下線だけはグロス無し（段の割り付けにも入れない）
    labeled.forEach((it) => { it.top = multiRow && it.row === 0; });
    const topItems = labeled.filter((it) => it.top), botItems = labeled.filter((it) => !it.top);

    // 横衝突: x昇順に詰め、アンカー中心から60canvas-px超ずれるなら2段目へ（最大2段・画面内クランプ）
    const packLanes = (arr) => {
      const laneRight = [];
      arr.slice().sort((a, b) => a.cx - b.cx).forEach((it) => {
        const want = it.cx - it.w / 2;
        let x = Math.max(want, (laneRight[0] ?? -1e9) + 14);
        if (x - want <= 60 && x + it.w <= CANVAS_W - 40) { it.lane = 0; it.x = Math.max(40, x); laneRight[0] = it.x + it.w; }
        else {
          x = Math.max(want, (laneRight[1] ?? -1e9) + 14);
          it.lane = 1; it.x = Math.max(40, Math.min(x, CANVAS_W - 40 - it.w)); laneRight[1] = it.x + it.w;
        }
      });
      return arr.length ? Math.max(...arr.map((i) => i.lane)) + 1 : 0;
    };
    const topN = packLanes(topItems), botN = packLanes(botItems);

    // 一言ポイント＋⚠孤児（語アンカーなし）は帯の端に中央揃えで積む
    const pointPx = 24;
    measureCtx.font = as.font(pointPx);
    const ptItems = [];
    if ((line.point || "").trim()) ptItems.push("💡 " + line.point.trim());
    orphans.forEach((nt) => ptItems.push("⚠ " + nt.w + (nt.text ? " ─ " + nt.text : "")));
    const ptWs = ptItems.map((tx) => measureCtx.measureText(tx).width);

    // 下の帯（歌詞ブロック=和訳込みの下）に収まるか。無理なら同じxでブロックの真上へ退避
    const glossH = glossPx * 1.5, pointH = pointPx * 1.55;
    const jaSegs = o.showJa && mode !== "duet" && line.ja ? enSegments(line.ja) : [];
    const jaSize = preset.jaSize * effFs;
    const blockBottom = jaSegs.length
      ? lastRowY + lay.size * 0.35 + jaSize * 1.1 + (jaSegs.length - 1) * jaSize * 1.5 + jaSize * 0.12
      : lastRowY + lay.size * 0.30;
    const bandTop = blockBottom + 26;
    const bandH = botN * (glossH + 6) + ptItems.length * pointH + (ptItems.length ? 6 : 0);
    let SAFE_BOTTOM = mode === "duet" ? (slot === 0 ? 660 : -1) : mode === "single" ? 900 : 845; // duet下段は通常上退避
    if (multiRow && mode === "duet" && slot === 1) SAFE_BOTTOM = o.showJa ? 870 : 1020; // 折返し行の下グループは和訳バンドの上まで使う
    const below = SAFE_BOTTOM > 0 && bandTop + bandH <= SAFE_BOTTOM;
    const capTop = baseY0 - lay.size * 1.02;
    // 上グループは1段目の真上へ。下グループは帯へ（入らなければ上グループのさらに外側へ退避）
    const aboveUnits = topN + (below ? 0 : botN);
    const glossY = (it) => it.top
      ? capTop - 12 - (topN - it.lane) * (glossH + 6)
      : below ? bandTop + it.lane * (glossH + 6)
      : capTop - 12 - topN * (glossH + 6) - (botN - it.lane) * (glossH + 6);
    const pointY = (i) => below
      ? bandTop + botN * (glossH + 6) + 6 + i * pointH
      : capTop - 12 - aboveUnits * (glossH + 6) - (ptItems.length - i) * pointH - 6;

    const px = (v) => (v * s).toFixed(1) + "px";
    return html`
      <div key=${line.id} className=${"pv-annot2 preset-" + preset.id + (h.outAt ? " out" : "")}
        style=${{ left: rect.left + "px", top: rect.top + "px", width: rect.width + "px", height: rect.height + "px" }}>
        ${!pre && items.flatMap((it) => it.segs.map((sg, i) => html`<div key=${"u" + it.key + "-" + i} className="an-underline"
          style=${{ left: px(sg.x1), top: px(sg.y), width: px(sg.x2 - sg.x1) }}></div>`))}
        ${labeled.map((it) => html`<div key=${"g" + it.key} className="an-gloss"
          style=${{ left: px(it.x), top: px(glossY(it)), font: as.font((glossPx * s).toFixed(2)) }}>${it.nt.text}</div>`)}
        ${ptItems.map((tx, i) => html`<div key=${"p" + i} className="an-point"
          style=${{ left: px(clamp(CANVAS_W / 2 - ptWs[i] / 2, 40, CANVAS_W - 40 - ptWs[i])), top: px(pointY(i)), font: as.font((pointPx * s).toFixed(2)) }}>${tx}</div>`)}
      </div>`;
  });

  function SheetView({ projRef, jaMode, scale, lastId, spokenRef, onLineTap, onLoopTap, onWordTap, bodyRef, onUserScroll, maskMode, openSet, onHoleTap, onMaskToggle, readRef, onReadTap, annotOn, recInfo, penActive, penFrame, inkRef, penStRef, inkApiRef, onInkNotify }) {
    const [, setTick] = useState(0);
    // ワイプ・現在行の追従用（rAFは非フォーカスタブで間引かれるためinterval駆動）
    useEffect(() => {
      const iv = setInterval(() => setTick((n) => n + 1), 100);
      return () => clearInterval(iv);
    }, []);
    // 毎レンダー後にインクの行アンカーを追従（和訳の挟み込み等で行が動いてもインクがついていく）
    useEffect(() => { const api = inkApiRef && inkApiRef.current; if (api) api.sync(); });
    const t = AE.t();
    const p = projRef.current;
    // いま歌っている行（PresentOverlay.currentLine と同じ判定）
    let cur = null;
    for (const l of p.lines) {
      if (l.type !== "lyric" || l.tStart == null) continue;
      if (l.tStart <= t + 0.01) cur = l; else break;
    }
    const loopId = AE._loop.on ? AE._loop.lineId : null;
    const spoken = spokenRef.current && Date.now() < spokenRef.current.until ? spokenRef.current : null;
    const sz = SHEET_SIZES[scale] || SHEET_SIZES[1];
    let num = 0;
    return html`
      <div className=${"present-sheet" + (penActive ? " pen-active" + (penFrame === "eraser" ? " pen-eraser" : "") : "")}
        style=${penActive && penFrame !== "eraser" ? { "--penc": penFrame } : undefined}
        ref=${bodyRef} onWheel=${onUserScroll} onTouchMove=${onUserScroll}>
        <div className="sheet-inner" style=${{ "--shEn": sz.en + "px", "--shJa": sz.ja + "px", "--shN": sz.n + "px", "--shMin": sz.min + "px", "--shAn": (sz.an || 17) + "px" }}>
          <div className="sheet-head">
            <span className="t">${p.meta.title || "歌詞シート"}</span>
            <span className="legend">${recInfo ? (recInfo.phase === "select" ? "🎙 録音するはんいをえらぼう — はじめの行 → おわりの行 をタップ"
              : recInfo.phase === "rec" ? "⏺ ろくおん中 — マイクにむかって歌おう！"
              : recInfo.phase === "review" ? "🎧 聞き直し中 — 下の ▶ できける（この録音は保存されません）"
              : "🎙 録音のじゅんび中")
              : penActive ? (maskMode === "quiz" ? "✎ かきこみ中 — 穴をひらくときは ✕かきこみおわり（P）" : "✎ かきこみ中 — 1本ゆびで書く・2本ゆびでスクロール")
              : maskMode === "quiz" ? "穴タップ=ひらく　行タップ=歌う　🔈=よみあげ　🔁=くり返し"
              : maskMode === "edit" ? "単語をタップ: かくす ⇔ もどす"
              : "行タップ=歌う　単語タップ=読み上げ　🔈=行をよみあげ　🔁=くり返し"}</span>
          </div>
          ${p.lines.map((l) => {
            if (l.type === "gap") return html`<div key=${l.id} data-lid=${l.id} className="sheet-gap">♪ ── 間奏 ──</div>`;
            num++;
            const n = num;
            const synced = l.tStart != null;
            const isCur = !!(cur && cur.id === l.id);
            const toks = enTokens(l.en);
            const words = l.words || [];
            const mset = new Set(l.mask || []);
            const rd = readRef ? readRef.current : null;
            const isReading = !!(rd && rd.phase !== "idle" && rd.lineId === l.id); // 🔈読み上げ中の行
            return html`
              <div key=${l.id} role="button" data-lid=${l.id}
                className=${"sheet-row" + (isCur ? " cur" : "") + (synced ? "" : " unsync") + (!isCur && lastId === l.id ? " last" : "") + (isReading ? " reading" : "")
                  + (recInfo && recInfo.set.has(l.id) ? (recInfo.phase === "rec" ? " rec-live" : " rec-sel") : "")}
                onClick=${synced ? () => onLineTap(l, n) : undefined}>
                <span className="n tnum">${n}</span>
                <div>
                  <div className="sheet-en">
                    ${toks.map((tok, wi) => {
                      const w = words[wi];
                      const masked = maskMode !== "off" && mset.has(wi);
                      const closed = masked && maskMode === "quiz" && !openSet.has(l.id + ":" + wi);
                      let cls = "sheet-w", wipe = null;
                      if (isCur && w) {
                        if (t >= w.tEnd) cls += " done";
                        else if (t >= w.tStart) {
                          const pr = clamp((t - w.tStart) / Math.max(0.001, w.tEnd - w.tStart), 0, 1);
                          wipe = html`<span className="wipe" style=${{ width: (pr * 100).toFixed(1) + "%" }}>${tok}</span>`;
                        }
                      }
                      if (spoken && spoken.lineId === l.id && spoken.wi === wi) cls += " spoken";
                      if (isReading && rd.wi === wi) cls += " read-now"; // 読んでいる単語（通知しない声は経過時間から推定）
                      if (masked && maskMode === "edit") cls += " mk-pick";
                      if (closed) cls += " mk-closed";
                      else if (masked && maskMode === "quiz") cls += " mk-open";
                      return html`<span key=${wi} className=${cls}
                        onClick=${(e) => {
                          e.stopPropagation();
                          if (maskMode === "edit") { onMaskToggle(l, wi); return; }   // 仕込み: かくす⇔もどす
                          if (closed) { onHoleTap(l.id, wi); return; }               // 本番: 穴をひらく（読み上げない）
                          onWordTap(tok, l.id, wi);                                  // ひらいた穴・ふつうの単語=読み上げ
                        }}>${tok}${wipe}</span>`;
                    })}
                  </div>
                  ${(jaMode === "all" || (jaMode === "cur" && isCur)) && l.ja ? html`<div className="sheet-ja">${l.ja}</div>` : null}
                  ${(() => {
                    // 💡注釈: カレント行の脚注。✎仕込み中は穴えらびが主役なので出さない。
                    // quiz中で穴が未開放の行はネタバレ防止で行ごと非表示（全部あけた瞬間にふわっと出る）
                    if (!annotOn || !isCur || maskMode === "edit") return null;
                    if (maskMode === "quiz" && (l.mask || []).some((mwi) => !openSet.has(l.id + ":" + mwi))) return null;
                    const nts = l.notes || [];
                    if (!nts.length && !(l.point || "").trim()) return null;
                    return html`<div className="sheet-annot">
                      ${nts.map((nt, i) => html`<span key=${i} className="annot-chip"><span className="aw">${nt.w}</span>${nt.text ? html`<span className="sep">─</span><span className="am">${nt.text}</span>` : null}</span>`)}
                      ${(l.point || "").trim() ? html`<span className="annot-point"><span className="lamp">💡</span>${l.point}</span>` : null}
                    </div>`;
                  })()}
                </div>
                <div className="sheet-actions">
                  <button className=${"sheet-read" + (isReading ? " reading" : "")} disabled=${!/[A-Za-z]/.test(l.en)}
                    onClick=${(e) => { e.stopPropagation(); onReadTap(l); }}
                    title=${isReading ? "よみあげを止める" : "この行をふつうの発音でよみあげ（曲は止まります）"}>${isReading ? "⏹" : "🔈"}</button>
                  ${synced
                    ? html`<button className=${"sheet-loop" + (loopId === l.id ? " on" : "")}
                        onClick=${(e) => { e.stopPropagation(); onLoopTap(l, n); }}
                        title="この行をくり返し再生">🔁</button>`
                    : html`<span className="slot"></span>`}
                </div>
              </div>`;
          })}
        </div>
        ${inkRef && html`<${InkLayer} inkRef=${inkRef} penStRef=${penStRef} inkApiRef=${inkApiRef} onNotify=${onInkNotify} />`}
      </div>`;
  }

  /* ============================================================
     🎬 授業モード（プレゼンテーション用フルスクリーンプレーヤー）
     ・書き出し不要: プレビューと同じ renderFrame で完成品と同じ絵を出す
     ・数字＋Enter で行ジャンプ / J=歌詞シート / T=和訳 / N=行番号 / B=黒画面
     ・和訳・行番号の切替は一時的（プロジェクト設定は書き換えない）
     ============================================================ */
  function PresentOverlay({ project, onExit, onCommit, student, studentTitle }) {
    // student=true: 📲 iPad配布の生徒プレイヤー（仕込み系UIを出さない・タッチ前提・終了はタイトルへ）
    const canvasRef = useRef(null);
    const sheetBodyRef = useRef(null);
    const [ov2, setOv2] = useState({
      showJa: project.style.overrides.showJa !== false,
      lineNumbers: !!project.style.overrides.lineNumbers,
      nextPreview: project.style.overrides.nextPreview || "single",
    });
    const [buffer, setBuffer] = useState("");   // 行ジャンプの数字入力
    const [sheetOn, setSheetOn] = useState(!!student); // ▦ 歌詞シート表示中か（生徒版はシートから始まる=いきなり音が出ない）
    const [morePop, setMorePop] = useState(false); // 生徒版の「⋯ そのほか」メニュー
    const [guideOn, setGuideOn] = useState(() => !!student && !store.get(PLAYER_GUIDE_KEY)); // はじめてガイド（1回だけ）
    const [voicePop, setVoicePop] = useState(false); // 🗣 読み上げの声えらびパネル
    const [, setVoiceTick] = useState(0); // 声を選び直したときの再描画用
    const [maskMode, setMaskMode] = useState("off"); // ⬚ 穴あき: off | quiz(本番) | edit(仕込み)
    const [maskPop, setMaskPop] = useState(false);   // 穴あき設定パネル
    const [maskLevel, setMaskLevel] = useState("normal"); // おまかせの量（セッション内のみ）
    const [openSet, setOpenSet] = useState(() => new Set()); // ひらいた穴 "lineId:wi"（保存しない）
    const [jaMode, setJaMode] = useState(() => JA_ORDER.includes(loadSheetPrefs().jaMode) ? loadSheetPrefs().jaMode : "cur");
    const [sheetScale, setSheetScale] = useState(() => { const s = loadSheetPrefs().scale; return s === 0 || s === 1 || s === 2 ? s : 1; });
    const [showFollowPill, setShowFollowPill] = useState(false); // 「▼いまの行へ」ピル
    const [penOn, setPenOn] = useState(false); // ✎ かきこみ（ペンモード・その場かぎりで保存しない）
    const [penTool, setPenTool] = useState(() => (loadSheetPrefs().penTool === "hl" ? "hl" : "pen")); // pen|hl|eraser
    const [penColor, setPenColor] = useState(() => (PEN_COLOR_ORDER.includes(loadSheetPrefs().penColor) ? loadSheetPrefs().penColor : "red"));
    const [readTrayOn, setReadTrayOn] = useState(false); // 🔈 よみトレイ（読み上げた行の道具・その場かぎり）
    const [rec, setRec] = useState(null); // 🎙 れんしゅう録音 null | {phase:"notice"|"select"|"rec"|"review"|"err", a,b=はんいの行id, withMusic, playing, kind}
    const [annotOn, setAnnotOn] = useState(true); // 💡 注釈。授業モードに入るたび必ずON（記憶しない=「仕込んだのに出ない」事故防止）
    const [black, setBlack] = useState(false);
    const [uiOn, setUiOn] = useState(true);
    const [flash, setFlash] = useState(null);   // { main, sub } 操作の一瞬フィードバック
    const [, setTick] = useState(0);
    const projRef = useRef(project); projRef.current = project;
    const ov2Ref = useRef(ov2); ov2Ref.current = ov2;
    const jaModeRef = useRef(jaMode); jaModeRef.current = jaMode;
    const stRef = useRef({}); stRef.current = { buffer, sheetOn, black, voicePop, maskMode, maskPop, penOn, annotOn, uiOn, morePop, rec };
    const openSetRef = useRef(openSet); openSetRef.current = openSet;
    const penStRef = useRef({}); penStRef.current = { on: penOn, tool: penTool, color: penColor }; // インク層用ミラー（シート/PV共通）
    const inkRef = useRef({ strokes: [], ops: [], seq: 0, tops: {} }); // 歌詞シートのインク実体（保存しない・授業モード終了で消える）
    const inkApiRef = useRef(null);
    const pvInkRef = useRef(null); // PV画面のインク実体（シートとは別持ち・行idごとのバケツ）
    if (pvInkRef.current == null) pvInkRef.current = pvInkLoad(project); // 💾で保存した書き込みを、授業モードに入るたび復元
    const pvInkApiRef = useRef(null);
    const activeInkApi = () => (stRef.current.sheetOn ? inkApiRef.current : pvInkApiRef.current); // ↩🗑Zはいま見えている面に効く
    const maskFromRef = useRef("off"); // ✎仕込みに入る前の文脈（✔できあがり で戻る先）
    const hideTimer = useRef(null);
    const bufTimer = useRef(null);
    const flashTimer = useRef(null);
    const segRef = useRef(null);        // 行タップ再生の自動停止 { lineId, end }
    const lastTapRef = useRef(null);    // ダブルタップ（ループ昇格）判定
    const lastPlayedRef = useRef(null); // 直前に聞いた行（シートの目印）
    const spokenRef = useRef(null);     // 単語読み上げ中ハイライト { lineId, wi, until }
    const readTrayRef = useRef(false); readTrayRef.current = readTrayOn; // キーハンドラ用ミラー
    const readRef = useRef({ // 🔈 発音確認よみあげの実行状態（refに書き、各tickが拾う＝再レンダー地獄を避ける）
      session: 0,            // 世代トークン: 中断のたび+1→古いonend/onboundary/タイマーは自然に死ぬ
      phase: "idle",         // idle | speaking | gap(リピートの間) | singing(うた⇔よみの歌)
      lineId: null, line: null, act: null, slow: false, wi: -1, boundaryOk: false,
      timer: 0, safeTimer: 0, trayTimer: 0, estTimer: 0, utter: null, startedAt: 0,
    });
    const userScrollRef = useRef(0);    // 手動スクロールした時刻（自動追従の一時停止）
    const prevCurRef = useRef(null);
    const recIO = useRef({ stream: null, mr: null, chunks: [], url: null, voice: null, range: null }); // 🎙 録音の実体（メモリのみ・保存しない）
    const recFnRef = useRef({});        // interval監視から最新のrec関数を呼ぶための橋
    const recPassEl = useRef(null);     // 🔓セーフティ鍵の入力欄（値はDOMにだけ・stateにも保存しない）

    // 和訳・行番号の一時切替: プロジェクトは書き換えず、描画時だけ差し替える
    const renderProject = () => {
      const p = projRef.current, o = ov2Ref.current;
      return { ...p, style: { ...p.style, overrides: { ...p.style.overrides, showJa: o.showJa, lineNumbers: o.lineNumbers, nextPreview: o.nextPreview } } };
    };

    /* 描画ループ（編集のプレビュー＝書き出しと同じ renderFrame） */
    useEffect(() => {
      let raf, alive = true;
      const draw = () => {
        if (!alive) return;
        raf = requestAnimationFrame(draw);
        const canvas = canvasRef.current;
        if (!canvas) return;
        const lp = AE._loop;
        if (lp.on && AE.playing && (AE.t() >= lp.end || AE.t() < lp.start - 1)) AE.seek(lp.start);
        if (!stRef.current.sheetOn) { // シート表示中はPV描画を休む（シートはDOM）
          const rp = renderProject();
          MediaLib.syncPreview(rp, AE.t());
          renderFrame(canvas.getContext("2d"), AE.t(), rp);
        }
      };
      raf = requestAnimationFrame(draw);
      const iv = setInterval(() => setTick((n) => n + 1), 250); // 時刻・ボタン状態の表示更新
      return () => { alive = false; cancelAnimationFrame(raf); clearInterval(iv); };
    }, []);

    /* 終了時の後片付け: ループ解除・速度を戻す・読み上げ停止・録音破棄＋マイク返却・全画面解除 */
    useEffect(() => () => {
      AE._loop.on = false;
      AE.setRate(1);
      TTS.stop(); // 🔈行よみあげのspeechもこのcancelで止まる
      const r = readRef.current;
      r.session++; // 予約済みのonend・タイマーを無効化
      clearTimeout(r.timer); clearTimeout(r.safeTimer); clearTimeout(r.trayTimer); clearInterval(r.estTimer);
      const io = recIO.current; // 🎙 録音は残さない・マイクも完全に返す（録音インジケータも消える）
      try { if (io.mr && io.mr.state !== "inactive") { io.mr.onstop = null; io.mr.stop(); } } catch (e) {}
      io.mr = null; io.chunks = [];
      if (io.voice) { try { io.voice.pause(); } catch (e) {} io.voice = null; }
      if (io.url) { try { URL.revokeObjectURL(io.url); } catch (e) {} io.url = null; }
      try { io.stream && io.stream.getTracks().forEach((t) => t.stop()); } catch (e) {}
      io.stream = null; io.range = null;
      if (!student && fsElement()) exitFullscreenSafe(); // 生徒版はタイトルに戻っても全画面のまま
    }, []);

    /* 📲 生徒版: 画面スリープを防ぐ（穴あきを考えている間に消灯すると体験が切れる） */
    useEffect(() => {
      if (!student) return;
      let lock = null, alive = true;
      const acquire = () => { try { navigator.wakeLock && navigator.wakeLock.request("screen").then((l) => { if (alive) lock = l; else l.release(); }).catch(() => {}); } catch (e) {} };
      acquire();
      const onVis = () => { if (!document.hidden && alive) acquire(); }; // スリープ復帰で取り直す
      document.addEventListener("visibilitychange", onVis);
      return () => { alive = false; document.removeEventListener("visibilitychange", onVis); try { lock && lock.release(); } catch (e) {} };
    }, []);

    /* 歌詞シート: 行タップ再生の自動停止＋ループ監視。
       描画rAFはバックグラウンドで間引かれることがあるため、interval側でも見張る */
    useEffect(() => {
      const iv = setInterval(() => {
        const seg = segRef.current;
        if (seg && AE.playing && AE.t() >= seg.end - 0.02) { AE.pause(); segRef.current = null; }
        const lp = AE._loop;
        if (lp.on && AE.playing && (AE.t() >= lp.end || AE.t() < lp.start - 1)) AE.seek(lp.start);
        const rst = stRef.current.rec, io = recIO.current; // 🎙 はんいのおわりで録音を自動停止／聞き直しの曲も止める
        if (rst && rst.phase === "rec" && io.range && AE.playing && AE.t() >= io.range.end - 0.02) recFnRef.current.finish && recFnRef.current.finish();
        if (rst && rst.phase === "review" && rst.playing && rst.withMusic && io.range && AE.playing && AE.t() >= io.range.end + 0.4) AE.pause();
      }, 90);
      return () => clearInterval(iv);
    }, []);

    /* タブが隠れると読み上げが黙る環境があるため、状態ごと畳む（iPad配布版への備え） */
    useEffect(() => {
      const onVis = () => { if (document.hidden && readRef.current.phase !== "idle") readStop(true); };
      document.addEventListener("visibilitychange", onVis);
      return () => document.removeEventListener("visibilitychange", onVis);
    }, []);

    /* 操作バーとカーソルの自動フェード（再生中のみ隠す・マウスを動かすと出る） */
    const wakeUi = () => {
      setUiOn(true);
      clearTimeout(hideTimer.current);
      const arm = () => {
        hideTimer.current = setTimeout(() => {
          // 歌詞シート中はツールバーを隠さない（タップ操作の道具箱なので）
          if (AE.playing && !stRef.current.sheetOn) setUiOn(false); else arm();
        }, 2600);
      };
      arm();
    };
    useEffect(() => { wakeUi(); return () => clearTimeout(hideTimer.current); }, []);

    /* 歌詞シート: 現在行の追従スクロール＋画面外なら「▼いまの行へ」ピル */
    useEffect(() => {
      if (!sheetOn) { setShowFollowPill(false); prevCurRef.current = null; return; }
      const openId = setTimeout(() => centerCur(), 30); // 開いた瞬間に現在行をセンターへ
      const iv = setInterval(() => {
        const body = sheetBodyRef.current;
        if (!body) return;
        const { cur } = currentLine();
        const cid = cur ? cur.id : null;
        if (cid !== prevCurRef.current) {
          prevCurRef.current = cid;
          if (AE.playing && Date.now() - userScrollRef.current > 4000) centerCur();
        }
        const el = body.querySelector(".sheet-row.cur");
        let off = false;
        if (el) {
          const bt = body.scrollTop, bh = body.clientHeight;
          off = el.offsetTop + el.offsetHeight < bt + 40 || el.offsetTop > bt + bh - 170;
        }
        setShowFollowPill(off);
      }, 400);
      return () => { clearTimeout(openId); clearInterval(iv); };
    }, [sheetOn]);

    /* 歌詞シートの表示設定（和訳・文字サイズ・ペンの道具と色）はブラウザに記憶。インク自体は保存しない */
    useEffect(() => {
      try { localStorage.setItem(SHEET_PREFS_KEY, JSON.stringify({ jaMode, scale: sheetScale, penTool: penTool === "eraser" ? "pen" : penTool, penColor })); } catch (e) {}
    }, [jaMode, sheetScale, penTool, penColor]);

    /* レイアウトが変わる操作をしたら書きこみは消す（ずれた丸は「ちがう単語を指す誤情報」で残すほうが害） */
    const clearInkBecause = (reason) => {
      const api = inkApiRef.current;
      if (api && api.hasInk()) { api.clearAll(false); doFlash("かきこみを消しました", reason); }
    };
    const firstScaleRef = useRef(true);
    useEffect(() => { // A±: 折返しが変わる
      if (firstScaleRef.current) { firstScaleRef.current = false; return; }
      clearInkBecause("文字の大きさが かわったため");
    }, [sheetScale]);
    const prevMaskModeRef = useRef(maskMode);
    useEffect(() => { // 穴あき開始/終了: 穴のmin-widthで行内が動く（quizへの出入りだけ。仕込み✎は幅が変わらない）
      const prev = prevMaskModeRef.current;
      prevMaskModeRef.current = maskMode;
      if ((prev === "quiz") !== (maskMode === "quiz")) clearInkBecause("穴あきの表示が かわったため");
    }, [maskMode]);

    const doFlash = (main, sub) => {
      setFlash({ main, sub });
      clearTimeout(flashTimer.current);
      flashTimer.current = setTimeout(() => setFlash(null), 1300);
    };

    const clearLoop = () => { AE._loop.on = false; segRef.current = null; };
    const lineNumOf = (line) => lyricLines(projRef.current).indexOf(line) + 1;

    // いま再生中の行（同期済み歌詞行のうち、開始時刻が現在以前の最後のもの）
    const currentLine = () => {
      const t = AE.t();
      const ls = lyricLines(projRef.current).filter((l) => l.tStart != null);
      let cur = null;
      for (const l of ls) { if (l.tStart <= t + 0.01) cur = l; else break; }
      return { cur, ls };
    };

    const jumpToLine = (line, n) => {
      stopReadingAll(true); // 歌う操作は読みを打ち切る
      clearLoop();
      AE.seek(line.tStart);
      AE.play();
      doFlash(n + "行目", withBreaks(line.en).split("\n")[0] || "");
    };
    const jumpToNum = (n) => {
      const all = lyricLines(projRef.current);
      const line = all[n - 1];
      if (!line) { doFlash("—", n + "行目はありません"); return; }
      if (line.tStart == null) { doFlash("—", n + "行目は未同期です"); return; }
      jumpToLine(line, n);
    };

    // ←→: 行送り。←は行の途中（1.2秒以上経過）なら、まずその行の頭へ戻る
    const step = (dir) => {
      const { cur, ls } = currentLine();
      if (!ls.length) return;
      clearLoop();
      let i = cur ? ls.indexOf(cur) : -1;
      if (dir > 0) i = Math.min(ls.length - 1, i + 1);
      else if (!(cur && AE.t() - cur.tStart > 1.2)) i = Math.max(0, i - 1);
      if (i < 0) i = 0;
      jumpToLine(ls[i], lineNumOf(ls[i]));
    };

    const toggleLoopHere = () => {
      stopReadingAll(true);
      if (AE._loop.on) { clearLoop(); doFlash("🔁", "行ループ解除"); return; }
      const { cur } = currentLine();
      if (!cur) return;
      segRef.current = null; // 行タップ再生の自動停止はループが引き継ぐ
      AE._loop = { on: true, lineId: cur.id, start: Math.max(0, cur.tStart - 0.5), end: Math.min(AE.duration, cur.tEnd + 0.5) };
      AE.seek(AE._loop.start);
      AE.play();
      doFlash("🔁 " + lineNumOf(cur) + "行目", student ? "行ループ中（もう一度タップで解除）" : "行ループ中（もう一度 L で解除）");
    };
    const toggleRate = () => {
      const r = AE.el.playbackRate === 1 ? 0.5 : 1;
      AE.setRate(r);
      doFlash(r === 0.5 ? "0.5×" : "1.0×", r === 0.5 ? "ゆっくり再生" : "通常の速さ");
    };
    const toggleJa = () => {
      const nv = !ov2Ref.current.showJa;
      setOv2((o) => ({ ...o, showJa: nv }));
      doFlash(nv ? "和訳 ON" : "和訳 OFF", "");
    };
    const toggleNum = () => {
      const nv = !ov2Ref.current.lineNumbers;
      setOv2((o) => ({ ...o, lineNumbers: nv }));
      doFlash(nv ? "行番号 ON" : "行番号 OFF", "");
    };
    const cycleNext = () => { // 次の行の表示を一時切替（プロジェクトは書き換えない）
      const cur = ov2Ref.current.nextPreview || "single";
      const nv = NEXT_PREVIEW_MODES[(NEXT_PREVIEW_MODES.indexOf(cur) + 1) % NEXT_PREVIEW_MODES.length];
      setOv2((o) => ({ ...o, nextPreview: nv }));
      doFlash("次行: " + NEXT_PREVIEW_LABELS[nv],
        nv === "single" ? "次の行は表示しません" : nv === "duet" ? "カラオケ式の2段交互" : nv === "cue" ? "待機＋歌い出しカウントダウン" : "次の行を下に待機表示");
    };
    const toggleFs = () => { fsElement() ? exitFullscreenSafe() : goFullscreen(); }; // iPadのwebkit接頭辞にも対応

    /* ---------- ▦ 歌詞シート（タップで歌う） ---------- */
    const toggleSheet = () => {
      if (stRef.current.rec) { doFlash("🎙 録音モード中です", "✕ おわる のあとで画面を切りかえられます"); return; }
      stopReadingAll(true); // 画面が替わるので読みかけは打ち切る
      const nv = !stRef.current.sheetOn;
      if (!nv) { TTS.stop(); setVoicePop(false); setMaskPop(false); }
      setPenOn(false); // 画面が替わるのでペンは置く（それぞれのインクは残る）
      setSheetOn(nv);
      wakeUi();
    };
    const pickVoice = (name) => { // 声を選んで、その声でためし聞き
      TTS.setWanted(name);
      TTS.speak("Hello! I will read the words.");
      setVoiceTick((t) => t + 1);
    };

    /* ----- ⬚ 穴あきリスニング（単語マスク） -----
       mask=プロジェクトに保存（onCommit経由＝undo/自動保存/.lyricpvに乗る）
       openSet=ひらいた穴（セッション内のみ・終了で消える） */
    const countMasks = (p) => p.lines.reduce((s, l) => s + (l.type === "lyric" && l.mask ? l.mask.length : 0), 0);
    const allHoleKeys = () => {
      const ks = [];
      for (const l of projRef.current.lines) if (l.type === "lyric" && l.mask) for (const wi of l.mask) ks.push(l.id + ":" + wi);
      return ks;
    };
    const startQuiz = () => {
      stopReadingAll(true); // 穴が閉じる=読みかけの行が「まだよめない」側に変わり得る
      setOpenSet(new Set()); // 開始のたび全部とじた状態から（クラスが替わっても同じ条件）
      setMaskMode("quiz"); setMaskPop(false); wakeUi();
      doFlash("⬚ 穴あき", countMasks(projRef.current) + "語をかくしました（タップで1語ずつひらく）");
    };
    const stopMask = () => { stopReadingAll(true); setMaskMode("off"); setMaskPop(false); wakeUi(); doFlash("穴あき おわり", "全部の歌詞が見えています"); };
    const toggleQuiz = () => { // Kキー: 速いトグル
      if (stRef.current.rec) { doFlash("🎙 録音モード中です", "穴あきの切替は ✕ おわる のあとで"); return; }
      if (stRef.current.maskMode !== "off") { stopMask(); return; }
      if (countMasks(projRef.current) === 0) { setMaskPop(true); doFlash("—", "まだ単語をえらんでいません（おまかせ か ✎ でどうぞ）"); return; }
      startQuiz();
    };
    const maskBtnTap = () => { // ⬚ボタン: 入りは速く（仕込み済みなら即開始）・出はパネル経由（誤タップ防止）
      if (stRef.current.rec) { doFlash("🎙 録音モード中です", "穴あきの切替は ✕ おわる のあとで"); return; }
      wakeUi();
      if (stRef.current.maskMode === "off" && countMasks(projRef.current) > 0) startQuiz();
      else setMaskPop((v) => !v);
    };
    const startEdit = () => {
      stopReadingAll(true); // 仕込みと読み上げは排他
      if (stRef.current.maskMode !== "edit") maskFromRef.current = stRef.current.maskMode;
      setPenOn(false); // 仕込みとペンは排他（どちらも単語タップの意味が変わるため）
      setMaskMode("edit"); setMaskPop(false); wakeUi();
      doFlash("✎ 仕込み中", "単語をタップ: かくす ⇔ もどす");
    };
    const endEdit = () => {
      const back = maskFromRef.current === "quiz" ? "quiz" : "off";
      if (back === "quiz") setOpenSet(new Set());
      setMaskMode(back); wakeUi();
      doFlash("✔ 仕込み完了", countMasks(projRef.current) + "語 — この曲に保存しました");
    };
    const toggleEdit = () => { stRef.current.maskMode === "edit" ? endEdit() : startEdit(); };
    const maskToggle = (line, wi) => { // 仕込み: 1語のかくす⇔もどす（連打はundo1回にまとまる）
      onCommit((np) => {
        const l = np.lines.find((x) => x.id === line.id);
        if (!l || l.type !== "lyric") return;
        const s = new Set(l.mask || []);
        s.has(wi) ? s.delete(wi) : s.add(wi);
        l.mask = [...s].sort((a, b) => a - b);
      }, { coalesce: true });
    };
    const holeTap = (lineId, wi) => {
      if (stRef.current.rec && stRef.current.rec.phase === "rec") return; // ⏺中の誤タップで穴があかないように
      wakeUi(); setOpenSet((prev) => { const s = new Set(prev); s.add(lineId + ":" + wi); return s; });
    };
    const revealAll = () => { setOpenSet(new Set(allHoleKeys())); doFlash("🔓 全部あけました", "もう一度やるときは左下の「もう一度かくす」"); };
    const rehideAll = () => { setOpenSet(new Set()); doFlash("⬚ もう一度かくしました", "タップで1語ずつひらけます"); };
    const revealOrRehide = () => { // Aキー・左下ピル
      const ks = allHoleKeys();
      if (!ks.length) return;
      ks.some((x) => !openSetRef.current.has(x)) ? revealAll() : rehideAll();
    };
    const runAutoMask = (levelKey) => {
      stopReadingAll(true); // 行オブジェクトが差し替わるため読みかけは打ち切る
      const lv = MASK_LEVELS.find((x) => x[0] === levelKey) || MASK_LEVELS[1];
      setMaskLevel(lv[0]);
      if (stRef.current.maskMode === "quiz") clearInkBecause("穴あきが かわったため"); // 穴が変わる=行内が動く
      onCommit((np) => autoMask(np, lv[2]));
      setOpenSet(new Set());
      doFlash("🎲 えらびました", "おまかせ「" + lv[1] + "」で穴あけしました");
    };
    const clearAllMask = () => {
      stopReadingAll(true);
      if (stRef.current.maskMode === "quiz") clearInkBecause("穴あきが かわったため");
      onCommit((np) => { np.lines.forEach((l) => { if (l.type === "lyric") l.mask = []; }); });
      setOpenSet(new Set());
      doFlash("穴を全部消しました", "おまかせ か ✎ でえらび直せます");
    };
    const cycleJaMode = () => {
      const nv = JA_ORDER[(JA_ORDER.indexOf(jaModeRef.current) + 1) % JA_ORDER.length];
      setJaMode(nv);
      doFlash("和訳: " + JA_MODE_LABELS[nv],
        nv === "cur" ? "いま歌っている行だけ表示" : nv === "all" ? "全部の行に表示" : "表示しません");
    };
    const bumpScale = (d) => { setSheetScale((s) => clamp(s + d, 0, SHEET_SIZES.length - 1)); wakeUi(); };
    const toggleAnnot = () => { // 💡 注釈の表示切替（G）。PV/シート共通
      wakeUi();
      const cnt = projRef.current.lines.filter((l) => l.type === "lyric" && ((l.notes || []).length || (l.point || "").trim())).length;
      if (!cnt) { doFlash("💡 この曲には注釈がありません", "②歌詞の行の 💡 から仕込めます"); return; }
      const nv = !stRef.current.annotOn;
      setAnnotOn(nv);
      doFlash(nv ? "💡 注釈を表示" : "💡 注釈をかくす", nv ? "歌詞の語の下に、意味がそっと出ます" : (student ? "💡 でいつでも出せます" : "G でいつでも出せます"));
    };
    const centerCur = () => {
      const body = sheetBodyRef.current;
      if (!body) return;
      const el = body.querySelector(".sheet-row.cur");
      if (el) body.scrollTop = Math.max(0, el.offsetTop - body.clientHeight * 0.35);
    };
    const sheetLineTap = (l, n) => {
      if (stRef.current.rec) { recLineTap(l); return; } // 🎙中の行タップ=はんいえらび
      wakeUi();
      stopReadingAll(true); // 歌う操作は読みを打ち切る
      const now = Date.now();
      const prevTap = lastTapRef.current;
      lastTapRef.current = { id: l.id, at: now };
      if (prevTap && prevTap.id === l.id && now - prevTap.at < 350) { sheetLoopTap(l, n, true); return; } // すばやく2回=ループ昇格
      if (AE._loop.on && AE._loop.lineId === l.id) { clearLoop(); AE.pause(); doFlash("⏹", "くり返しを止めました"); return; }
      if (AE.playing && segRef.current && segRef.current.lineId === l.id) { AE.pause(); segRef.current = null; return; } // 再生中の行を再タップ=停止
      playLineSegment(l);
    };
    const sheetLoopTap = (l, n, fromDouble) => {
      if (stRef.current.rec) return; // 🎙中はループしない（録音とぶつかるため）
      wakeUi();
      stopReadingAll(true);
      if (AE._loop.on && AE._loop.lineId === l.id) {
        if (!fromDouble) { clearLoop(); doFlash("🔁", "くり返し解除"); }
        return;
      }
      segRef.current = null;
      AE._loop = { on: true, lineId: l.id, start: Math.max(0, l.tStart - 0.5), end: Math.min(AE.duration || l.tEnd + 0.5, l.tEnd + 0.5) };
      lastPlayedRef.current = l.id;
      if (!fromDouble) AE.seek(AE._loop.start); // ダブルタップ昇格時は1回目の再生位置を保つ
      AE.play();
      doFlash("🔁 " + n + "行目", "くり返し中（もう一度タップで解除）");
    };
    const sheetWordTap = (tok, lineId, wi) => {
      if (stRef.current.rec) return; // 🎙中はTTSを鳴らさない（録音と行タップの迷いを増やさない）
      wakeUi();
      readStop(true); // 行よみあげ中の単語タップ=単語読みに切替（トレイは残す）
      const clean = tok.replace(/[^A-Za-z'’-]/g, "");
      if (!clean) return;
      const ok = TTS.speak(clean);
      spokenRef.current = { lineId, wi, until: Date.now() + 700 };
      if (!ok) doFlash("🔇", "この環境では読み上げできません");
    };

    /* ---------- 🔈 発音確認よみあげ（歌を止めて、行の英文をふつうの発音で朗読） ----------
       ・状態はreadRefに持ち、SheetView(100ms)/カード(80ms)/親(250ms)のtickが拾う
       ・中断はすべて「session世代を進める」＝古いonend/onboundary/タイマーは自然に死ぬ
       ・読み終わっても曲は再開しない（▶/スペースで先生のペース）・保存もしない */
    const buildReadText = (l) => { // 表示と同じenTokens基準で組む＝charIndex→単語の対応が崩れない
      const toks = enTokens(l.en);
      const map = []; // [{at,wi}] 読み上げ文字位置→単語番号
      let text = "";
      toks.forEach((tok, wi) => {
        if (!/[A-Za-z]/.test(tok)) return; // 「♪」などはTTSに渡さない
        if (text) text += " ";
        map.push({ at: text.length, wi });
        text += tok;
      });
      return { text, map };
    };
    const mapCharToWi = (map, ci) => {
      let wi = -1;
      for (const m of map) { if (m.at <= ci) wi = m.wi; else break; }
      return wi;
    };
    const holesRemain = (l) => stRef.current.sheetOn && stRef.current.maskMode === "quiz" &&
      (l.mask || []).some((wi) => !openSetRef.current.has(l.id + ":" + wi)); // 閉じた穴が残る行は読まない（音でネタバレするため）
    const openReadTray = () => { clearTimeout(readRef.current.trayTimer); setReadTrayOn(true); };
    // 読み終わっても自動では閉じない（何回も聞き直して音を確かめる画面なので、閉じるのは本人の操作だけ）
    const closeReadTray = () => { clearTimeout(readRef.current.trayTimer); setReadTrayOn(false); };
    const readStop = (silent) => { // 中断経路の唯一の出口
      const r = readRef.current;
      if (r.phase === "singing") { AE.pause(); segRef.current = null; } // うた⇔よみの歌ごと止める
      r.session++;
      clearTimeout(r.timer); clearTimeout(r.safeTimer); clearInterval(r.estTimer);
      const was = r.phase !== "idle";
      r.phase = "idle"; r.act = null; r.wi = -1; r.utter = null;
      try { window.speechSynthesis && speechSynthesis.cancel(); } catch (e) {}
      if (!silent && was) doFlash("⏹ よみあげを止めました", "");
    };
    const stopReadingAll = (silent) => { readStop(silent); closeReadTray(); }; // 歌う操作・画面切替から呼ぶ
    const playLineSegment = (l) => { // 行タップ=歌う の中核（🎵うた⇔よみ もこれを使う。停止は既存のseg監視）
      clearLoop();
      segRef.current = { lineId: l.id, end: Math.min(AE.duration || l.tEnd + 0.15, l.tEnd + 0.15) };
      lastPlayedRef.current = l.id;
      AE.seek(Math.max(0, l.tStart - 0.05));
      AE.play();
    };
    const speakPart = (l, text, map, onDone) => {
      const r = readRef.current, sid = r.session;
      const rate = r.slow ? 0.55 : 0.75; // ふつう=旧🐢の速さ・🐢はさらにゆっくり
      const u = TTS.makeUtterance(text, rate);
      r.utter = u; // Chromeはutteranceが回収されるとonendが来ないことがあるため参照を保持
      let done = false;
      u.onboundary = (e) => { // 来ない声もある（その場合は下の推定に落ちる）
        if (sid !== r.session || (e.name && e.name !== "word")) return;
        r.boundaryOk = true; // 以後はこちらが正（推定はこのフラグを見て黙る）
        r.wi = mapCharToWi(map, e.charIndex || 0);
      };
      // 単語の切れ目を通知しない声（iPadのSafari等に多い）でも「いま読んでいる語」が分かるよう、
      // 経過時間から読み位置を推定して点灯させる。発音を確かめる画面なので、光らないより近い位置を示す
      const est = setInterval(() => {
        if (sid !== r.session || done) { clearInterval(est); return; }
        if (r.boundaryOk || r.phase !== "speaking") return;
        // 0.94=ほんの少し先行させる（遅れると最後の語が光らないまま終わってしまうため）
        r.wi = mapCharToWi(map, (performance.now() - r.startedAt) / ((READ_CAL.msPerChar * 0.94) / rate));
      }, 80);
      r.estTimer = est;
      const fin = (natural) => {
        if (done || sid !== r.session) return;
        done = true;
        clearTimeout(r.safeTimer); clearInterval(est);
        r.wi = -1;
        const durMs = Math.max(0, performance.now() - r.startedAt);
        if (natural) calibrateRead(durMs, text.length, rate); // 最後まで読めた回だけを目安の校正に使う
        onDone(durMs);
      };
      u.onstart = () => { if (sid === r.session) r.startedAt = performance.now(); };
      u.onend = () => fin(true);
      u.onerror = () => fin(false); // 新しめのChromeは中断をerrorで通知する
      r.startedAt = performance.now();
      clearTimeout(r.safeTimer);
      r.safeTimer = setTimeout(() => fin(false), text.length * 120 + 4000); // onendが来ない環境でも固まらない保険
      try { speechSynthesis.cancel(); } catch (e) {}
      setTimeout(() => { if (sid === r.session) speechSynthesis.speak(u); }, 60); // cancel直後のspeakが無視されるChrome既知バグ対策
    };
    const startRead = (l, act) => { // act: read | compare(うた⇔よみ) | repeat(よみリピート)。成功でtrue
      if (!window.speechSynthesis) { doFlash("🔇", "この環境では読み上げできません"); return false; }
      if (stRef.current.sheetOn && stRef.current.maskMode === "edit") { doFlash("✎ 仕込み中はよめません", "✔ できあがり のあとでどうぞ"); return false; }
      if (holesRemain(l)) { doFlash("🔈 まだよめません", "かくした単語がのこっています（🔓 あけてからどうぞ）"); return false; }
      const { text, map } = buildReadText(l);
      if (!text) { doFlash("🔈 —", "この行に よめる英語がありません"); return false; }
      wakeUi();
      readStop(true);
      clearLoop();
      if (AE.playing) AE.pause(); // 歌を止める。読み終わっても勝手に再開しない
      const r = readRef.current, sid = r.session;
      r.phase = "speaking"; r.lineId = l.id; r.line = l; r.act = act; r.wi = -1; r.boundaryOk = false;
      lastPlayedRef.current = l.id;
      openReadTray();
      const finish = () => { // 読み終わってもトレイ・カードは出したまま（閉じるのは画面タップ・✕・Escだけ）
        if (sid !== r.session) return;
        r.phase = "idle"; r.act = null; r.wi = -1; r.utter = null;
      };
      speakPart(l, text, map, (durMs) => {
        if (sid !== r.session) return;
        if (act === "compare") {
          if (l.tStart == null) { doFlash("🎵 この行はまだ歌えません", "③同期でタイミングを付けると くらべられます"); finish(); return; }
          r.phase = "singing";
          playLineSegment(l); // 歌の停止自体は既存のseg監視が行う
          r.timer = setTimeout(finish, ((l.tEnd - l.tStart) + 0.8) * 1000);
        } else if (act === "repeat") {
          r.phase = "gap"; // 生徒がこえに出す間（読んだ長さぶん・最低1.2秒）
          r.timer = setTimeout(() => {
            if (sid !== r.session) return;
            r.phase = "speaking";
            speakPart(l, text, map, finish);
          }, Math.max(1200, durMs));
        } else finish();
      });
      return true;
    };
    const readRowTap = (l) => { // 行の🔈: よみあげ / もう一度おす=停止
      if (stRef.current.rec) { doFlash("🎙 録音モード中はよみあげはお休み", "✕ おわる のあとでどうぞ"); return; }
      const r = readRef.current;
      if (r.phase !== "idle" && r.lineId === l.id) { readStop(); return; }
      r.slow = false;
      startRead(l, "read");
    };
    const readTargetLine = () => { // R/Uの対象: トレイが出ていればその行、なければ今の行
      const r = readRef.current;
      if (readTrayRef.current && r.line) return r.line;
      return currentLine().cur;
    };
    const readCurrent = (slow) => { // R（PVの「🔈 よみ」も）。読み上げ中のR=停止・Shift+R=ゆっくり
      if (stRef.current.rec) { doFlash("🎙 録音モード中はよみあげはお休み", "✕ おわる のあとでどうぞ"); return; }
      const r = readRef.current;
      if (!slow && r.phase !== "idle") { readStop(); return; }
      const l = readTargetLine();
      if (!l) { doFlash("🔈 よめる行がありません", "曲を少しすすめて、行に入ってから どうぞ"); return; }
      r.slow = !!slow;
      if (startRead(l, "read") && !stRef.current.sheetOn)
        doFlash((r.slow ? "🐢 " : "🔈 ") + lineNumOf(l) + "行目をよみます", student ? "歌は止まったまま。▶ で再開できます" : "歌は止まったまま。▶（スペース）で再開できます");
    };
    const readCompare = () => { // U=うた⇔よみ
      if (stRef.current.rec) { doFlash("🎙 録音モード中はよみあげはお休み", "✕ おわる のあとでどうぞ"); return; }
      const r = readRef.current;
      const l = readTargetLine();
      if (!l) { doFlash("🔈 よめる行がありません", "曲を少しすすめて、行に入ってから どうぞ"); return; }
      if (r.line !== l) r.slow = false;
      if (startRead(l, "compare")) doFlash("🎵 うた⇔よみ", "よんでから、同じ行を歌でききます");
    };
    const trayAct = (act, slow) => { // トレイのボタン: 実行中にもう一度おす=停止（再タップ=止める）
      const r = readRef.current;
      if (!r.line) return;
      if (r.phase !== "idle" && r.act === act && (slow === undefined || r.slow)) { readStop(); return; }
      if (slow !== undefined) r.slow = slow;
      startRead(r.line, act);
    };
    const userPlayToggle = () => { // ▶ボタン・画面クリック・スペース共通（読み上げ/録音との交通整理）
      const rc = stRef.current.rec;
      if (rc) { // 🎙中の▶/スペース: 録音中=とめる・聞き直し=再生⇔停止・それ以外は曲を動かさない
        if (rc.phase === "rec") { recFinish(); return; }
        if (rc.phase === "review") { recPlayToggle(); return; }
        return;
      }
      const r = readRef.current;
      if (r.phase === "singing") { stopReadingAll(true); return; } // うた⇔よみの歌を止めるだけ
      stopReadingAll(true); // 読みかけは打ち切って、ふつうの再生/停止へ
      segRef.current = null;
      AE.toggle();
    };
    const wakeTapRef = useRef(false); // 生徒版: 「バーが消えた状態で始まったタップ」か（clickまでにReactが再描画しても判定がぶれないようrefに固定）
    const playerWake = () => { wakeTapRef.current = !stRef.current.uiOn; wakeUi(); };
    const stageTap = () => { // 生徒版: バーが消えている間の1回目のタップは「バーを出すだけ」（再生切替の誤爆防止）
      if (student && wakeTapRef.current) { wakeTapRef.current = false; return; }
      // 🔈よみ確認カードが出ている間は、画面タップ＝カードを閉じるだけ（曲は動かさない）。
      // 何回も聞き直せるよう自動では閉じないので、閉じる操作をここで受ける
      if (!stRef.current.sheetOn && readTrayRef.current) { stopReadingAll(true); return; }
      userPlayToggle();
    };
    const closeGuide = () => { setGuideOn(false); store.set(PLAYER_GUIDE_KEY, "1"); };

    /* ---------- ✎ ペン書き込み（その場かぎり・保存しない） ---------- */
    const exitPen = () => {
      setPenOn(false); wakeUi();
      doFlash("かきこみ おわり", "単語タップが もどりました（書いたものは残っています）");
    };
    const togglePen = () => {
      const st = stRef.current;
      if (st.rec) { doFlash("🎙 録音モード中はペンはお休み", "✕ おわる のあとでどうぞ"); return; }
      if (st.penOn) { exitPen(); return; }
      if (st.sheetOn && st.maskMode === "edit") endEdit(); // 仕込み中なら「✔できあがり」扱いで抜けてからペンへ（拒否しない）
      setPenOn(true); setVoicePop(false); setMaskPop(false); wakeUi();
      doFlash("✎ かきこみモード", st.sheetOn
        ? (student ? "1本ゆびで書く・2本ゆびでスクロール（✕でおわり・保存はされません）" : "1本ゆびで書く・2本ゆびでスクロール（P でおわり・保存はされません）")
        : (student ? "かきこみは今の行とセットでのこります（✕でおわり・保存はされません）" : "かきこみは今の行とセットでのこります（💾でこの曲に保存できます・P でおわり）"));
    };
    const penPickTool = (t) => {
      setPenTool(t); wakeUi();
      const label = (PEN_TOOLS.find((x) => x[0] === t) || PEN_TOOLS[0])[1];
      doFlash(label, t === "eraser" ? "線をなぞると まるごと消えます" : "");
    };
    const penCycleTool = () => { // Dキー: ペン→マーカー→けしゴム
      const i = PEN_TOOLS.findIndex((x) => x[0] === penStRef.current.tool);
      penPickTool(PEN_TOOLS[(i + 1) % PEN_TOOLS.length][0]);
    };
    const penPickColor = (c) => {
      setPenColor(c);
      if (penStRef.current.tool === "eraser") setPenTool("pen"); // けしゴム中に色を選んだら書く気なのでペンへ
      wakeUi();
      doFlash(PEN_COLOR_LABELS[c] + "にしました", "");
    };
    const penCycleColor = () => { // Cキー: 赤→黄→水色
      const i = PEN_COLOR_ORDER.indexOf(penStRef.current.color);
      penPickColor(PEN_COLOR_ORDER[(i + 1) % PEN_COLOR_ORDER.length]);
    };
    const penUndo = () => {
      const api = activeInkApi();
      if (api && api.undo()) doFlash("↩", "1つもどしました");
      else doFlash("—", "もどすものが ありません");
    };
    const penClearAll = () => {
      const api = activeInkApi();
      if (!api || !api.hasInk()) { doFlash("—", "消すものが ありません"); return; }
      api.clearAll(true);
      doFlash(stRef.current.sheetOn ? "🗑 ぜんぶ消しました" : "🗑 この画面のぶんを消しました", "↩ 1つもどす で復活できます");
    };
    const penSaveInk = () => { // 💾 PVの書き込みをぜんぶ（全行ぶん）この曲に保存。もう一度押すと今の状態で上書き＝保存からの消去もこれ
      const out = pvInkSave(pvInkRef.current.buckets, projRef.current);
      const nLines = Object.keys(out).length, nStrokes = Object.values(out).reduce((a, b) => a + b.length, 0);
      onCommit((np) => { if (nLines) np.pvInk = out; else delete np.pvInk; });
      doFlash(nLines ? "💾 とっておきました" : "💾 まっさらにしました",
        nLines ? nLines + "行に" + nStrokes + "本 — この曲といっしょに保存" : "とってあった書き込みも消しました");
    };
    const onInkNotify = useCallback((type) => { // インク層からの通知（memoを壊さないよう恒等安定）
      if (type === "bump") { userScrollRef.current = Date.now(); return; } // 描画中は自動追従を保留
      if (type === "layout-cleared") doFlash("かきこみを消しました", "画面の大きさが かわったため");
    }, []);

    /* ---------- 🎙 れんしゅう録音（その場かぎり・どこにも保存しない） ----------
       ・マイクは echoCancellation=ON ＝ スピーカーから流れる曲を打ち消して、声を中心に録る
       ・聞き直しは「🎵曲といっしょ」（声の再生に合わせて曲も同時再生）⇔「🎤声だけ」
       ・録音の実体はメモリ上のBlobだけ（保存/送信のコードがそもそも無い）。
         破棄= ✕おわる / 録り直し / 画面を出る / 授業モード終了 のすべてで即時 */
    const REC_NOTICE = [ // 文面は先生の指定どおり（変更しない）
      "録音は、歌の練習のためだけに使います。ふざけたり遊びで録音しないように。",
      "録音した歌声を、わらったり からかったり絶対しない。挑戦することを応援する練習にしよう。",
      "この録音はどこにも保存・送信されません。聞き終わったら消えます。",
    ];
    const recSupported = () => !!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia && window.MediaRecorder);
    const recMime = () => { // Safari=audio/mp4 / Chrome=webm。どちらも無ければブラウザおまかせ
      for (const m of ["audio/mp4", "audio/webm;codecs=opus", "audio/webm"]) {
        try { if (MediaRecorder.isTypeSupported(m)) return m; } catch (e) {}
      }
      return "";
    };
    const recDropTake = () => { // いまの録音（テイク）だけを破棄
      const io = recIO.current;
      if (io.voice) { try { io.voice.pause(); } catch (e) {} io.voice.onended = null; io.voice = null; }
      if (io.url) { try { URL.revokeObjectURL(io.url); } catch (e) {} io.url = null; }
      io.chunks = [];
    };
    const recReleaseAll = () => { // 録音もマイクも全部返す（画面上のマイク使用中マークも消える）
      const io = recIO.current;
      try { if (io.mr && io.mr.state !== "inactive") { io.mr.onstop = null; io.mr.stop(); } } catch (e) {}
      io.mr = null;
      recDropTake();
      try { io.stream && io.stream.getTracks().forEach((t) => t.stop()); } catch (e) {}
      io.stream = null; io.range = null;
    };
    const exitRec = (silent) => { // ✕おわる（唯一の出口。ここを通れば必ず消えている）
      if (AE.playing) AE.pause();
      segRef.current = null;
      recReleaseAll();
      setRec(null);
      if (!silent) doFlash("🎙 録音おわり", "録音は消えました（保存されていません）");
    };
    const toggleRec = () => { // 🎙ボタン
      if (stRef.current.rec) { exitRec(); return; }
      if (!recSupported()) { doFlash("🎙 この環境では録音できません", "新しめの Safari / Chrome でひらいてください"); return; }
      stopReadingAll(true);
      clearLoop();
      if (AE.playing) AE.pause();
      AE.setRate(1); // 0.5×のまま録ると聞き直しがズレるため通常速度へ
      setPenOn(false);
      if (stRef.current.maskMode === "edit") endEdit();
      setVoicePop(false); setMaskPop(false); setMorePop(false);
      wakeUi();
      setRec({ phase: "lock", bad: false }); // 🔓セーフティ鍵（先生のあいことば）→ 約束カード。どちらも毎回
    };
    /* 🔓 セーフティ鍵＝「きょうの日付8桁 + singsync」（例: 20260807singsync）。
       端末の日付から毎回その場で計算するので、あいことばは毎日自動で変わる。
       入力値・解錠状態はどこにも保存しない（stateすら使わず、成功したら次のカードへ進むだけ） */
    const recPassToday = () => {
      const d = new Date(), p = (n) => String(n).padStart(2, "0");
      return `${d.getFullYear()}${p(d.getMonth() + 1)}${p(d.getDate())}singsync`;
    };
    const recUnlockTry = () => {
      const el = recPassEl.current;
      const v = String((el && el.value) || "").normalize("NFKC").trim().toLowerCase(); // 全角数字・大文字・前後の空白は許す
      if (el) el.value = "";
      if (v === recPassToday()) { setRec({ phase: "notice" }); return; }
      setRec({ phase: "lock", bad: true });
      if (el) el.focus();
    };
    const recRequestMic = () => { // マイク許可（はんいをえらんでいる間に裏で準備）
      const io = recIO.current;
      if (io.stream && io.stream.getTracks().some((t) => t.readyState === "live")) return;
      navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: true, noiseSuppression: false, autoGainControl: true } })
        .then((s) => {
          if (!stRef.current.rec) { try { s.getTracks().forEach((t) => t.stop()); } catch (e) {} return; } // すでに✕おわる済み
          io.stream = s;
        })
        .catch(() => { if (stRef.current.rec) setRec({ phase: "err", kind: "mic" }); });
    };
    const recConfirmNotice = () => { // 「かくにんしました」→ はんいえらびへ
      setRec({ phase: "select", a: null, b: null });
      doFlash("🎙 はんいをえらぶ", "はじめの行 → おわりの行 をタップ");
      recRequestMic();
    };
    const recRange = (st) => { // a/b（タップ順）→ 同期済み歌詞行のはんい情報
      if (!st || !st.a) return null;
      const ls = lyricLines(projRef.current).filter((l) => l.tStart != null);
      const ia = ls.findIndex((l) => l.id === st.a);
      if (ia < 0) return null;
      const ibRaw = st.b ? ls.findIndex((l) => l.id === st.b) : ia;
      const ib = ibRaw < 0 ? ia : ibRaw;
      const i0 = Math.min(ia, ib), i1 = Math.max(ia, ib);
      const lines = ls.slice(i0, i1 + 1);
      return { lines, n0: i0 + 1, n1: i1 + 1, tA: lines[0].tStart, tB: lines[lines.length - 1].tEnd };
    };
    const recLineTap = (l) => { // 🎙中の行タップ（sheetLineTapから横取り）
      const st = stRef.current.rec;
      if (!st || st.phase !== "select") return; // ⏺中・聞き直し中は行タップを受けない（誤操作防止）
      if (l.tStart == null) { doFlash("—", "この行はまだ同期されていません"); return; }
      wakeUi();
      if (!st.a || st.b) setRec({ phase: "select", a: l.id, b: null }); // えらび直し（3回目のタップ=新しいはじめの行）
      else setRec({ phase: "select", a: st.a, b: l.id });
    };
    const recStart = () => { // ⏺ 録音スタート（歌い出しの2秒前から曲が流れる=カウントイン代わり）
      const st = stRef.current.rec, io = recIO.current;
      const r = recRange(st);
      if (!r) return;
      if (!io.stream || !io.stream.getTracks().some((t) => t.readyState === "live")) { setRec({ phase: "err", kind: "mic" }); return; }
      recDropTake();
      const t0 = Math.max(0, r.tA - 2.0);
      const end = Math.min(AE.duration || r.tB + 0.15, r.tB + 0.15);
      io.range = { t0, end, a: st.a, b: st.b };
      let mr = null;
      const mm = recMime();
      try { mr = new MediaRecorder(io.stream, mm ? { mimeType: mm } : undefined); }
      catch (e) { try { mr = new MediaRecorder(io.stream); } catch (e2) { setRec({ phase: "err", kind: "rec" }); return; } }
      io.mr = mr;
      mr.ondataavailable = (e) => { if (e.data && e.data.size) io.chunks.push(e.data); };
      mr.onstart = () => { AE.seek(t0); AE.play(); }; // 録音が実際に始まってから曲を流す=頭が切れない
      mr.onerror = () => { if (stRef.current.rec) { AE.pause(); setRec({ phase: "err", kind: "rec" }); } };
      mr.onstop = () => {
        const blob = new Blob(io.chunks, { type: mr.mimeType || "audio/mp4" });
        io.chunks = []; io.mr = null;
        if (!stRef.current.rec) return; // すでに✕おわる済み（何も残さない）
        if (blob.size < 1500) { setRec({ phase: "err", kind: "rec" }); return; }
        io.url = URL.createObjectURL(blob);
        const a = new Audio(io.url);
        a.onended = () => { // 声が終わったら曲も止め、▶に戻す
          if (AE.playing) AE.pause();
          setRec((cur) => (cur && cur.phase === "review" ? { ...cur, playing: false } : cur));
        };
        io.voice = a;
        setRec({ phase: "review", a: io.range.a, b: io.range.b, withMusic: true, playing: false });
        doFlash("🎧 きいてみよう", "▶ で聞き直し・🎤声だけ にも切りかえられます");
      };
      setRec({ phase: "rec", a: st.a, b: st.b });
      try { mr.start(); } catch (e) { setRec({ phase: "err", kind: "rec" }); return; }
      setTimeout(() => { // onstartが来ない環境の保険（曲が始まらないまま固まらない）
        const s2 = stRef.current.rec;
        if (s2 && s2.phase === "rec" && io.mr === mr && !AE.playing) { AE.seek(t0); AE.play(); }
      }, 350);
    };
    const recFinish = () => { // はんいのおわり/⏹ → 残響を0.25秒だけ録ってから締める
      const io = recIO.current;
      if (AE.playing) AE.pause();
      const mr = io.mr;
      if (!mr || mr.state === "inactive") return;
      setTimeout(() => { try { if (mr.state !== "inactive") mr.stop(); } catch (e) {} }, 250);
    };
    const recCancelTake = () => { // ⏺中の✕＝この録音は使わずに、はんいえらびへ戻る
      const io = recIO.current;
      if (AE.playing) AE.pause();
      try { if (io.mr && io.mr.state !== "inactive") { io.mr.onstop = null; io.mr.stop(); } } catch (e) {}
      io.mr = null; io.chunks = [];
      const st = stRef.current.rec;
      setRec({ phase: "select", a: st ? st.a : null, b: st ? st.b : null });
      doFlash("録音をやめました", "この録音はのこっていません");
    };
    const recStopPlay = () => {
      const io = recIO.current;
      if (io.voice) { try { io.voice.pause(); io.voice.currentTime = 0; } catch (e) {} }
      if (AE.playing) AE.pause();
      setRec((cur) => (cur && cur.phase === "review" ? { ...cur, playing: false } : cur));
    };
    const recPlayToggle = () => { // ▶きく / ⏸とめる
      const st = stRef.current.rec, io = recIO.current;
      if (!st || st.phase !== "review" || !io.voice) return;
      if (st.playing) { recStopPlay(); return; }
      try { io.voice.currentTime = 0; } catch (e) {}
      if (st.withMusic && io.range) AE.seek(io.range.t0);
      const p = io.voice.play();
      (p && p.then ? p : Promise.resolve())
        .then(() => { // 録ったときと同じ順番（録音開始→曲）で追いかけさせ、ズレを打ち消す
          const s2 = stRef.current.rec;
          if (s2 && s2.phase === "review" && s2.withMusic && io.range) AE.play();
        })
        .catch(() => {});
      setRec({ ...st, playing: true });
    };
    const recSetMusic = (withMusic) => { // 🎵曲といっしょ ⇔ 🎤声だけ
      const st = stRef.current.rec;
      if (!st || st.phase !== "review" || st.withMusic === withMusic) return;
      recStopPlay();
      setRec({ ...st, withMusic, playing: false });
      doFlash(withMusic ? "🎵 曲といっしょ" : "🎤 声だけ", withMusic ? "録ったときと同じ聞こえ方できけます" : "自分たちの声を たしかめよう");
    };
    const recRetake = () => { // 🔁もう一度うたう（いまの録音は消して同じはんいで録り直し）
      recStopPlay();
      recDropTake();
      recStart();
    };
    recFnRef.current = { finish: recFinish };

    /* キーボード（授業モード専用。編集側のショートカットは App が present 中は無効化） */
    useEffect(() => {
      const onKey = (e) => {
        const tag = e.target.tagName;
        if (tag === "INPUT" || tag === "TEXTAREA" || tag === "SELECT" || e.target.isContentEditable) return;
        if (e.metaKey || e.ctrlKey || e.altKey) return;
        const st = stRef.current;
        wakeUi();
        if (st.rec) { // 🎙 録音モード中は専用キーだけ（行ジャンプ等で録音がズレないように）
          if (e.code === "Space") { if (!e.repeat) { e.preventDefault(); userPlayToggle(); } return; }
          if (e.key === "Escape") {
            if (st.rec.phase === "rec") { recCancelTake(); return; } // ⏺中のEsc=この録音をやめる
            exitRec(); return;
          }
          const k0 = e.key.toLowerCase();
          if (k0 === "t") { cycleJaMode(); return; } // 見た目の切替だけは生かす
          if (k0 === "g") { toggleAnnot(); return; }
          return;
        }
        if (e.key >= "0" && e.key <= "9" && !e.repeat) {
          e.preventDefault();
          setBuffer((b) => (b + e.key).slice(0, 3));
          clearTimeout(bufTimer.current);
          bufTimer.current = setTimeout(() => setBuffer(""), 5000);
          return;
        }
        if (e.key === "Backspace") { setBuffer((b) => b.slice(0, -1)); return; }
        if (e.key === "Enter") {
          e.preventDefault();
          if (st.buffer) {
            const n = parseInt(st.buffer, 10);
            setBuffer(""); clearTimeout(bufTimer.current);
            if (n > 0) jumpToNum(n);
          } else { // Enter単独 = いまの行の頭から
            const { cur } = currentLine();
            if (cur) jumpToLine(cur, lineNumOf(cur));
          }
          return;
        }
        if (e.code === "Space") { if (!e.repeat) { e.preventDefault(); userPlayToggle(); } return; }
        if (e.key === "ArrowLeft" || e.key === "ArrowUp") { e.preventDefault(); step(-1); return; }
        if (e.key === "ArrowRight" || e.key === "ArrowDown") { e.preventDefault(); step(1); return; }
        const k = e.key.toLowerCase();
        if (k === "j") { toggleSheet(); return; }
        if (k === "k" && st.sheetOn) { toggleQuiz(); return; }               // K=かくす（穴あき）
        if (k === "a" && st.sheetOn && st.maskMode === "quiz") { revealOrRehide(); return; } // A=あける
        if (k === "e" && st.sheetOn) { if (!student) toggleEdit(); return; } // E=えらぶ（仕込み・生徒版では無効）
        if (k === "p") { togglePen(); return; }                              // P=ペン（かきこみ・シート/PV共通）
        if (k === "d" && st.penOn) { penCycleTool(); return; }               // D=道具
        if (k === "c" && st.penOn) { penCycleColor(); return; }              // C=色
        if (k === "z" && st.penOn) { penUndo(); return; }                    // Z=1つもどす
        if (k === "r") { readCurrent(e.shiftKey); return; }                  // R=よみあげ（Shift+R=ゆっくり）
        if (k === "u") { readCompare(); return; }                            // U=うた⇔よみ
        if (k === "g") { toggleAnnot(); return; }                            // G=語義・注釈（ごぎ）
        if (k === "l") { toggleLoopHere(); return; }
        if (k === "s") { toggleRate(); return; }
        if (k === "t") { if (stRef.current.sheetOn) cycleJaMode(); else toggleJa(); return; }
        if (k === "n") { toggleNum(); return; }
        if (k === "m") { cycleNext(); return; }
        if (k === "b") { setBlack((v) => !v); return; }
        if (k === "f") { toggleFs(); return; }
        if (e.key === "Escape") {
          if (st.morePop) { setMorePop(false); return; }
          if (st.voicePop) { setVoicePop(false); return; }
          if (st.maskPop) { setMaskPop(false); return; }
          if (readRef.current.phase !== "idle") { readStop(); closeReadTray(); return; } // 🔈読み上げを止める
          if (readTrayRef.current) { closeReadTray(); return; } // よみトレイをしまう
          if (st.buffer) { setBuffer(""); return; }
          if (st.black) { setBlack(false); return; }
          if (st.penOn) { exitPen(); return; } // ペンを置く（インクは残る）
          if (st.maskMode === "edit") { endEdit(); return; } // 仕込み中のEsc=できあがり（穴あき自体はEscで解除しない）
          if (st.sheetOn) { setSheetOn(false); TTS.stop(); return; }
          onExit();
        }
      };
      window.addEventListener("keydown", onKey);
      return () => window.removeEventListener("keydown", onKey);
    }, []);

    /* シークバー（クリック・ドラッグ） */
    const seekFromEvent = (e, el) => {
      const rect = el.getBoundingClientRect();
      const p = clamp((e.clientX - rect.left) / rect.width, 0, 1);
      AE.seek(p * (AE.duration || 0));
    };
    const onSeekDown = (e) => {
      e.preventDefault();
      if (stRef.current.rec) return; // 🎙中のシークは録音がズレるので受けない
      stopReadingAll(true);
      clearLoop();
      const el = e.currentTarget;
      try { el.setPointerCapture(e.pointerId); } catch (e2) {}
      seekFromEvent(e, el);
      const move = (ev) => seekFromEvent(ev, el);
      const up = () => { el.removeEventListener("pointermove", move); el.removeEventListener("pointerup", up); };
      el.addEventListener("pointermove", move);
      el.addEventListener("pointerup", up);
    };

    const { cur } = currentLine();
    const curNum = cur ? lineNumOf(cur) : null;
    const readActive = readRef.current.phase !== "idle"; // 表示は250msのtickが追従
    const recSel = (() => { // 🎙 シートに渡す範囲ハイライト情報
      if (!rec || !sheetOn) return null;
      const within = rec.phase === "select" || rec.phase === "rec" || rec.phase === "review";
      const r = within ? recRange(rec) : null;
      return { phase: rec.phase, set: new Set(r ? r.lines.map((l) => l.id) : []) };
    })();
    const rate = AE.el.playbackRate;
    const maskCount = countMasks(project);
    const annotLines = project.lines.filter((l) => l.type === "lyric" && ((l.notes || []).length || (l.point || "").trim())).length; // 💡注釈のある行数（0ならボタンも出さない）
    const anyClosed = maskMode === "quiz" && allHoleKeys().some((k) => !openSet.has(k));
    let num = 0;
    return html`
      <div className=${"present-root" + (uiOn ? "" : " hideui") + (penOn ? " pen-on" : "")} onMouseMove=${wakeUi}
        onPointerDown=${student ? playerWake : undefined}>
        <div className=${"present-stage" + (penOn && !sheetOn ? " pen-active" + (penTool === "eraser" ? " pen-eraser" : "") : "")}
          style=${penOn && !sheetOn && penTool !== "eraser" ? { "--penc": PEN_COLORS[penColor] } : undefined}
          onClick=${stageTap}>
          <canvas ref=${canvasRef} width=${CANVAS_W} height=${CANVAS_H}></canvas>
          ${!sheetOn && html`<${PvInkLayer} inkRef=${pvInkRef} penStRef=${penStRef} inkApiRef=${pvInkApiRef} projRef=${projRef} ov2Ref=${ov2Ref} />`}
        </div>
        ${!sheetOn && html`<${PvReadCard} readRef=${readRef} projRef=${projRef} open=${readTrayOn} penOn=${penOn} />`}
        ${!sheetOn && annotOn && annotLines > 0 && !black && html`<${PvAnnot} projRef=${projRef} ov2Ref=${ov2Ref} canvasRef=${canvasRef} />`}
        ${(buffer || flash) && html`
          <div className="present-flash">
            ${buffer
              ? html`${buffer}<span className="sub2">Enter で ${parseInt(buffer, 10)}行目へ（Esc で取消）</span>`
              : html`${flash.main}${flash.sub ? html`<span className="sub2">${flash.sub}</span>` : null}`}
          </div>`}
        <div className="present-ui" onClick=${(e) => e.stopPropagation()}>
          ${penOn && html`
            <div className="pen-tray">
              ${PEN_TOOLS.map(([t, label]) => html`
                <button key=${t} className=${"present-btn" + (penTool === t ? " on" : "")} onClick=${() => penPickTool(t)}
                  title=${t === "pen" ? "ふつうの線（D で道具切替）" : t === "hl" ? "すけて見える太い線" : "線をなぞると まるごと消える"}>${label}</button>`)}
              <span className="pt-sep"></span>
              ${PEN_COLOR_ORDER.map((c) => html`
                <button key=${c} className=${"pen-sw" + (penColor === c ? " on" : "") + (penTool === "eraser" ? " dim" : "")}
                  style=${{ background: PEN_COLORS[c] }} onClick=${() => penPickColor(c)} title=${PEN_COLOR_LABELS[c] + "（C で色切替）"}></button>`)}
              <span className="pt-sep"></span>
              <button className="present-btn" onClick=${penUndo} title="直前の線をとりけす（Z）">↩ 1つもどす</button>
              <button className="present-btn" onClick=${penClearAll}
                title=${sheetOn ? "書いたものを全部消す（↩ でもどせる）" : "いま見えている行の書き込みを消す（↩ でもどせる・ほかの行のぶんは残る）"}>
                ${sheetOn ? "🗑 ぜんぶ消す" : "🗑 この画面を消す"}</button>
              ${!sheetOn && !student && html`
                <button className="present-btn" onClick=${penSaveInk}
                  title="ぜんぶの行の書き込みを、この曲にいっしょに保存する（もう一度押すと今の状態で上書き＝消してから押せば保存からも消える）">💾 とっておく</button>`}
              <span className="pt-sep"></span>
              <button className="present-btn" onClick=${exitPen} title="ペンをおいて、タップ操作にもどる（P / Esc）">✕ かきこみ おわり</button>
            </div>`}
          <div className="present-seek" onPointerDown=${onSeekDown} title="クリックで移動">
            <div className="track"><div className="fill" style=${{ width: (clamp(AE.t() / (AE.duration || 1), 0, 1) * 100) + "%" }}></div></div>
          </div>
          <div className="present-bar">
            <button className="present-btn play" onClick=${userPlayToggle} title="再生 / 一時停止（スペース）">${AE.playing ? "⏸" : "▶"}</button>
            <span className="time tnum">${fmtTime(AE.t())} / ${fmtTime(AE.duration)}</span>
            ${student && !sheetOn && html`<button className="present-btn" onClick=${() => step(-1)} title="前の行へ">◀ 前</button>`}
            ${curNum != null && html`<span className="cur-line tnum">${curNum}行目</span>`}
            ${student && !sheetOn && html`<button className="present-btn" onClick=${() => step(1)} title="次の行へ">次 ▶</button>`}
            <span className="spacer"></span>
            <button className=${"present-btn" + (readActive ? " read-on" : "")} onClick=${() => readCurrent(false)}
              title="いまの行を ふつうの発音でよみあげ（R / Shift+R=ゆっくり）">${readActive ? "⏹ よみ" : "🔈 よみ"}</button>
            <button className=${"present-btn" + (AE._loop.on ? " on" : "")} onClick=${toggleLoopHere} title="いまの行をループ再生（L）">🔁 行ループ</button>
            <button className=${"present-btn" + (rate !== 1 ? " on" : "")} onClick=${toggleRate} title="ゆっくり再生 0.5×（S）">🐢 0.5×</button>
            ${sheetOn
              ? html`
                <button className=${"present-btn" + (jaMode !== "none" ? " on" : "")} onClick=${cycleJaMode}
                  title=${"和訳の表示を切替（T）いま: " + JA_MODE_LABELS[jaMode]}>和訳:${JA_MODE_LABELS[jaMode]}</button>
                <button className="present-btn" onClick=${() => bumpScale(-1)} disabled=${sheetScale === 0} title="文字を小さく">A−</button>
                <button className="present-btn" onClick=${() => bumpScale(1)} disabled=${sheetScale === SHEET_SIZES.length - 1} title="文字を大きく">A+</button>
                <button className=${"present-btn" + (maskMode !== "off" ? " on" : "")} onClick=${maskBtnTap}
                  title="単語をかくして穴あきリスニング（K）">${maskMode !== "off" ? "⬚ 穴あき中" : maskCount > 0 ? "⬚ 穴あき·" + maskCount : "⬚ 穴あき"}</button>
                <button className=${"present-btn" + (penOn ? " on" : "")} onClick=${togglePen}
                  title="歌詞に丸や線を書ける（P）その場かぎりで、保存されません">${penOn ? "✎ かきこみ中" : "✎ かきこみ"}</button>
                <button className=${"present-btn" + (rec ? " rec-on" : "")} onClick=${toggleRec}
                  title=${rec ? "録音モードをおわる（録音は消えます）" : "れんしゅう録音（歌って聞き直す・どこにも保存されません）"}>${rec ? "🎙 録音中" : "🎙 録音"}</button>
                ${!student && html`<button className=${"present-btn" + (voicePop ? " on" : "")} onClick=${() => setVoicePop((v) => !v)}
                  title="単語読み上げの声をえらぶ">🗣 声</button>`}`
              : html`
                <button className=${"present-btn" + (ov2.showJa ? " on" : "")} onClick=${toggleJa} title="和訳の表示 / 非表示（T）">和訳</button>
                ${!student && html`<button className=${"present-btn" + (ov2.lineNumbers ? " on" : "")} onClick=${toggleNum} title="行番号の表示 / 非表示（N）">行番号</button>`}
                ${!student && html`<button className=${"present-btn" + ((ov2.nextPreview || "single") !== "single" ? " on" : "")} onClick=${cycleNext}
                  title=${"次の行の表示を切替（M）いま: " + NEXT_PREVIEW_LABELS[ov2.nextPreview || "single"]}>次行</button>`}
                <button className=${"present-btn" + (penOn ? " on" : "")} onClick=${togglePen}
                  title="画面に丸や線を書ける（P）その場かぎりで、保存されません">${penOn ? "✎ かきこみ中" : "✎ かきこみ"}</button>`}
            ${annotLines > 0 && html`<button className=${"present-btn" + (annotOn ? " annot-on" : "")} onClick=${toggleAnnot}

  function PlayerBoot({ st, onStart }) {
    const [slow, setSlow] = useState(false);
    useEffect(() => { // 15秒たっても読み込み中ならひとこと（学校Wi-Fi対策）
      if (st.phase !== "loading") { setSlow(false); return; }
      const t = setTimeout(() => setSlow(true), 15000);
      return () => clearTimeout(t);
    }, [st.phase]);
    const mb = (n) => (n / 1048576).toFixed(1);
    if (st.phase === "error") {
      const E = PLAYER_ERRORS[(st.error && st.error.kind) || "load"] || PLAYER_ERRORS.load;
      return html`
        <div className="pb-root">
          <div className="pb-note">♪</div>
          <div className="pb-err-h">${E.h}</div>
          <div className="pb-msg">${E.m}</div>
          ${E.retry && html`<button className="pb-start" onClick=${() => location.reload()}>もう一度よみこむ</button>`}
          ${st.error && st.error.detail && html`<div className="pb-detail">くわしい情報: ${st.error.detail}</div>`}
          <div className="pb-credit">SingSync プレイヤー</div>
        </div>`;
    }
    if (st.phase === "title") {
      return html`

          <div className="pb-credit">SingSync プレイヤー</div>
        </div>`;
    }
    const pct = st.phase === "preparing" ? 100 : (st.total > 0 ? Math.min(99, Math.round((st.received / st.total) * 100)) : null);
    return html`
      <div className="pb-root">
        <div className="pb-note pulse">♪</div>
        <div className="pb-msg">${st.phase === "preparing" ? "曲の準備をしています…" : "曲をよみこんでいます…"}</div>

      </div>`;
  }
