<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>SingSync</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800&family=Inter:wght@400;600;700&family=Noto+Sans+JP:wght@400;500;700;900&family=Playfair+Display:wght@600&family=Noto+Serif+JP:wght@400;600&family=Poppins:wght@700&family=M+PLUS+1p:wght@500&family=Archivo+Black&family=Lora:wght@500&family=Zen+Maru+Gothic:wght@500&display=swap" rel="stylesheet">
<style>
/* ============================================================
   SingSync — デザインシステム（ダークテーマ単一）
   ============================================================ */
:root{
  --bg-app:#0F1115;
  --bg-panel:#171A21;
  --bg-elevated:#1E2230;
  --border:#2A2F3C;
  --text-primary:#EDEFF5;
  --text-secondary:#9AA3B5;
  --text-disabled:#5A6172;
  --accent:#7C6CFF;
  --accent-hover:#8F80FF;
  --accent-soft:rgba(124,108,255,.16);
  --success:#3DDC97;
  --warning:#FFB454;
  --danger:#FF6B6B;
  --read:#4DB8FF;               /* 🔈よみあげ=水色（歌の紫・仕込みの橙と混ざらない専用色） */
  --read-soft:rgba(77,184,255,.16);
  --annot:#E8C97E;              /* 💡注釈=シャンパンゴールド（穴あきの橙とは部位・彩度で区別） */
  --annot-soft:rgba(232,201,126,.12);
  --annot-line:rgba(232,201,126,.32);
  --wave:#3A4150;
  --radius-btn:8px;
  --radius-card:12px;
  --radius-modal:16px;
  --font-ui:"Inter","Noto Sans JP",-apple-system,"Hiragino Kaku Gothic ProN","Yu Gothic UI",sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  background:var(--bg-app);color:var(--text-primary);
  font-family:var(--font-ui);font-size:14px;line-height:1.6;
  overflow:hidden;
  -webkit-font-smoothing:antialiased;
}
#root{height:100vh;display:flex;flex-direction:column}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;font-size:14px}
button:disabled{cursor:not-allowed}
input,textarea,select{
  font-family:inherit;font-size:14px;color:var(--text-primary);
  background:var(--bg-app);border:1px solid var(--border);border-radius:var(--radius-btn);
  padding:8px 12px;outline:none;
}
input:focus,textarea:focus,select:focus{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:#2E3442;border-radius:5px;border:2px solid var(--bg-panel)}
::-webkit-scrollbar-track{background:transparent}
.tnum{font-variant-numeric:tabular-nums}

/* ---------- レイアウトシェル ---------- */
.app-shell{display:flex;flex-direction:column;height:100vh}
.app-header{
  height:56px;flex:none;display:flex;align-items:center;gap:16px;
  padding:0 16px;background:var(--bg-panel);border-bottom:1px solid var(--border);
  z-index:20;
}
.app-logo{display:flex;align-items:center;gap:8px;font-weight:700;font-size:15px;white-space:nowrap;cursor:pointer;user-select:none}
.app-logo .note{color:var(--accent);font-size:18px}
.proj-name{
  color:var(--text-secondary);font-size:13px;max-width:180px;overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap;cursor:pointer;border-radius:6px;padding:4px 8px;
}
.proj-name:hover{background:var(--bg-elevated);color:var(--text-primary)}
.header-right{margin-left:auto;display:flex;align-items:center;gap:10px}
.save-status{font-size:12px;color:var(--text-secondary);white-space:nowrap}
.save-status.ok{color:var(--success)}
.save-status.warn{color:var(--warning)}

/* ---------- ステップタブ ---------- */
.step-tabs{display:flex;align-items:center;gap:2px;margin:0 auto}
.step-tab{
  display:flex;align-items:center;gap:7px;padding:8px 14px;border-radius:8px;
  color:var(--text-secondary);font-size:13px;font-weight:600;position:relative;
  transition:background .15s,color .15s;white-space:nowrap;
}
.step-tab:hover:not(:disabled){background:var(--bg-elevated);color:var(--text-primary)}
.step-tab.active{color:var(--text-primary)}
.step-tab.active::after{
  content:"";position:absolute;left:14px;right:14px;bottom:-1px;height:2px;
  background:var(--accent);border-radius:2px;
}
.step-tab:disabled{color:var(--text-disabled)}
.step-num{
  width:20px;height:20px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  font-size:11px;font-weight:700;background:var(--bg-elevated);color:var(--text-secondary);flex:none;
}
.step-tab.active .step-num{background:var(--accent);color:#fff}
.step-tab.done .step-num{background:rgba(61,220,151,.18);color:var(--success)}
.step-tab.working .step-num{background:rgba(255,180,84,.18);color:var(--warning)}
.step-tab:disabled .step-num{background:var(--bg-elevated);color:var(--text-disabled)}

/* ---------- フッター ---------- */
.app-footer{
  height:48px;flex:none;display:flex;align-items:center;gap:16px;
  padding:0 16px;background:var(--bg-panel);border-top:1px solid var(--border);z-index:20;
}
.footer-hint{font-size:12px;color:var(--text-secondary);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.footer-next{margin-left:auto;flex:none}

/* ---------- ボタン ---------- */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  height:40px;padding:0 20px;border-radius:var(--radius-btn);
  font-weight:600;font-size:14px;transition:background .15s,transform .05s,border-color .15s;
  white-space:nowrap;user-select:none;
}
.btn:active:not(:disabled){transform:scale(.98)}
.btn-primary{background:var(--accent);color:#fff}
.btn-primary:hover:not(:disabled){background:var(--accent-hover)}
.btn-primary:disabled{background:var(--bg-elevated);color:var(--text-disabled)}
.btn-secondary{border:1px solid var(--border);color:var(--text-primary);background:transparent}
.btn-secondary:hover:not(:disabled){border-color:var(--text-secondary);background:var(--bg-elevated)}
.btn-secondary:disabled{color:var(--text-disabled)}
.btn-text{color:var(--text-secondary);height:32px;padding:0 10px;border-radius:6px}
.btn-text:hover:not(:disabled){color:var(--text-primary);background:var(--bg-elevated)}
.btn-danger{background:var(--danger);color:#fff}
.btn-sm{height:30px;padding:0 12px;font-size:13px}
.btn-icon{width:32px;height:32px;padding:0;border-radius:6px;color:var(--text-secondary);flex:none}
.btn-icon:hover:not(:disabled){background:var(--bg-elevated);color:var(--text-primary)}

/* ---------- 汎用 ---------- */
.panel{background:var(--bg-panel);border:1px solid var(--border);border-radius:var(--radius-card)}
.screen{flex:1;min-height:0;overflow:auto;display:flex;flex-direction:column}
.screen-center{flex:1;min-height:0;overflow:auto;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:32px}
.h1{font-size:20px;font-weight:600}
.h2{font-size:16px;font-weight:600}
.sub{color:var(--text-secondary);font-size:13px}
.chip{
  display:inline-flex;align-items:center;font-size:11px;font-weight:600;padding:2px 8px;
  border-radius:999px;background:var(--bg-elevated);color:var(--text-secondary);
}
.chip.accent{background:var(--accent-soft);color:var(--accent-hover)}
.chip.warn{background:rgba(255,180,84,.15);color:var(--warning)}
.banner{
  display:flex;align-items:center;gap:10px;padding:10px 16px;font-size:13px;
  background:rgba(255,180,84,.1);color:var(--warning);border-bottom:1px solid var(--border);
}

/* ---------- トグル ---------- */
.toggle{position:relative;width:40px;height:22px;border-radius:11px;background:var(--border);transition:background .15s;flex:none}
.toggle.on{background:var(--accent)}
.toggle .knob{
  position:absolute;top:2px;left:2px;width:18px;height:18px;border-radius:50%;
  background:#fff;transition:left .15s;
}
.toggle.on .knob{left:20px}
.toggle-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:8px 0}

/* ---------- セグメント ---------- */
.segmented{display:inline-flex;background:var(--bg-app);border:1px solid var(--border);border-radius:8px;padding:2px;gap:2px}
.segmented button{padding:5px 14px;border-radius:6px;font-size:13px;color:var(--text-secondary);font-weight:600}
.segmented button.on{background:var(--accent);color:#fff}
.segmented button:hover:not(.on){color:var(--text-primary)}

/* ---------- モーダル ---------- */
.modal-backdrop{
  position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:100;
  display:flex;align-items:center;justify-content:center;padding:24px;
}
.modal{
  background:var(--bg-elevated);border:1px solid var(--border);border-radius:var(--radius-modal);
  box-shadow:0 8px 32px rgba(0,0,0,.45);max-width:640px;width:100%;
  max-height:calc(100vh - 80px);display:flex;flex-direction:column;
}
.modal-head{display:flex;align-items:center;padding:18px 24px 0;gap:12px}
.modal-body{padding:16px 24px;overflow:auto}
.modal-foot{display:flex;justify-content:flex-end;gap:10px;padding:0 24px 20px}
.modal-close{margin-left:auto}

/* ---------- トースト ---------- */
.toast-wrap{position:fixed;right:20px;bottom:64px;z-index:200;display:flex;flex-direction:column;gap:8px}
.toast{
  display:flex;align-items:center;gap:12px;background:var(--bg-elevated);
  border:1px solid var(--border);border-radius:10px;padding:12px 16px;
  box-shadow:0 8px 32px rgba(0,0,0,.45);font-size:13px;
  animation:toastIn .2s ease-out;max-width:420px;
}
@keyframes toastIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.toast .action{color:var(--accent-hover);font-weight:600;flex:none}

/* ---------- ホーム画面 ---------- */
.home-title{font-size:28px;font-weight:700;display:flex;align-items:center;gap:12px}
.home-sub{color:var(--text-secondary);margin-top:6px}
.home-cards{display:flex;gap:16px;margin-top:36px;flex-wrap:wrap;justify-content:center}
.home-card{
  width:260px;padding:24px;text-align:left;background:var(--bg-panel);
  border:1px solid var(--border);border-radius:var(--radius-card);
  transition:border-color .15s,transform .1s;
}
.home-card:hover{border-color:var(--accent);transform:translateY(-2px)}
.home-card .ic{font-size:26px}
.home-card .t{font-weight:600;font-size:15px;margin-top:10px}
.home-card .d{color:var(--text-secondary);font-size:12px;margin-top:4px}
.recent-card{
  margin-top:36px;width:552px;max-width:90vw;padding:16px 20px;display:flex;align-items:center;gap:14px;
  background:var(--bg-panel);border:1px solid var(--border);border-radius:var(--radius-card);
}

/* ---------- 取り込み画面 ---------- */
.dropzone{
  width:680px;max-width:90%;min-height:260px;border:2px dashed var(--border);border-radius:var(--radius-card);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;
  color:var(--text-secondary);transition:border-color .15s,background .15s;text-align:center;padding:24px;
}
.dropzone.drag{border-color:var(--accent);background:var(--accent-soft);color:var(--text-primary)}
.audio-card{width:680px;max-width:90%;padding:20px 24px}
.wave-thumb{width:100%;height:56px;display:block;margin:12px 0}

/* ---------- 歌詞画面 ---------- */
.lyrics-wrap{flex:1;min-height:0;display:flex;flex-direction:column;padding:20px 24px;gap:12px;max-width:1200px;width:100%;margin:0 auto}
.lyrics-toolbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.lyrics-table-wrap{flex:1;min-height:0;overflow:auto;border:1px solid var(--border);border-radius:var(--radius-card);background:var(--bg-panel)}
table.lyrics{width:100%;border-collapse:collapse}
table.lyrics th{
  position:sticky;top:0;background:var(--bg-elevated);z-index:2;
  font-size:12px;font-weight:600;color:var(--text-secondary);text-align:left;
  padding:10px 12px;border-bottom:1px solid var(--border);
}
table.lyrics td{border-bottom:1px solid var(--border);padding:4px 8px;vertical-align:middle}
table.lyrics tr:hover td{background:rgba(255,255,255,.02)}
table.lyrics tr:hover .row-tools{opacity:1}
.row-num{width:44px;text-align:center;color:var(--text-secondary);font-size:12px}
.cell-input{width:100%;border:1px solid transparent;background:transparent;padding:7px 8px;border-radius:6px}
.cell-input:hover{border-color:var(--border)}
.cell-input:focus{border-color:var(--accent);background:var(--bg-app);box-shadow:none}
.cell-warn{color:var(--warning);font-size:11px;padding:0 8px 4px}
/* 💡 注釈の仕込み（02歌詞・行の直下に開くアコーディオン） */
.cell-annot{color:var(--annot);font-size:11px;padding:0 8px 4px;cursor:pointer;user-select:none}
.cell-annot:hover{text-decoration:underline}
.btn-icon.annot-has{color:var(--annot)}
.annot-edit-row td{background:rgba(232,201,126,.05)}
.ae-box{display:flex;flex-direction:column;gap:8px;padding:8px 4px}
.ae-head{display:flex;align-items:center;gap:10px;font-size:12px;color:var(--text-secondary);flex-wrap:wrap}
.ae-head .t{color:var(--annot);font-weight:700;font-size:13px}
.ae-toks{display:flex;flex-wrap:wrap;gap:6px}
.ae-tok{padding:3px 10px;border-radius:999px;border:1px dashed var(--border);color:var(--text-secondary);
  font-size:13px;cursor:pointer;background:none}
.ae-tok:hover{border-color:var(--annot);color:var(--text-primary)}
.ae-tok.has{border:1px solid var(--annot-line);background:var(--annot-soft);color:var(--text-primary)}
.ae-tok.has b{color:var(--annot);font-weight:700}
.ae-tok.sel{border:1px solid var(--annot);background:var(--annot-soft);color:var(--text-primary)}
.ae-tok.ext{border-style:dashed;border-color:var(--annot-line)}
.ae-tok.ext::before{content:"＋";margin-right:4px;color:var(--annot);font-size:11px;font-weight:700}
.ae-tok .x{margin-left:6px;color:var(--text-disabled)}
.ae-tok .x:hover{color:var(--danger)}
.ae-input-row{display:flex;align-items:center;gap:8px;font-size:13px;flex-wrap:wrap}
.ae-input-row input{width:240px}
.ae-point-row{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--text-secondary);flex-wrap:wrap}
.ae-point-row input{flex:1;max-width:520px;min-width:220px}
.ae-hint{font-size:11px;color:var(--text-disabled)}
.gap-row td{color:var(--text-disabled);font-size:12px;text-align:center;letter-spacing:2px;background:rgba(255,255,255,.015)}
.row-tools{opacity:0;display:flex;gap:2px;transition:opacity .1s;justify-content:flex-end;width:132px}

/* ---------- 同期画面 ---------- */
.sync-wrap{flex:1;min-height:0;display:flex;flex-direction:column}
.sync-top{flex:1;min-height:0;display:flex;gap:1px;background:var(--border)}
.sync-preview-pane{flex:58;min-width:0;background:var(--bg-app);display:flex;flex-direction:column;padding:16px;gap:10px}
.sync-list-pane{flex:42;min-width:280px;background:var(--bg-panel);display:flex;flex-direction:column}
.preview-box{position:relative;width:100%;aspect-ratio:16/9;background:#000;border-radius:10px;overflow:hidden}
.preview-box canvas{display:block;width:100%;height:100%;object-fit:contain}
.preview-flex{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;overflow:hidden}
.preview-flex .preview-box{width:auto;height:100%;max-width:100%}
.transport{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.transport .time{font-size:13px;color:var(--text-secondary)}
.offset-ctl{display:flex;align-items:center;gap:6px;margin-left:auto}
.offset-btn{
  padding:3px 8px;border-radius:6px;border:1px solid var(--border);cursor:pointer;
  background:var(--bg-elevated);color:var(--text-secondary);font-size:11px;font-weight:600;
}
.offset-btn:hover{color:var(--text-primary);border-color:var(--accent)}
.offset-val{font-size:11px;color:var(--text-disabled);min-width:64px;text-align:center;cursor:pointer}
.offset-val.on{color:var(--accent-hover);font-weight:700}
.play-btn{
  width:38px;height:38px;border-radius:50%;background:var(--accent);color:#fff;
  display:flex;align-items:center;justify-content:center;font-size:15px;flex:none;
}
.play-btn:hover{background:var(--accent-hover)}
.list-head{display:flex;align-items:center;gap:8px;padding:12px 14px;border-bottom:1px solid var(--border);flex:none}
.lyr-list{flex:1;min-height:0;overflow:auto;padding:6px}
.lyr-row{
  display:flex;align-items:center;gap:8px;width:100%;padding:7px 10px;border-radius:8px;
  text-align:left;font-size:13px;position:relative;
}
.lyr-row:hover{background:var(--bg-elevated)}
.lyr-row.sel{background:var(--accent-soft)}
.lyr-row.sel .lr-en{color:var(--text-primary)}
.lyr-row .lr-num{width:24px;flex:none;text-align:right;color:var(--text-disabled);font-size:11px}
.lyr-row .lr-time{width:64px;flex:none;font-size:12px;color:var(--text-secondary);border-radius:4px;padding:1px 4px}
.lyr-row .lr-time:hover{background:var(--bg-app);color:var(--text-primary)}
.lyr-row .lr-time.unsync{color:var(--text-disabled)}
.lyr-row .lr-en{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--text-secondary)}
.lyr-row .lr-tools{display:none;gap:2px;flex:none}
.lyr-row:hover .lr-tools{display:flex}
.lyr-row .loop-badge{color:var(--accent-hover);font-size:11px;flex:none}
.timeline-pane{flex:none;height:220px;background:var(--bg-panel);border-top:1px solid var(--border);display:flex;flex-direction:column}
.timeline-bar{display:flex;align-items:center;gap:8px;padding:6px 12px;flex:none}
.timeline-canvas-wrap{flex:1;min-height:0;position:relative}
.timeline-canvas-wrap canvas{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:default}

/* ---------- タップ同期オーバーレイ ---------- */
.tap-overlay{
  position:fixed;inset:0;background:var(--bg-app);z-index:90;
  display:flex;flex-direction:column;padding:20px 40px;
}
.tap-head{display:flex;align-items:center;gap:14px;flex:none}
.tap-body{flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;text-align:center}
.tap-label{font-size:13px;font-weight:600;color:var(--text-secondary)}
.tap-label .stamp{color:var(--success);margin-left:10px}
.tap-slot{min-height:128px;width:100%;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:8px}
.tap-line{
  font-weight:700;line-height:1.35;padding:14px 36px;border-radius:16px;
  border:1px solid var(--border);background:var(--bg-panel);max-width:90%;
  transition:background .12s,border-color .12s;white-space:pre-line;
}
.tap-line .ja{font-size:15px;font-weight:400;color:var(--text-secondary);margin-top:6px}
.tap-sung{font-size:30px;border-color:rgba(61,220,151,.45);background:rgba(61,220,151,.06)}
.tap-sung.flash{background:rgba(61,220,151,.28);border-color:var(--success)}
.tap-current{font-size:36px;border-color:var(--accent)}
.tap-next{color:var(--text-disabled);font-size:15px;min-height:24px}
.tap-foot{flex:none;display:flex;flex-direction:column;gap:10px}
.tap-wave{width:100%;height:48px;display:block}
.tap-progress{display:flex;align-items:center;gap:12px;font-size:13px;color:var(--text-secondary)}
.tap-progress .bar{flex:1;height:6px;border-radius:3px;background:var(--bg-elevated);overflow:hidden}
.tap-progress .bar .fill{height:100%;background:var(--accent);transition:width .2s}
.tap-keys{display:flex;gap:20px;justify-content:center;color:var(--text-secondary);font-size:13px;padding-bottom:6px}
.kbd{
  display:inline-block;padding:1px 8px;border-radius:5px;border:1px solid var(--border);
  background:var(--bg-elevated);font-size:12px;font-weight:600;margin-right:6px;
}
.countdown{
  position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  font-size:140px;font-weight:800;color:var(--accent);z-index:5;background:rgba(15,17,21,.85);
}
.countdown span{animation:countPop .9s ease-out}
@keyframes countPop{0%{transform:scale(1.6);opacity:0}25%{transform:scale(1);opacity:1}85%{opacity:1}100%{opacity:.2}}

/* ---------- 授業モード（プレゼンテーション） ---------- */
.present-root{position:fixed;inset:0;z-index:300;background:#000;overflow:hidden;
  --cw:min(100vw,177.78vh);--ch:min(100vh,56.25vw)} /* キャンバス実寸（レターボックス対応の注釈配置に使う） */
.present-root.hideui{cursor:none}
.present-stage{position:absolute;inset:0;display:flex;align-items:center;justify-content:center}
.present-stage canvas{width:min(100vw,177.78vh);height:min(100vh,56.25vw);display:block}
.present-ui{
  position:absolute;left:0;right:0;bottom:0;padding:26px 22px 14px;
  background:linear-gradient(rgba(0,0,0,0),rgba(0,0,0,.82));
  display:flex;flex-direction:column;gap:10px;transition:opacity .25s;z-index:10;
}
.present-root.hideui .present-ui{opacity:0;pointer-events:none}
.present-seek{height:14px;display:flex;align-items:center;cursor:pointer;touch-action:none}
.present-seek .track{position:relative;flex:1;height:5px;border-radius:3px;background:rgba(255,255,255,.22)}
.present-seek .fill{position:absolute;left:0;top:0;bottom:0;background:var(--accent);border-radius:3px}
.present-seek:hover .track{height:8px}
.present-bar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;position:relative}
.present-bar .time{font-size:14px;color:#fff;opacity:.9;white-space:nowrap}
.present-bar .cur-line{
  font-size:13px;font-weight:700;color:#fff;background:rgba(255,255,255,.14);
  border-radius:999px;padding:4px 12px;white-space:nowrap;
}
.present-bar .spacer{flex:1}
.present-btn{
  height:36px;padding:0 12px;border-radius:8px;font-size:13px;font-weight:600;
  color:rgba(255,255,255,.88);background:rgba(255,255,255,.10);white-space:nowrap;
}
.present-btn:hover{background:rgba(255,255,255,.22)}
.present-btn.on{background:var(--accent);color:#fff}
.present-btn.play{width:46px;font-size:17px;flex:none}
.present-keys{font-size:12px;color:rgba(255,255,255,.55);text-align:center}
.present-keys .kbd{background:rgba(255,255,255,.10);border-color:rgba(255,255,255,.2);color:rgba(255,255,255,.85)}
.present-flash{
  position:absolute;top:7%;left:50%;transform:translateX(-50%);z-index:12;
  font-size:56px;font-weight:800;color:#fff;background:rgba(0,0,0,.62);
  padding:10px 34px;border-radius:18px;text-align:center;white-space:nowrap;
  pointer-events:none;font-variant-numeric:tabular-nums;
}
.present-flash .sub2{display:block;font-size:15px;font-weight:600;color:rgba(255,255,255,.75);margin-top:2px}
.present-list{
  position:absolute;inset:0;z-index:20;background:rgba(0,0,0,.55);
  display:flex;align-items:center;justify-content:center;padding:5vh 6vw;
}
.present-list-panel{
  background:rgba(18,20,28,.96);border:1px solid rgba(255,255,255,.15);border-radius:16px;
  width:min(760px,100%);max-height:100%;display:flex;flex-direction:column;overflow:hidden;
  box-shadow:0 16px 64px rgba(0,0,0,.6);
}
.present-list-head{display:flex;align-items:center;gap:12px;padding:14px 20px;border-bottom:1px solid rgba(255,255,255,.12);flex:none}
.present-list-body{overflow:auto;padding:8px}
.present-list-row{
  display:flex;align-items:baseline;gap:14px;width:100%;text-align:left;
  padding:9px 14px;border-radius:10px;color:rgba(255,255,255,.9);font-size:16px;
}
.present-list-row:hover{background:rgba(255,255,255,.10)}
.present-list-row.cur{background:var(--accent-soft);outline:1px solid var(--accent)}
.present-list-row.unsync{opacity:.4}
.present-list-row .n{width:34px;text-align:right;font-weight:800;color:var(--accent-hover);flex:none}
.present-list-row .tm{width:56px;font-size:12px;color:rgba(255,255,255,.5);flex:none}
.present-list-row .en{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.present-list-row .gap-label{color:rgba(255,255,255,.35);letter-spacing:2px;font-size:13px}
.present-black{position:absolute;inset:0;z-index:30;background:#000}
.present-black .hint{
  position:absolute;right:22px;bottom:18px;font-size:12px;color:rgba(255,255,255,.4);
  animation:blackHint 3s forwards;
}
@keyframes blackHint{0%{opacity:1}70%{opacity:1}100%{opacity:0}}
.present-btn:disabled{opacity:.35}

/* ---------- 歌詞シート（授業モード内・タップで歌う教科書ページ） ---------- */
.present-sheet{position:absolute;inset:0;z-index:5;background:var(--bg-app);overflow-y:auto;overscroll-behavior:contain}
.sheet-inner{max-width:1560px;margin:0 auto;padding:34px 64px 190px}
.sheet-head{display:flex;align-items:baseline;gap:16px;margin-bottom:14px}
.sheet-head .t{font-size:20px;font-weight:700;color:var(--text-secondary);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sheet-head .legend{margin-left:auto;font-size:14px;color:var(--text-disabled);white-space:nowrap}
.sheet-gap{display:flex;align-items:center;justify-content:center;gap:10px;color:rgba(255,255,255,.3);letter-spacing:2px;font-size:15px;padding:12px 0 14px}
.sheet-row{
  display:grid;grid-template-columns:56px 1fr 112px;align-items:center;
  min-height:var(--shMin,84px);padding:10px 16px 12px;border-radius:14px;margin-bottom:6px;
  border:1px solid transparent;cursor:pointer;
}
.sheet-row:hover{background:rgba(255,255,255,.05)}
.sheet-row.cur{background:var(--accent-soft);border-color:var(--accent)}
.sheet-row.last{background:rgba(124,108,255,.08)}
.sheet-row.unsync{opacity:.4;cursor:default}
.sheet-row .n{
  align-self:start;margin-top:.4em;justify-self:end;margin-right:14px;
  font-size:var(--shN,20px);font-weight:800;color:var(--accent-hover);
}
.sheet-row.cur .n{color:#fff;background:var(--accent);border-radius:8px;padding:2px 9px;margin-top:.3em}
.sheet-en{font-size:var(--shEn,34px);font-weight:600;line-height:1.45;color:var(--text-primary);word-break:break-word}
.sheet-row.cur .sheet-en{color:rgba(255,255,255,.45)}
.sheet-w{position:relative;display:inline-block;padding:1px 4px;margin:0 .18em .1em 0;border-radius:6px;cursor:pointer}
.sheet-w:hover{background:rgba(255,255,255,.12)}
.sheet-w.done{color:#fff}
.sheet-w.spoken{background:var(--accent-soft);color:var(--accent-hover)}
.sheet-w .wipe{
  position:absolute;left:0;top:0;bottom:0;padding:1px 0 1px 4px;overflow:hidden;
  white-space:nowrap;color:#fff;pointer-events:none;transition:width .1s linear;
}
.sheet-ja{font-size:var(--shJa,22px);color:var(--text-secondary);margin-top:4px;line-height:1.5}
.sheet-row.cur .sheet-ja{color:rgba(255,255,255,.8)}
/* 💡 注釈（歌詞シート・カレント行の下にそっと出る脚注。行の最下部に足す=英語・和訳上のインクは単語からずれない） */
.sheet-annot{margin-top:8px;display:flex;flex-wrap:wrap;align-items:center;gap:6px 8px;
  animation:annotIn2 .4s cubic-bezier(.22,1,.36,1)}
@keyframes annotIn2{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.sheet-annot .annot-chip{display:inline-flex;align-items:baseline;gap:.4em;padding:2px 12px;border-radius:999px;
  font-size:var(--shAn,17px);background:var(--annot-soft);border:1px solid var(--annot-line);line-height:1.5}
.sheet-annot .aw{color:var(--annot);font-weight:700}
.sheet-annot .sep{color:rgba(255,255,255,.35)}
.sheet-annot .am{color:rgba(255,255,255,.85)}
.sheet-annot .annot-point{flex-basis:100%;font-size:var(--shAn,17px);color:rgba(255,255,255,.82);text-align:left}
.sheet-annot .lamp{opacity:.9;margin-right:.35em}
.sheet-loop{
  justify-self:end;width:52px;height:44px;border-radius:10px;font-size:19px;
  background:rgba(255,255,255,.07);color:rgba(255,255,255,.85);
}
.sheet-loop:hover{background:rgba(255,255,255,.2)}
.sheet-loop.on{background:var(--accent);color:#fff}

/* 穴あきリスニング（単語マスク）
   ・mk-closed=閉じた穴: 文字transparent＋inset影の下線（borderだと行高が変わるためbox-shadow）
   ・ワイプ(.wipe)は白文字オーバーレイなので、穴の上では文字も透明にして下線色だけ進める（ネタバレ防止） */
.sheet-w.mk-pick{background:rgba(255,170,60,.22);box-shadow:inset 0 -3px 0 rgba(255,170,60,.85);border-radius:4px}
.sheet-w.mk-closed,.sheet-w.mk-closed.done{color:transparent}
.sheet-w.mk-closed{background:rgba(255,255,255,.07);box-shadow:inset 0 -3px 0 rgba(255,255,255,.55);border-radius:4px;min-width:2.2em}
.sheet-w.mk-closed:hover{background:rgba(255,255,255,.14)}
.sheet-row.cur .sheet-w.mk-closed{box-shadow:inset 0 -3px 0 rgba(255,255,255,.78)}
.sheet-w.mk-closed .wipe{color:transparent;box-shadow:inset 0 -3px 0 var(--accent)}
.sheet-w.mk-open{animation:mkReveal .3s ease-out;box-shadow:inset 0 -2px 0 rgba(124,108,255,.55);border-radius:4px;min-width:2.2em} /* min-widthを閉時と揃え、開閉で行内が動かない=ペンのインクがずれない */
@keyframes mkReveal{
  0%{opacity:0;transform:translateY(4px);background:rgba(124,108,255,.35)}
  60%{background:rgba(124,108,255,.22)}
  100%{opacity:1;transform:none;background:transparent}
}
.mask-banner{
  position:absolute;left:0;right:0;top:0;z-index:6;display:flex;align-items:center;justify-content:center;gap:14px;
  padding:10px 18px;background:rgba(214,138,38,.94);color:#fff;font-size:15px;font-weight:700;flex-wrap:wrap;
}
.mask-banner .mb-count{background:rgba(0,0,0,.25);border-radius:999px;padding:3px 12px}
.mask-banner .mb-done{height:34px;padding:0 16px;border-radius:8px;background:#fff;color:#8a5410;font-weight:800}
.mask-banner .mb-done:hover{background:#ffe9cf}
.mask-pill{
  position:absolute;left:26px;bottom:150px;z-index:11;height:46px;padding:0 20px;border-radius:999px;
  background:var(--accent);color:#fff;font-size:15px;font-weight:700;box-shadow:0 6px 24px rgba(0,0,0,.5);
}
.mask-pill:hover{background:var(--accent-hover)}
.mask-pop .mp-sec{font-size:11px;font-weight:700;color:rgba(255,255,255,.55);padding:6px 4px 2px}
.mask-pop .mp-row{display:flex;gap:6px}
.mask-pop .mp-row .voice-btn{flex:1;justify-content:center;text-align:center}
.mask-pop .mp-main{margin-top:6px;min-height:38px;border-radius:8px;background:var(--accent);color:#fff;font-size:14px;font-weight:800}
.mask-pop .mp-main:hover{background:var(--accent-hover)}
.mask-pop .mp-main.stop{background:rgba(255,255,255,.12)}
.mask-pop .mp-main.stop:hover{background:rgba(255,255,255,.22)}
.sheet-follow{
  position:absolute;right:26px;bottom:150px;z-index:11;height:46px;padding:0 20px;border-radius:999px;
  background:var(--accent);color:#fff;font-size:15px;font-weight:700;box-shadow:0 6px 24px rgba(0,0,0,.5);
}
.sheet-follow:hover{background:var(--accent-hover)}

/* ✎ ペン書き込み（フェーズ3・その場かぎり）
   ・インクはSVG（1ストローク=1path）。行ごとの<g>に載せ、行が動けばインクもついていく（行アンカー）
   ・ペンモード中だけ .ink-svg がポインタを受ける＝単語タップ/行タップは構造的に発火しない
   ・巨大canvasを使わないのはメモリとiOSのcanvas面積上限（配布版）対策 */
.ink-svg{position:absolute;left:0;top:0;width:100%;display:block;overflow:visible;pointer-events:none}
.present-sheet.pen-active .ink-svg{pointer-events:auto;touch-action:none;cursor:crosshair;user-select:none;-webkit-user-select:none}
.present-sheet.pen-active{outline:3px solid var(--penc,#ff5d5d);outline-offset:-3px}
.present-sheet.pen-active.pen-eraser{outline-style:dashed;outline-color:rgba(255,255,255,.6)}
.pen-tray{display:flex;align-items:center;justify-content:center;gap:8px;flex-wrap:wrap;padding:2px 18px 8px;position:relative;z-index:7}
.pen-tray .pt-sep{width:1px;height:26px;background:rgba(255,255,255,.18);margin:0 4px}
.pen-sw{width:40px;height:40px;border-radius:50%;border:3px solid rgba(255,255,255,.25);padding:0;cursor:pointer}
.pen-sw.on{border-color:#fff;box-shadow:0 0 0 3px rgba(0,0,0,.4)}
.pen-sw.dim{opacity:.35}
.present-root.pen-on .mask-pill,.present-root.pen-on .sheet-follow{bottom:206px} /* トレイのぶん上げる */
/* PV画面のペン=行つきガラス板方式（インクは「そのとき歌っていた行」にひもづき、行が替わると引っこみ・巻き戻すと出てくる）。
   svgはviewBox=1920×1080でcanvasと同じ座標系＝リサイズしても線が歌詞からずれない */
.present-stage .ink-svg{height:100%}
.present-stage.pen-active{outline:3px solid var(--penc,#ff5d5d);outline-offset:-3px}
.present-stage.pen-active.pen-eraser{outline-style:dashed;outline-color:rgba(255,255,255,.6)}
.present-stage.pen-active .ink-svg{pointer-events:auto;touch-action:none;cursor:crosshair;user-select:none;-webkit-user-select:none}

/* 🔈 発音確認よみあげ（歌を止めて行の英文をふつうの発音で朗読・よみ=水色）
   ・UIは全部オーバーレイ＝行の高さを変えない（ペンのインクを消さないため）
   ・読んでいる単語の点灯は onboundary が取れる声のみ（取れない声は行の点灯だけ） */
.sheet-actions{display:flex;gap:8px;align-items:center;justify-content:flex-end;justify-self:end}
.sheet-actions .slot{width:52px;height:44px}
.sheet-read{width:52px;height:44px;border-radius:10px;font-size:19px;flex:none;
  background:rgba(255,255,255,.07);color:rgba(255,255,255,.85)}
.sheet-read:hover{background:rgba(255,255,255,.2)}
.sheet-read:disabled{opacity:.25}
.sheet-read.reading{background:var(--read);color:#06131f}
.sheet-row.reading{background:var(--read-soft);border-color:var(--read)} /* .curより後に定義=読み上げが勝つ */
.sheet-row.reading .n{color:var(--read)}
.sheet-w.read-now{background:rgba(77,184,255,.4);color:#fff}
.read-tray{position:absolute;left:50%;transform:translateX(-50%);bottom:150px;z-index:11;
  display:flex;align-items:center;gap:8px;padding:8px 12px;border-radius:16px;flex-wrap:wrap;
  justify-content:center;max-width:92vw;background:rgba(20,22,34,.97);
  border:1px solid rgba(255,255,255,.16);box-shadow:0 6px 24px rgba(0,0,0,.5)}
.read-tray .rt-line{font-size:14px;font-weight:800;color:var(--read);padding:0 6px;white-space:nowrap}
.read-tray .rt-btn,.rec-tray .rt-btn{height:40px;padding:0 14px;border-radius:999px;font-size:14px;font-weight:700;
  color:rgba(255,255,255,.9);background:rgba(255,255,255,.10);white-space:nowrap}
.read-tray .rt-btn:hover,.rec-tray .rt-btn:hover{background:rgba(255,255,255,.22)}
.read-tray .rt-btn.on{background:var(--read);color:#06131f}
.read-tray .rt-x,.rec-tray .rt-x{width:36px;height:40px;border-radius:10px;background:rgba(255,255,255,.07);color:rgba(255,255,255,.7)}
.read-tray .rt-x:hover,.rec-tray .rt-x:hover{background:rgba(255,255,255,.2)}
.present-root.pen-on .read-tray{bottom:206px} /* ペンのトレイのぶん上げる */
.present-btn.read-on{background:var(--read);color:#06131f}

/* 🎙 れんしゅう録音（その場かぎり・どこにも保存しない）
   ・録音の実体はメモリ上のBlobだけ。保存/送信ボタンはそもそも作らない
   ・録音色=ローズ（よみ水色・穴あき橙・アクセント紫と取り違えない4色目） */
.present-btn.rec-on{background:#e2506a;color:#fff}
.rec-banner{position:absolute;top:14px;left:50%;transform:translateX(-50%);z-index:12;display:flex;align-items:center;gap:12px;
  background:linear-gradient(135deg,#b23b55,#8e2f49);color:#fff;font-size:15px;font-weight:700;
  border-radius:999px;padding:8px 12px 8px 18px;box-shadow:0 8px 28px rgba(0,0,0,.45);max-width:94vw;flex-wrap:wrap;justify-content:center}
.rec-banner .rb-dot{width:12px;height:12px;border-radius:50%;background:rgba(255,255,255,.45);flex:none}
.rec-banner .rb-dot.on{background:#ff4d5e;animation:recPulse 1s infinite}
@keyframes recPulse{0%,100%{opacity:1}50%{opacity:.25}}
.rec-banner .rb-main{height:38px;padding:0 18px;border-radius:999px;background:#fff;color:#8e2f49;font-weight:800;font-size:15px}
.rec-banner .rb-main:disabled{opacity:.45}
.rec-banner .rb-main:hover:not(:disabled){background:#ffe3e9}
.rec-banner .rb-x{height:38px;padding:0 14px;border-radius:999px;background:rgba(0,0,0,.25);color:#fff;font-weight:700}
.rec-banner .rb-x:hover{background:rgba(0,0,0,.45)}
.sheet-row.rec-sel{background:rgba(226,80,106,.13);box-shadow:inset 4px 0 0 #e2506a}
.sheet-row.rec-live{background:rgba(226,80,106,.22);box-shadow:inset 4px 0 0 #ff4d5e}
.rec-tray{position:absolute;left:50%;transform:translateX(-50%);bottom:150px;z-index:11;
  display:flex;align-items:center;gap:8px;padding:10px 14px;border-radius:16px;flex-wrap:wrap;
  justify-content:center;max-width:94vw;background:rgba(30,17,22,.97);
  border:1px solid rgba(226,80,106,.5);box-shadow:0 10px 34px rgba(0,0,0,.5)}
.rec-tray .rt-btn.on{background:#e2506a;color:#fff}
.rec-tray .rec-note{flex-basis:100%;text-align:center;font-size:12px;font-weight:600;color:rgba(255,255,255,.55)}
.rec-notice{position:absolute;inset:0;z-index:60;background:rgba(0,0,0,.74);display:flex;align-items:center;justify-content:center;padding:20px}
.rec-notice-card{background:var(--bg-panel);border:1px solid var(--border);border-radius:16px;max-width:600px;padding:26px 30px;font-size:16px}
.rec-notice-card .rn-mic{font-size:36px;text-align:center}
.rec-notice-card .rn-head{font-weight:800;font-size:18px;margin:4px 0 12px;text-align:center}
.rec-notice-card .rn-item{padding:6px 0 6px 14px;border-left:4px solid #e2506a;margin:10px 0;line-height:1.9}
.rec-notice-card .rn-btns{display:flex;gap:10px;margin-top:20px;justify-content:center;flex-wrap:wrap}
.rec-notice-card .rn-go{height:50px;padding:0 26px;border-radius:12px;background:#e2506a;color:#fff;font-weight:800;font-size:16px}
.rec-notice-card .rn-go:hover{background:#c9435c}
.rec-notice-card .rn-no{height:50px;padding:0 18px;border-radius:12px;background:rgba(255,255,255,.08);color:#b8bdc9}
.rec-notice-card .rn-no:hover{background:rgba(255,255,255,.18)}
.rec-notice-card .rn-passrow{display:flex;gap:8px;margin-top:16px}
.rec-notice-card .rn-pass{flex:1;min-width:0;height:50px;border-radius:12px;border:1px solid var(--border);background:rgba(255,255,255,.06);color:#fff;font-size:18px;padding:0 14px;text-align:center;letter-spacing:1px}
.rec-notice-card .rn-pass:focus{outline:2px solid #e2506a;border-color:transparent}
.rec-notice-card .rn-show{height:50px;padding:0 14px;border-radius:12px;background:rgba(255,255,255,.08);color:#b8bdc9;font-size:13px;white-space:nowrap}
.rec-notice-card .rn-show:hover{background:rgba(255,255,255,.18)}
.rec-notice-card .rn-bad{color:#ff8c9e;text-align:center;margin-top:10px;font-weight:700}
.rec-notice-card .rn-sub{color:#8b93a5;font-size:13px;text-align:center;margin-top:10px}
.pv-read-card{position:absolute;left:50%;top:42%;transform:translate(-50%,-50%);z-index:8;
  max-width:min(1100px,88vw);padding:24px 38px;text-align:center;pointer-events:none;
  background:rgba(10,12,20,.8);border:2px solid var(--read);border-radius:18px}
.pv-read-card.tapable{pointer-events:auto} /* カード自身のタップでは閉じない（閉じるのは画面＝カードの外） */
.pv-read-card .h{font-size:15px;font-weight:700;color:var(--read);margin-bottom:10px}
.pv-read-card .en{font-size:clamp(26px,3.4vw,44px);font-weight:700;line-height:1.45;color:#fff;word-break:break-word}
.pv-read-card .w{display:inline-block;padding:1px 7px;border-radius:8px;transition:background .08s linear}
/* いま読んでいる語: 色＋下線の二重表示（下線はinset影＝行の高さが動かない） */
.pv-read-card .w.now{background:rgba(77,184,255,.42);box-shadow:inset 0 -5px 0 var(--read);color:#fff}
.pv-read-card .hint{font-size:14px;color:rgba(255,255,255,.55);margin-top:12px}

/* 💡 語義・文法の注釈v2（PV画面）。canvasは書き出しと共用なので触らず、DOMオーバーレイ。
   指定した語/フレーズの下にプリセットのアクセント色の下線＋すぐ下の余白にグロス（単語アンカー方式）。
   座標とフォントサイズはJSがcanvas実寸から算出してインライン指定・CSSは色/質感/動きだけを持つ */
.pv-annot2{position:absolute;z-index:6;pointer-events:none;transition:opacity .25s ease-in}
.pv-annot2.out{opacity:0}
.pv-annot2 .an-underline{position:absolute;height:var(--an-h,3px);border-radius:var(--an-r,2px);background:var(--an-ac);
  transform-origin:left;animation:anLine .35s cubic-bezier(.22,1,.36,1) 0s backwards} /* すっと引かれる（遅延なし=先行表示と合わせて早めに）*/
.pv-annot2 .an-gloss{position:absolute;white-space:nowrap;line-height:1.35;
  color:var(--an-fg);background:var(--an-bg,transparent);border-radius:8px;padding:.08em .5em;
  animation:anGloss .3s ease-out .32s backwards}                                        /* 一呼吸おいてふわっと */
.pv-annot2 .an-point{position:absolute;white-space:nowrap;line-height:1.4;color:var(--an-pt);
  animation:anGloss .3s ease-out .42s backwards}
@keyframes anLine{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes anGloss{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
@keyframes anGlossSoft{from{opacity:0}to{opacity:1}}
/* ── プリセット別の衣装（書体はJS側ANNOT_STYLESと対で管理） ── */
.pv-annot2.preset-aurora{--an-ac:linear-gradient(90deg,#22D3EE,#8B5CF6);--an-h:4px;--an-fg:#DDE3F8;--an-pt:#B9C0D4}
.pv-annot2.preset-aurora .an-gloss,.pv-annot2.preset-aurora .an-point{text-shadow:0 1px 6px rgba(0,0,0,.65)}
.pv-annot2.preset-cinema{--an-ac:rgba(255,217,142,.85);--an-fg:#EFE6CD;--an-pt:#CFC8B8}
.pv-annot2.preset-cinema .an-gloss{letter-spacing:.03em}
.pv-annot2.preset-cinema .an-gloss,.pv-annot2.preset-cinema .an-point{text-shadow:0 1px 4px rgba(0,0,0,.7)}
.pv-annot2.preset-classroom{--an-ac:repeating-linear-gradient(90deg,#2563EB 0 6px,transparent 6px 11px);--an-fg:#26324B;--an-pt:#3B4250;
  --an-bg:rgba(255,255,255,.9)}                                   /* 明るい教室背景→白ピルで可読性を担保 */
.pv-annot2.preset-classroom .an-gloss,.pv-annot2.preset-classroom .an-point{background:var(--an-bg);
  border:1px solid rgba(37,99,235,.28);box-shadow:0 2px 8px rgba(15,23,42,.12)}
.pv-annot2.preset-neon{--an-ac:#00E5FF;--an-fg:#D9FBFF;--an-pt:#9AA3B8}
.pv-annot2.preset-neon .an-underline{box-shadow:0 0 8px rgba(0,229,255,.55);animation:anLine .22s cubic-bezier(.22,1,.36,1) 0s backwards,anNeon .35s ease-out .22s backwards}
.pv-annot2.preset-neon .an-gloss{text-shadow:0 0 10px rgba(0,229,255,.35),0 1px 4px rgba(0,0,0,.7)}
@keyframes anNeon{from{box-shadow:0 0 16px rgba(0,229,255,.95)}to{box-shadow:0 0 8px rgba(0,229,255,.55)}}
.pv-annot2.preset-bold{--an-ac:#FFC531;--an-h:6px;--an-r:1px;--an-fg:#111418;--an-pt:#8E97A8;--an-bg:#FFC531}
.pv-annot2.preset-bold .an-underline{animation-duration:.18s}
.pv-annot2.preset-bold .an-gloss{border-radius:4px;box-shadow:0 2px 0 rgba(0,0,0,.35)}   /* 黄色タグ（行番号タグと同族） */
.pv-annot2.preset-acoustic{--an-ac:rgba(255,178,125,.75);--an-r:999px;--an-fg:#F6E7D6;--an-pt:#D8CFC2}
.pv-annot2.preset-acoustic .an-underline{animation-duration:.5s}
.pv-annot2.preset-acoustic .an-gloss{animation:anGlossSoft .45s ease-out .4s backwards}  /* 紙に書き添えた素の文字=動きも静かに */
.pv-annot2.preset-acoustic .an-gloss,.pv-annot2.preset-acoustic .an-point{text-shadow:0 1px 5px rgba(43,31,23,.75)}
.pv-annot2.preset-cinema .an-underline{animation-duration:.45s}
.pv-annot2.preset-cinema .an-gloss{animation:anGlossSoft .45s ease-out .5s backwards}
.present-btn.annot-on{background:var(--annot);color:#241a04}

/* 単語読み上げの声えらびパネル（歌詞シート用・ツールバーの上に出る） */
.voice-pop{
  position:absolute;right:0;bottom:44px;width:320px;max-height:min(46vh,380px);overflow-y:auto;
  background:rgba(20,22,34,.97);border:1px solid rgba(255,255,255,.16);border-radius:12px;
  padding:10px;display:flex;flex-direction:column;gap:4px;box-shadow:0 8px 30px rgba(0,0,0,.5);
}
.voice-pop .vp-head{display:flex;align-items:center;justify-content:space-between;font-size:12px;font-weight:700;color:rgba(255,255,255,.75);padding:2px 4px 6px}
.voice-pop .vp-x{width:26px;height:26px;border-radius:6px;color:rgba(255,255,255,.7);background:rgba(255,255,255,.08)}
.voice-pop .vp-x:hover{background:rgba(255,255,255,.2)}
.voice-btn{
  display:flex;align-items:center;gap:8px;min-height:34px;padding:4px 10px;border-radius:8px;
  font-size:13px;font-weight:600;color:rgba(255,255,255,.88);background:rgba(255,255,255,.07);text-align:left;
}
.voice-btn:hover{background:rgba(255,255,255,.18)}
.voice-btn.on{background:var(--accent);color:#fff}
.voice-btn .vl{margin-left:auto;font-size:11px;opacity:.6;font-weight:500;white-space:nowrap}
.voice-pop .vp-note{font-size:11px;color:rgba(255,255,255,.5);padding:4px 4px 0}

/* ---------- デザイン画面 ---------- */
.design-wrap{flex:1;min-height:0;display:flex;gap:1px;background:var(--border)}
.design-preview-pane{flex:60;min-width:0;background:var(--bg-app);display:flex;flex-direction:column;padding:16px;gap:10px}
.design-side{flex:40;max-width:420px;min-width:300px;background:var(--bg-panel);overflow:auto;padding:16px}
.preset-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.preset-card{
  position:relative;border:2px solid var(--border);border-radius:10px;overflow:hidden;
  background:var(--bg-app);text-align:left;padding:0;
}
.preset-card:hover:not(:disabled){border-color:var(--text-secondary)}
.preset-card.sel{border-color:var(--accent)}
.preset-card:disabled{opacity:.45}
.preset-thumb{width:100%;aspect-ratio:16/7;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:15px}
.preset-label{display:flex;align-items:center;gap:6px;padding:8px 10px;font-size:12px;font-weight:600}
.preset-label .cap{font-weight:400;color:var(--text-secondary);font-size:11px}
.side-section{padding:14px 0;border-bottom:1px solid var(--border)}
.side-section:last-child{border-bottom:none}
.side-title{font-size:13px;font-weight:600;color:var(--text-secondary);margin-bottom:6px}

/* ---------- 背景リスト ---------- */
.bg-list{display:flex;flex-direction:column;gap:8px;margin-top:8px}
.bg-item{display:flex;align-items:flex-start;gap:10px;padding:8px;border:1px solid var(--border);border-radius:10px;background:var(--bg-app)}
.bg-thumb{width:64px;height:36px;object-fit:cover;border-radius:6px;background:#000;flex:none;display:block;pointer-events:none}
.bg-thumb-missing{width:64px;height:36px;border-radius:6px;flex:none;display:flex;align-items:center;justify-content:center;color:var(--warning);border:1px dashed var(--warning);font-size:15px}
.bg-info{flex:1;min-width:0;display:flex;flex-direction:column;gap:5px}
.bg-name{font-size:12px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bg-name .kind{font-weight:400;color:var(--text-secondary);margin-left:6px}
.bg-row2{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.bg-row2 select{padding:3px 6px;font-size:12px;border-radius:6px;max-width:190px}
.bg-item .btn-icon{width:26px;height:26px}
.bg-warn{color:var(--warning);font-size:11px}

/* ---------- 書き出し画面 ---------- */
.export-wrap{max-width:760px;width:100%;margin:0 auto;padding:32px 24px;display:flex;flex-direction:column;gap:18px}
.checklist{display:flex;flex-direction:column;gap:8px}
.check-item{display:flex;align-items:center;gap:10px;font-size:13px;padding:10px 14px;border-radius:8px;background:var(--bg-panel);border:1px solid var(--border)}
.check-item .mark{flex:none}
.check-item.ok .mark{color:var(--success)}
.check-item.warn .mark{color:var(--warning)}
.check-item.bad .mark{color:var(--danger)}
.seg{display:flex;gap:8px}
.seg-btn{
  padding:7px 16px;border-radius:8px;border:1px solid var(--border);cursor:pointer;
  background:var(--bg-panel);color:var(--text-secondary);font-size:13px;font-weight:600;
}
.seg-btn.active{border-color:var(--accent);color:var(--text-primary);background:var(--accent-soft)}
.seg-btn:disabled{opacity:.5;cursor:default}
.export-progress{
  display:flex;flex-direction:column;gap:10px;align-items:center;
  padding:16px 20px;border:1px solid var(--border);border-radius:12px;background:var(--bg-panel);
}
.progress-big{width:100%;height:10px;border-radius:5px;background:var(--bg-elevated);overflow:hidden}
.progress-big .fill{height:100%;background:linear-gradient(90deg,var(--accent),#22D3EE);transition:width .25s linear}

/* ---------- 空状態 ---------- */
.empty-state{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;color:var(--text-secondary);text-align:center;padding:24px}
.empty-state .big{font-size:40px}

/* ---------- ショートカット表 ---------- */
table.keys{width:100%;border-collapse:collapse;font-size:13px}
table.keys td{padding:7px 10px;border-bottom:1px solid var(--border)}
table.keys td:first-child{width:170px;white-space:nowrap}

/* ============================================================
   📲 iPad配布（フェーズ4）
   ・body.player = ?song= で起動した生徒プレイヤー（編集アプリの見た目は不変更）
   ============================================================ */
/* Safariのツールバーで下が隠れないよう dvh（非対応環境は vh のまま） */
body.player #root,body.player .app-shell{height:100vh;height:100dvh}
body.player{overscroll-behavior:none}
/* タッチの底上げ: ボタン44px・シーク当たり28px・ダブルタップズーム抑止（プレイヤーのみ） */
body.player .present-btn{height:44px;padding:0 14px;font-size:14px}
body.player .present-seek{height:28px}
body.player .present-root,body.player .present-ui,body.player .present-sheet,
body.player .sheet-row,body.player .sheet-w,body.player .pb-root{touch-action:manipulation}
body.player .present-ui{padding-bottom:calc(14px + env(safe-area-inset-bottom))}

/* 生徒プレイヤーの起動画面（読み込み・タイトル・エラー共通） */
.pb-root{position:fixed;inset:0;z-index:200;background:var(--bg-app);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;
  padding:32px;text-align:center}
.pb-note{font-size:64px;color:var(--accent);line-height:1}
.pb-note.pulse{animation:pbPulse 1.8s ease-in-out infinite}
@keyframes pbPulse{0%,100%{opacity:.45}50%{opacity:1}}
.pb-title{font-size:clamp(26px,6vw,44px);font-weight:800;line-height:1.3;max-width:90vw;word-break:break-word}
.pb-msg{color:var(--text-secondary);font-size:15px;line-height:1.9}
.pb-err-h{font-size:22px;font-weight:700}
.pb-bar{width:min(420px,80vw);height:10px;border-radius:5px;background:var(--bg-elevated);overflow:hidden}
.pb-bar .fill{height:100%;background:var(--accent);transition:width .2s}
.pb-start{height:56px;width:min(320px,80vw);border-radius:14px;background:var(--accent);color:#fff;
  font-size:18px;font-weight:800;box-shadow:0 6px 24px rgba(124,108,255,.35)}
.pb-start:hover{background:var(--accent-hover)}
.pb-teacher{max-width:min(560px,86vw);background:var(--bg-panel);border:1px solid var(--border);
  border-radius:12px;padding:10px 18px;font-size:15px;line-height:1.8}
.pb-teacher .who{color:var(--text-disabled);font-size:12px;margin-right:.6em}
.pb-credit{position:absolute;bottom:calc(14px + env(safe-area-inset-bottom));font-size:12px;color:var(--text-disabled)}
.pb-detail{position:absolute;bottom:calc(36px + env(safe-area-inset-bottom));font-size:11px;color:var(--text-disabled);
  max-width:90vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* はじめてガイド（1枚だけのコーチマーク） */
.pb-guide{position:absolute;inset:0;z-index:40;background:rgba(0,0,0,.74);
  display:flex;align-items:center;justify-content:center;padding:24px;cursor:pointer}
.pb-guide-card{background:var(--bg-panel);border:1px solid var(--border);border-radius:16px;
  padding:24px 30px;max-width:540px;font-size:16px;line-height:2;text-align:left}
.pb-guide-card .gt{font-weight:800;font-size:18px;margin-bottom:6px}
.pb-guide-card .gs{color:var(--text-disabled);font-size:13px;margin-top:12px;text-align:center}

/* ⑤書き出し「iPadに配る」カード */
.dist-card{border:1px solid var(--border);border-radius:12px;background:var(--bg-panel);
  padding:18px 20px;display:flex;flex-direction:column;gap:12px;margin-top:8px}
.dist-card .dc-title{font-size:15px;font-weight:700}
.dist-card .dc-sub{font-size:12px;color:var(--text-secondary);line-height:1.8}
.dist-url{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.dist-url input{flex:1;min-width:240px}
.dist-slug{display:flex;gap:6px;align-items:center;flex-wrap:wrap;font-size:13px}
.dist-slug input{width:200px;font-family:ui-monospace,monospace}
.dist-urlprev{font-size:12px;color:var(--text-secondary);word-break:break-all;
  background:var(--bg-app);border-radius:8px;padding:8px 12px;font-family:ui-monospace,monospace}
.qr-panel{display:flex;gap:20px;align-items:flex-start;flex-wrap:wrap}
.qr-canvas{background:#fff;padding:10px;border-radius:10px;flex:none}
.qr-side{flex:1;min-width:240px;display:flex;flex-direction:column;gap:8px;font-size:13px}

/* 配布カード印刷: body.printing-qr の間だけ .qr-print-sheet を紙に出す */
.qr-print-sheet{display:none}
@media print{
  body.printing-qr #root{display:none!important}
  body.printing-qr{overflow:visible!important;background:#fff!important}
  .qr-print-sheet{display:block;color:#000;background:#fff;text-align:center;
    font-family:"Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;padding:18mm 10mm}
  .qr-print-sheet .qp-title{font-size:26pt;font-weight:800;margin-bottom:8mm}
  .qr-print-sheet img{width:95mm;height:95mm}
  .qr-print-sheet .qp-url{font-size:9pt;margin-top:5mm;word-break:break-all;font-family:ui-monospace,monospace}
  .qr-print-sheet .qp-steps{font-size:13pt;margin-top:10mm;line-height:2.2;display:inline-block;text-align:left}
}
</style>

<script>
/* ============================================================
   SingSync — Suno歌詞カラオケPVメーカー
   ・完全同梱（React / htm を同ファイルに内蔵、ビルド変換なし）
   ・英語行の単語ワイプ（カラオケ）＋和訳表示
   ・タップ同期 → 単語自動割り付け → 波形ドラッグ微調整
   ・MP4書き出し: WebCodecs(H.264+AAC/Opus) + mp4-muxer 同梱
   ============================================================ */
(function () {
  "use strict";
  const { useState, useEffect, useRef, useMemo, useCallback } = React;
  const html = htm.bind(React.createElement);

  /* ============================================================
     [2] 定数・スタイルプリセット定義
     ============================================================ */
  // 日本語入力（IME）の「変換確定」のEnter/Escapeを、入力枠の確定・キャンセルと区別する。
  // 変換中のキーは isComposing=true（Chrome系は keyCode 229）＝枠側は反応しない。
  // これが無いと、変換を確定しただけで枠が閉じてしまい日本語が入力できない
  const imeKey = (e) => !!((e.nativeEvent || e).isComposing) || e.keyCode === 229;

  const APP_KEY = "lyric-pv:autosave:v1";
  const FLAG_KEY = "lyric-pv:flags:v1";
  const PUB_BASE_KEY = "lyric-pv:pubBase:v1";       // 📲 iPad配布: 配布先URL（一度だけ設定）
  const PLAYER_GUIDE_KEY = "lyric-pv:playerGuide:v1"; // 生徒プレイヤーのはじめてガイド既読

  /* 📲 生徒プレイヤー判定（?song=songs/xxx.pack.json で起動）
     ・songs/ 配下の相対パスしか受けない（細工URLで任意先をfetchさせない・パス遡上防止）
     ・パラメータが無ければ null ＝ いつもの編集アプリ（file:// 含め完全に従来どおり） */
  const PLAYER = (() => {
    try {
      const q = new URLSearchParams(location.search).get("song");
      if (!q) return null;
      if (!/^songs\/[A-Za-z0-9._-]+\.json$/.test(q) || q.includes("..")) return { badUrl: true, url: q };
      return { url: q };
    } catch (e) { return null; }
  })();
  if (PLAYER) {
    try { document.body.classList.add("player"); } catch (e) {}
    // iPad Safariのピンチズーム暴発を抑止（プレイヤーのみ。編集アプリには影響しない）
    try { document.addEventListener("gesturestart", (e) => e.preventDefault()); } catch (e) {}
  }

  /* 全画面（iPadOSはwebkit接頭辞が必要な版がある。失敗しても実害なしのtry） */
  const goFullscreen = () => {
    const el = document.documentElement;
    try {
      if (el.requestFullscreen) el.requestFullscreen().catch(() => {});
      else if (el.webkitRequestFullscreen) el.webkitRequestFullscreen();
    } catch (e) {}
  };
  const fsElement = () => document.fullscreenElement || document.webkitFullscreenElement || null;
  const exitFullscreenSafe = () => {
    try {
      if (document.exitFullscreen) document.exitFullscreen().catch(() => {});
      else if (document.webkitExitFullscreen) document.webkitExitFullscreen();
    } catch (e) {}
  };
  const CANVAS_W = 1920, CANVAS_H = 1080;
  const SAFE_X = 96, SAFE_Y = 54;            // セーフマージン（5%）
  const MAX_TEXT_W = CANVAS_W - SAFE_X * 2 - 128; // 歌詞の最大幅（1600px）
  const LINE_GAP_END = 0.30;                  // 行終了＝次行開始-0.3秒
  const MIN_LINE_DUR = 0.20;                  // 行の最小長
  const MIN_WORD_DUR = 0.05;                  // 単語の最小長
  const NUDGE_MS = 50, NUDGE_FINE_MS = 10;    // ナッジ量
  const FONT_SCALES = { "小": 0.85, "標準": 1.0, "大": 1.15 };

  // プリセット（フェーズ3で6種すべて実装済み）
  // 共通スキーマ: enFont/jaFont/enSize/jaSize, colors{unsung,sung,ja,edgeGrad|null,glow},
  //   glowBlur, glow2(二重グロー)|null, shadowAlpha, plate(文字プレート)|null, underline|null,
  //   entrance/exit{dx?,dy,dur}, bg{grad,overlay,mediaOverlay?,mediaFilter?,riseGrad?,letterbox?,grain?,bottomGrad,vignette}
  const PRESETS = {
    aurora: {
      id: "aurora", name: "Aurora", cap: "万能・迷ったらこれ",
      enFont: (px) => `800 ${px}px Montserrat, "Noto Sans JP", sans-serif`,
      jaFont: (px) => `500 ${px}px "Noto Sans JP", sans-serif`,
      enSize: 72, jaSize: 32,
      colors: {
        unsung: "#8B93A7", sung: "#FFFFFF", ja: "#B9C0D4",
        edgeGrad: ["#22D3EE", "#8B5CF6"],       // ワイプ先端の残光
        glow: "rgba(139,92,246,0.40)",
      },
      glowBlur: 12, shadowAlpha: 0.5,
      entrance: { dy: 24, dur: 0.35 },          // 下からフェードスライドイン
      exit: { dy: -16, dur: 0.30 },
      num: { font: (px) => `800 ${px}px Montserrat, "Noto Sans JP", sans-serif`, color: "rgba(255,255,255,0.95)", pill: "rgba(15,18,28,0.55)", border: "rgba(255,255,255,0.30)" },
      bg: {
        grad: [["#0B1020", 0], ["#151233", 0.5], ["#0B1020", 1]],
        overlay: "rgba(11,16,32,0.55)",
        bottomGrad: 0.40,                        // 下辺40%に黒グラデ
        vignette: 0.20,
      },
      thumb: { bg: "linear-gradient(135deg,#0B1020,#2A1B54)", fg: "#FFFFFF", font: "Montserrat, sans-serif" },
    },
    cinema: {
      id: "cinema", name: "Cinema", cap: "映画字幕風・バラードに",
      enFont: (px) => `600 ${px}px "Playfair Display", Georgia, "Times New Roman", serif`,
      jaFont: (px) => `400 ${px}px "Noto Serif JP", "Hiragino Mincho ProN", serif`,
      enSize: 72, jaSize: 32,
      colors: {
        unsung: "#7A7468", sung: "#F5E9C9", ja: "#CFC8B8",
        edgeGrad: ["#FFD98E", "#FFD98E"],
        glow: "rgba(0,0,0,0)",
      },
      glowBlur: 0, shadowAlpha: 0.45,
      entrance: { dy: 0, dur: 0.5 },            // フェードのみ・動きは最小限
      exit: { dy: 0, dur: 0.4 },
      num: { font: (px) => `600 ${px}px "Playfair Display", Georgia, serif`, color: "#F5E9C9", pill: "rgba(10,8,4,0.50)", border: "rgba(245,233,201,0.50)" },
      bg: {
        grad: [["#1A1511", 0], ["#2A2117", 0.55], ["#141008", 1]],
        overlay: "rgba(0,0,0,0.10)",
        letterbox: 90, grain: 0.05,

  const PRESET_META = ["aurora", "cinema", "classroom", "neon", "bold", "acoustic"]

  const uid = () => "L" + Math.random().toString(36).slice(2, 9) + Date.now().toString(36);
  const clamp = (v, lo, hi) => Math.min(hi, Math.max(lo, v));
  const fmtTime = (t) => {
    if (t == null || isNaN(t)) return "--:--";
    const m = Math.floor(t / 60), s = t - m * 60;
    return m + ":" + (s < 10 ? "0" : "") + s.toFixed(2);
  };
  const fmtDur = (t) => {
    const m = Math.floor(t / 60), s = Math.round(t - m * 60);
    return m + ":" + (s < 10 ? "0" : "") + s;
  };
  const parseTime = (str) => { // "1:23.45" or "83.45" → 秒
    const s = String(str).trim();
    const m = s.match(/^(\d+):(\d+(?:\.\d+)?)$/);
    if (m) return parseInt(m[1], 10) * 60 + parseFloat(m[2]);
    const f = parseFloat(s);
    return isNaN(f) ? null : f;
  };

  /* ---------- localStorage（file:// で無効な環境にも耐えるシム） ---------- */
  const mem = {};
  const store = {
    get(k) { try { return localStorage.getItem(k); } catch (e) { return mem[k] || null; } },
    set(k, v) { try { localStorage.setItem(k, v); } catch (e) { mem[k] = v; } },
    del(k) { try { localStorage.removeItem(k); } catch (e) { delete mem[k]; } },
    ok() { try { localStorage.setItem("__t", "1"); localStorage.removeItem("__t"); return true; } catch (e) { return false; } },
  };
  const flags = {
    get(name) { try { return !!(JSON.parse(store.get(FLAG_KEY) || "{}"))[name]; } catch (e) { return false; } },
    set(name, v) {
      let o = {}; try { o = JSON.parse(store.get(FLAG_KEY) || "{}"); } catch (e) {}
      o[name] = v; store.set(FLAG_KEY, JSON.stringify(o));
    },
  };

  /* ============================================================
     [3] データモデル & プロジェクトI/O
     ============================================================ */
  function newProject(title) {
    const now = new Date().toISOString();
    return {
      app: "lyric-pv-maker", version: 1,
      meta: { title: title || "新しいPV", createdAt: now, updatedAt: now },
      audio: null, // { fileName, size, duration, fingerprint, sample? }
      lines: [],   // { id, type:'lyric'|'gap', en, ja, tStart, tEnd, words, wordsManual, mask(穴あきの単語番号) }
      backgrounds: [],   // { id, type:'image'|'video', fileName, size, fromLineId|null(=最初から), posY }
      bgTransition: "fade",  // 'fade'(0.8秒クロスフェード) | 'cut'
      bgAuto: { on: false, by: "time", every: "normal", shuffle: true, order: [] }, // おまかせローテーション（by: "time"=時間で / "section"=歌詞の区切り・間奏で）
      pub: { note: "", slug: "" }, // 📲 iPad配布: 先生からのひとこと・URL用のファイル名
      style: { presetId: "aurora", overrides: { showJa: true, fontScale: 1.0, syncOffsetMs: 0, kenBurns: true, lineNumbers: false, lineNumPos: "shoulder", nextPreview: "standby" } },
    };
  }
  function makeLine(en, ja) {
    return { id: uid(), type: "lyric", en: en || "", ja: ja || "", tStart: null, tEnd: null, words: [], wordsManual: false, mask: [], notes: [], point: "" };
  }
  function makeGap() { return { id: uid(), type: "gap", en: "", ja: "", tStart: null, tEnd: null, words: [], wordsManual: false, mask: [], notes: [], point: "" }; }
  function makeBackground(file, kind) {
    return { id: "B" + Math.random().toString(36).slice(2, 9) + Date.now().toString(36), type: kind, fileName: file.name, size: file.size, fromLineId: null, posY: "center" };
  }

  function migrate(json) { // 将来のスキーマ変更用
    if (!json || json.app !== "lyric-pv-maker") throw new Error("not-a-project");
    const p = Object.assign(newProject(), json);
    p.style = Object.assign({ presetId: "aurora", overrides: {} }, json.style || {});
    // nextPreview は既存プロジェクトでは "single"（保存済み・書き出し済みの見た目を変えない）
    p.style.overrides = Object.assign({ showJa: true, fontScale: 1.0, syncOffsetMs: 0, kenBurns: true, lineNumbers: false, lineNumPos: "shoulder", nextPreview: "single" }, p.style.overrides);
    if (!PRESETS[p.style.presetId]) p.style.presetId = "aurora";
    p.lines = (json.lines || []).map((l) => Object.assign(makeLine(), l));
    // 穴あき(mask)の正規化: 旧データは[]補完・範囲外/重複は除去（undo/redoもここを通るので常に健全）
    p.lines.forEach((l) => {
      const toks = l.type === "lyric" ? enTokens(l.en) : [];
      const n = toks.length;
      l.mask = Array.isArray(l.mask)
        ? [...new Set(l.mask.filter((i) => Number.isInteger(i) && i >= 0 && i < n))].sort((a, b) => a - b)
        : [];
      // 💡注釈(notes/point)の正規化: 旧データは補完（we無し→we=wi）。再アンカーはreanchorNotesに集約
      l.point = typeof l.point === "string" ? l.point.slice(0, 60) : "";
      l.notes = Array.isArray(l.notes)
        ? reanchorNotes(
            l.notes.filter((nt) => nt && typeof nt.w === "string" && typeof nt.text === "string") // text空=線だけの注釈として有効
              .map((nt) => ({ ...nt, text: nt.text.slice(0, 20) })), toks)
        : [];
    });
    p.backgrounds = (json.backgrounds || []).map((b) =>
      Object.assign({ id: uid(), type: "image", fileName: "", size: 0, fromLineId: null, posY: "center" }, b));
    p.bgTransition = json.bgTransition === "cut" ? "cut" : "fade";
    // おまかせローテーション: 既存プロジェクトは off（保存済み・書き出し済みの見た目を変えない）
    p.bgAuto = Object.assign({ on: false, by: "time", every: "normal", shuffle: true, order: [] }, json.bgAuto || {});
    // 📲 iPad配布の付帯情報（旧データは空で補完）
    p.pub = Object.assign({ note: "", slug: "" }, json.pub || {});
    p.pub.note = typeof p.pub.note === "string" ? p.pub.note.slice(0, 100) : "";
    p.pub.slug = typeof p.pub.slug === "string" ? p.pub.slug : "";
    // 💾 PVペンの保存書き込み {行id: [{tool,color,pts}]}: 形が崩れたもの・消えた行のぶんは捨てる（undo/redoもここを通る）
    if (p.pvInk && typeof p.pvInk === "object" && !Array.isArray(p.pvInk)) {
      const out = {};
      for (const k of Object.keys(p.pvInk)) {
        const arr = (Array.isArray(p.pvInk[k]) ? p.pvInk[k] : []).filter((s) =>
          s && Array.isArray(s.pts) && s.pts.length >= 4 && s.pts.length % 2 === 0 && s.pts.every((n) => Number.isFinite(n)));
        if (arr.length && p.lines.some((l) => l.id === k))
          out[k] = arr.map((s) => ({ tool: s.tool === "hl" ? "hl" : "pen",
            color: PEN_COLOR_ORDER.includes(s.color) ? s.color : "red", pts: s.pts.map((n) => Math.round(n)) }));
      }
      if (Object.keys(out).length) p.pvInk = out; else delete p.pvInk;
    } else delete p.pvInk;
    return p;
  }

  async function fingerprintFile(file) { // 先頭64KBのSHA-256（再リンク照合用）
    try {
      const buf = await file.slice(0, 65536).arrayBuffer();
      const hash = await crypto.subtle.digest("SHA-256", buf);
      return Array.from(new Uint8Array(hash)).map((b) => b.toString(16).padStart(2, "0")).join("").slice(0, 32);
    } catch (e) { return null; }
  }

  const lyricLines = (p) => p.lines.filter((l) => l.type === "lyric");
  const syncedLines = (p) => lyricLines(p).filter((l) => l.tStart != null);

  // 「/」（半角・全角どちらでも）＝任意改行。行データは1行のまま、表示だけ複数行にする。
  // 単語トークンに「/」は含まれないので、同期タイミングには影響しない。
  const enSegments = (s) => String(s || "").split(/[/／]/).map((x) => x.trim()).filter(Boolean);
  const enTokens = (s) => enSegments(s).flatMap((x) => x.split(/\s+/).filter(Boolean));
  // 💡注釈の再アンカー: 綴りスナップショットw（空白1個区切り・フレーズ可）でwi..weを照合→ずれていれば連続部分列を再探索。
  // 見つからなければwi:-1の⚠孤児として残す（教員の入力を失わない）。冪等なのでundo/redoでmigrateを何度通しても安全
  function reanchorNotes(notes, toks) {
    const span = (a, b) => toks.slice(a, b + 1).join(" ");
    return notes.map((nt) => {
      const we0 = Number.isInteger(nt.we) && nt.we >= nt.wi ? nt.we : nt.wi; // 旧データはwe無し→we=wi
      if (Number.isInteger(nt.wi) && nt.wi >= 0 && we0 < toks.length && span(nt.wi, we0) === nt.w)
        return { wi: nt.wi, we: we0, w: nt.w, text: nt.text };
      const wt = nt.w.split(" ");
      for (let i = 0; i + wt.length <= toks.length; i++)
        if (span(i, i + wt.length - 1) === nt.w) return { wi: i, we: i + wt.length - 1, w: nt.w, text: nt.text };
      return { wi: -1, we: -1, w: nt.w, text: nt.text };
    });
  }
  const withBreaks = (s) => enSegments(s).join("\n");

  /* ============================================================
     [3c] 📲 iPad配布: 曲パック（音声+背景画像を1つのJSONに同梱）
     ・GitHub Pages に置いたプレイヤー（このHTML自身）が ?song= で読み込む
     ・動画背景は容量の都合で同梱しない（bgAuto.order からも外し、区間は残りの画像で引き直される）
     ============================================================ */
  const PACK_VERSION = 1;
  function slugify(title) { // URLに安全なファイル名（ASCIIが残らなければ日付ベース）
    const s = String(title || "").toLowerCase()
      .replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, "").replace(/-{2,}/g, "-").slice(0, 40);
    if (s) return s;
    const d = new Date();
    return "song-" + String(d.getFullYear()).slice(2) + String(d.getMonth() + 1).padStart(2, "0") + String(d.getDate()).padStart(2, "0");
  }
  const SLUG_RE = /^[a-z0-9][a-z0-9-]{0,40}$/;
  function fileToB64(blob) { // FileReaderのネイティブ変換（巨大配列のfromCharCodeを踏まない）
    return new Promise((res, rej) => {
      const r = new FileReader();
      r.onload = () => res(String(r.result).replace(/^data:[^,]*,/, ""));
      r.onerror = () => rej(new Error("b64"));
      r.readAsDataURL(blob);
    });
  }
  function b64ToFile(b64, name, type) { // 1MB文字ずつchunkでatob（巨大文字列でも安定）
    const parts = [];
    const STEP = 1048576; // atobに渡すのは4の倍数なのでMB境界でOK
    for (let i = 0; i < b64.length; i += STEP) {
      const bin = atob(b64.slice(i, i + STEP));
      const u = new Uint8Array(bin.length);
      for (let j = 0; j < bin.length; j++) u[j] = bin.charCodeAt(j);
      parts.push(u);
    }
    return new File(parts, name || "file", { type: type || "application/octet-stream" });
  }

  // 同梱内容の下調べ（⑤のチェックリスト表示用。b64化はまだしない）
  async function packManifest(project) {
    const audioFile = (AE.ready && AE.url) ? null : await mediaDB.get("audio"); // AE優先・無ければキャッシュ
    const audioOk = !!(AE.ready && AE.url) || !!audioFile;
    const audio = project.audio ? { name: project.audio.fileName, size: project.audio.size || (audioFile && audioFile.size) || 0, ok: audioOk } : null;
    const imgs = [], videos = [], missing = [];
    for (const b of project.backgrounds || []) {
      if (b.type === "video") { videos.push({ id: b.id, fileName: b.fileName }); continue; }
      const it = MediaLib.items.get(b.id);
      const f = (it && it.file) || await mediaDB.get("bg:" + b.id);
      if (f) imgs.push({ id: b.id, name: b.fileName || f.name, size: f.size });
      else missing.push({ id: b.id, fileName: b.fileName });
    }
    const rawBytes = (audio ? audio.size : 0) + imgs.reduce((s, x) => s + x.size, 0);
    const estBytes = Math.round(rawBytes * 4 / 3) + 200 * 1024; // base64の33%増+プロジェクトJSONぶん
    const masks = project.lines.reduce((s, l) => s + (l.type === "lyric" && l.mask ? l.mask.length : 0), 0);
    const notes = project.lines.reduce((s, l) => s + (l.type === "lyric" ? (l.notes || []).filter((n) => n.wi >= 0).length : 0), 0);
    return { audio, imgs, videos, missing, estBytes, masks, notes };
  }

  // 曲パック本体を組み立てる（音声・画像をbase64同梱。動画は除外して記録）
  async function buildSongPack(project, slug) {
    // 音声: いま聞こえているもの（AE.url）が正。無ければmediaDBのキャッシュ
    let audioBlob = null;
    if (AE.ready && AE.url) { try { audioBlob = await (await fetch(AE.url)).blob(); } catch (e) {} }
    if (!audioBlob) audioBlob = await mediaDB.get("audio");
    if (!audioBlob) throw new Error("no-audio");
    const audioName = (project.audio && project.audio.fileName) || audioBlob.name || "song.mp3";
    const audioType = audioBlob.type || (/\.wav$/i.test(audioName) ? "audio/wav" : "audio/mpeg");

    const proj = structuredClone(project);
    const excludedVideos = [], bgs = [];
    for (const b of proj.backgrounds || []) {
      if (b.type === "video") { excludedVideos.push({ id: b.id, fileName: b.fileName }); continue; }
      const it = MediaLib.items.get(b.id);
      const f = (it && it.file) || await mediaDB.get("bg:" + b.id);
      if (!f) continue; // 読み込めていない画像は同梱できない（⑤で事前に警告済み）
      bgs.push({ id: b.id, name: b.fileName || f.name || "bg.jpg", type: f.type || "image/jpeg", size: f.size, b64: await fileToB64(f) });
    }
    // 同梱できた画像だけを残す（動画・行方不明はエントリごと外す→区間は残りで引き直される＝無地の穴が空かない）
    proj.backgrounds = (proj.backgrounds || []).filter((b) => bgs.some((x) => x.id === b.id));
    if (proj.bgAuto) proj.bgAuto.order = (proj.bgAuto.order || []).filter((id) => proj.backgrounds.some((b) => b.id === id));

    return {
      app: "singsync-pack", packVersion: PACK_VERSION,
      meta: {
        title: project.meta.title || "曲", slug: slug || slugify(project.meta.title),
        note: (project.pub && project.pub.note) || "",
        createdAt: new Date().toISOString(), generator: "SingSync",
      },
      project: proj,
      media: { audio: { name: audioName, type: audioType, size: audioBlob.size, b64: await fileToB64(audioBlob) }, bgs },
      excluded: { videoBgs: excludedVideos },
    };
  }

  // 曲パックを開く（生徒プレイヤー側）。壊れたパックはkind付きで投げる
  function unpackSongPack(json) {
    if (!json || json.app !== "singsync-pack" || !json.project || !json.media || !json.media.audio) {
      const err = new Error("pack-format"); err.kind = "format"; throw err;
    }
    if ((json.packVersion || 1) > PACK_VERSION) {
      const err = new Error("pack-version"); err.kind = "version"; throw err;
    }
    const project = migrate(json.project); // 編集アプリと同じ正規化経路（旧パックの前方互換はここが吸収）
    const a = json.media.audio;
    const audioFile = b64ToFile(a.b64, a.name, a.type);
    const bgFiles = (json.media.bgs || [])
      .filter((x) => x && x.id && x.b64 && (project.backgrounds || []).some((b) => b.id === x.id)) // 孤児メディアは無視
      .map((x) => ({ id: x.id, file: b64ToFile(x.b64, x.name, x.type) }));
    return {
      project, audioFile, bgFiles,
      title: (json.meta && json.meta.title) || project.meta.title || "曲",
      note: (json.meta && json.meta.note) || "",
      excludedCount: ((json.excluded || {}).videoBgs || []).length,
    };
  }

  // QRコード描画（同梱の qrcode-generator を使用）。読み取りやすさ優先で誤り訂正M
  function drawQr(canvas, text, sizePx) {
    try {
      const qr = qrcode(0, "M"); // 0=型番自動
      qr.addData(text);
      qr.make();
      const n = qr.getModuleCount();
      const quiet = 4; // 規格どおりの余白4モジュール
      const px = Math.max(2, Math.floor((sizePx || 320) / (n + quiet * 2)));
      const size = px * (n + quiet * 2);
      canvas.width = size; canvas.height = size;
      const ctx = canvas.getContext("2d");
      ctx.fillStyle = "#fff"; ctx.fillRect(0, 0, size, size);
      ctx.fillStyle = "#000";
      for (let r = 0; r < n; r++) for (let c = 0; c < n; c++)
        if (qr.isDark(r, c)) ctx.fillRect((c + quiet) * px, (r + quiet) * px, px, px);
      return true;
    } catch (e) { return false; }
  }

  /* ============================================================
     [3b] メディアキャッシュ（IndexedDB）と背景素材レジストリ
     ・mediaDB: 音源/背景の File を保存 → 開き直してもファイル選択なしで復元
     ・MediaLib: 実行時の Image/Video 要素を背景ID→素材で管理
     ============================================================ */
  const mediaDB = {
    _p: null,
    open() {
      if (this._p) return this._p;
      this._p = new Promise((res) => {
        try {
          const rq = indexedDB.open("lyric-pv-media", 1);
          rq.onupgradeneeded = () => { rq.result.createObjectStore("files"); };
          rq.onsuccess = () => res(rq.result);
          rq.onerror = () => res(null);
        } catch (e) { res(null); }
      });
      return this._p;
    },
    async put(key, file) {
      const db = await this.open(); if (!db) return;
      try { db.transaction("files", "readwrite").objectStore("files").put(file, key); } catch (e) {}
    },
    async get(key) {
      const db = await this.open(); if (!db) return null;
      return new Promise((res) => {
        try {
          const rq = db.transaction("files").objectStore("files").get(key);
          rq.onsuccess = () => res(rq.result || null);
          rq.onerror = () => res(null);
        } catch (e) { res(null); }
      });
    },
    async del(key) {
      const db = await this.open(); if (!db) return;
      try { db.transaction("files", "readwrite").objectStore("files").delete(key); } catch (e) {}
    },
    async keys() {
      const db = await this.open(); if (!db) return [];
      return new Promise((res) => {
        try {
          const rq = db.transaction("files").objectStore("files").getAllKeys();
          rq.onsuccess = () => res(rq.result || []);
          rq.onerror = () => res([]);
        } catch (e) { res([]); }
      });
    },
    async prune(valid) { // valid に無いキーを削除（プロジェクト切替時の掃除）
      const ks = await this.keys();
      for (const k of ks) if (!valid.includes(k)) await this.del(k);
    },
  };

  function seekExact(video, t) { // 書き出し用: フレーム正確なシーク（seeked待ち・保険タイムアウト付き）
    const target = clamp(t, 0, Math.max(0, (video.duration || 0) - 0.001));
    if (Math.abs(video.currentTime - target) < 0.004) return Promise.resolve();
    return new Promise((res) => {
      let tm;
      const done = () => { clearTimeout(tm); video.removeEventListener("seeked", done); res(); };
      tm = setTimeout(done, 600);
      video.addEventListener("seeked", done);
      try { video.currentTime = target; } catch (e) { done(); }
    });
  }

  const MediaLib = {
    items: new Map(), // bgId -> { file, url, kind, el, ready, error, w, h, duration }
    exportMode: false, // 書き出し中はプレビュー側の動画制御を止める
    status(id) { const it = this.items.get(id); return it ? (it.ready ? "ready" : it.error ? "error" : "loading") : "missing"; },
    get(id) { const it = this.items.get(id); return it && it.ready ? it : null; },
    async add(id, file) {
      this.remove(id);
      const url = URL.createObjectURL(file);
      const kind = (file.type || "").startsWith("video") || /\.(mp4|webm|mov|m4v)$/i.test(file.name) ? "video" : "image";
      const item = { id, file, url, kind, el: null, ready: false, error: false, w: 0, h: 0, duration: 0 };
      this.items.set(id, item);
      try {
        if (kind === "image") {
          const img = new Image();
          img.src = url;
          // onload で待つ（decode() は非表示タブで解決しないことがあるため、補助扱い＋タイムアウト付き）
          await new Promise((res, rej) => {
            if (img.complete && img.naturalWidth) return res();
            img.onload = () => res();
            img.onerror = () => rej(new Error("img-load"));
          });
          try { await Promise.race([img.decode(), new Promise((r) => setTimeout(r, 500))]); } catch (e) {}
          item.el = img; item.w = img.naturalWidth; item.h = img.naturalHeight;
        } else {
          const v = document.createElement("video");
          v.muted = true; v.playsInline = true; v.preload = "auto"; v.src = url;
          await new Promise((res, rej) => {
            const ok = () => { cleanup(); res(); };
            const bad = () => { cleanup(); rej(new Error("video-load")); };
            const cleanup = () => { v.removeEventListener("canplay", ok); v.removeEventListener("error", bad); };
            v.addEventListener("canplay", ok);
            v.addEventListener("error", bad);
            v.load();
          });
          item.el = v; item.w = v.videoWidth; item.h = v.videoHeight; item.duration = v.duration || 0;
        }
        item.ready = !!(item.w && item.h);
        if (!item.ready) item.error = true;
      } catch (e) { item.error = true; }
      return item;
    },
    remove(id) {
      const it = this.items.get(id);
      if (it) {
        try { if (it.el && it.kind === "video") it.el.pause(); } catch (e) {}
        try { URL.revokeObjectURL(it.url); } catch (e) {}
        this.items.delete(id);
      }
    },
    clear() { for (const id of [...this.items.keys()]) this.remove(id); },
    // 時刻 t に描くべき動画とその再生位置（フェード中は下側の区間も含む）
    activeVideoTargets(project, tRaw) {
      const t = tRaw + (((project.style || {}).overrides || {}).syncOffsetMs || 0) / 1000;
      const segs = bgSegments(project);
      let cur = -1;
      for (let i = 0; i < segs.length; i++) { if (segs[i].start <= t) cur = i; else break; }
      if (cur === -1) return [];
      const fadeDur = project.bgTransition === "cut" ? 0 : 0.8;
      const out = [];
      const push = (i) => {
        const seg = segs[i];
        const it = this.get(seg.bg.id);
        if (it && it.kind === "video" && it.duration > 0.05) {
          out.push({ el: it.el, target: Math.max(0, t - seg.start) % it.duration });
        }
      };
      push(cur);
      if (fadeDur > 0 && t < segs[cur].start + fadeDur && cur > 0) push(cur - 1);
      return out;
    },
    // プレビュー: 動画を音声と並走再生し、150ms以上ずれたら追従シーク（緩い同期でOK）。
    // 省電力介入などで play() が効かない環境（非表示タブ等）ではシーク追従にフォールバック
    _playMeta: new WeakMap(),
    syncPreview(project, tRaw) {
      if (this.exportMode) return;
      const act = this.activeVideoTargets(project, tRaw);
      const activeEls = new Set(act.map((a) => a.el));
      for (const it of this.items.values()) {
        if (it.kind !== "video" || !it.ready) continue;
        if (!activeEls.has(it.el) && !it.el.paused) it.el.pause();
      }
      const now = performance.now();
      for (const a of act) {
        if (a.el.playbackRate !== AE.el.playbackRate) { try { a.el.playbackRate = AE.el.playbackRate; } catch (e) {} }
        if (AE.playing) {
          if (a.el.paused) {
            const last = this._playMeta.get(a.el) || 0;
            if (now - last > 1000) { this._playMeta.set(a.el, now); a.el.play().catch(() => {}); }
            if (Math.abs(a.el.currentTime - a.target) > 0.034) a.el.currentTime = a.target; // 再生できなくてもシークで進める
          } else if (Math.abs(a.el.currentTime - a.target) > 0.15) {
            a.el.currentTime = a.target;
          }
        } else {
          if (!a.el.paused) a.el.pause();
          if (Math.abs(a.el.currentTime - a.target) > 0.05) a.el.currentTime = a.target;
        }
      }
    },
    // 書き出し: 対象フレームの位置へフレーム正確にシークして待つ（単調増加なので高速）
    async seekForFrame(project, tRaw) {
      const act = this.activeVideoTargets(project, tRaw);
      for (const a of act) await seekExact(a.el, a.target);
    },
    hasVideo(project) {
      return (project.backgrounds || []).some((b) => { const it = this.items.get(b.id); return it && it.kind === "video"; });
    },
    missing(project) { return (project.backgrounds || []).filter((b) => this.status(b.id) !== "ready"); },
  };

  // おまかせローテーションの切り替え間隔（秒）。UIの「短め/ふつう/長め」に対応
  const AUTO_INTERVALS = { short: 4.5, normal: 7.5, long: 12 };

  // おまかせ時の素材の並び。shuffle=保存済みの並び順（無ければ入れた順）／保存順は追加・削除に強く追従
  function orderedAutoBgs(project) {
    const bgs = project.backgrounds || [];
    const auto = project.bgAuto || {};
    if (!auto.shuffle || !Array.isArray(auto.order) || !auto.order.length) return bgs.slice();
    const byId = new Map(bgs.map((b) => [b.id, b]));
    const out = [], seen = new Set();
    for (const id of auto.order) { const b = byId.get(id); if (b && !seen.has(id)) { out.push(b); seen.add(id); } }
    for (const b of bgs) { if (!seen.has(b.id)) { out.push(b); seen.add(b.id); } } // orderに無い新素材は末尾へ
    return out;
  }

  // 歌のまとまりの「切り替え時刻」列（＝各セクションの先頭）。
  // セクション＝間奏(gap)で区切られた歌詞のかたまり。gapの直後の歌詞行で背景が変わる。
  // 先頭区間はイントロから見せたいので 0 に寄せる。区切りが1つ以下（間奏なし）なら [] を返す。
  function autoSectionStarts(project) {
    const starts = [];
    let boundary = true; // 最初の歌詞はセクションの先頭
    for (const l of (project.lines || [])) {
      if (l.type === "gap") { boundary = true; continue; }
      if (l.type !== "lyric") continue;
      if (l.tStart == null) continue; // 未同期行は無視
      if (boundary) { starts.push(l.tStart); boundary = false; }
    }
    if (starts.length < 2) return []; // 区切りが実質無い→呼び出し側で時間モードにフォールバック
    starts[0] = 0; // 先頭区間はイントロから
    for (let i = 1; i < starts.length; i++) if (starts[i] <= starts[i - 1]) starts[i] = starts[i - 1] + 0.01;
    return starts;
  }

  // 背景を「開始時刻つき区間リスト」に解決。
  // ・おまかせon: 素材を順ぐりに。by="time"=等間隔スロット（全素材が最低1回出る）/ by="section"=間奏の区切りで
  // ・通常: fromLineId=null は曲頭から。未同期行に紐づく背景は除外
  function bgSegments(project) {
    const dur = (project.audio && project.audio.duration) || AE.duration || 0;
    const auto = project.bgAuto;
    const pool = auto && auto.on ? orderedAutoBgs(project) : null;
    if (pool && pool.length) {
      const interval = AUTO_INTERVALS[auto.every] || AUTO_INTERVALS.normal;
      const total = dur > 0 ? dur : pool.length * interval;
      let starts = null;
      if (auto.by === "section") starts = autoSectionStarts(project); // []なら下で時間モードに落ちる
