        if (/^en[-_]?us/i.test(v.lang || "")) s += 20;  // 米語を優先
        if (v.localService) s += 10;                    // 端末内蔵＝オフラインでも鳴る
        return s;
      };
      return use.slice().sort((a, b) => score(b) - score(a));
    },
    pick() {
      const cs = this.list();
      this.voice = (this.wanted && cs.find((v) => v.name === this.wanted)) || cs[0] || null;
    },
    setWanted(name) {
      this.wanted = name || "";
      try { name ? localStorage.setItem(TTS_VOICE_KEY, name) : localStorage.removeItem(TTS_VOICE_KEY); } catch (e) {}
      this.pick();
    },
    speak(word) {
      if (!window.speechSynthesis) return false;
      if (!this.voice) this.pick();
      try { speechSynthesis.cancel(); } catch (e) {}
      const u = new SpeechSynthesisUtterance(word);
      if (this.voice) u.voice = this.voice;
      u.lang = this.voice ? this.voice.lang : "en-US";
      u.rate = 0.9;
      speechSynthesis.speak(u);
      return true;
    },
    stop() { try { window.speechSynthesis && speechSynthesis.cancel(); } catch (e) {} },
    makeUtterance(text, rate) { // 🔈行よみあげ用（再生・キャンセル・コールバックは呼び出し側が管理）
      if (!this.voice) this.pick();
      const u = new SpeechSynthesisUtterance(text);
      if (this.voice) u.voice = this.voice;
      u.lang = this.voice ? this.voice.lang : "en-US";
      u.rate = rate;
      return u;
    },
  };
  // Chromeは声リストが非同期で届く（最初のgetVoicesが空のことがある）
  if (window.speechSynthesis) { TTS.pick(); speechSynthesis.onvoiceschanged = () => TTS.pick(); }

  /* ---------- プレビュー（常に1920×1080で描画＝WYSIWYG） ---------- */
  function Preview({ project, scrubRef }) {
    const canvasRef = useRef(null);
    const projRef = useRef(project);
    projRef.current = project;
    useEffect(() => {
      let raf, alive = true;
      const draw = () => {
        if (!alive) return;
        raf = requestAnimationFrame(draw);
        const canvas = canvasRef.current;
        if (!canvas) return;
        // 行ループ
        const lp = AE._loop;
        if (lp.on && AE.playing && (AE.t() >= lp.end || AE.t() < lp.start - 1)) AE.seek(lp.start);
        const t = scrubRef && scrubRef.current != null ? scrubRef.current : AE.t();
        MediaLib.syncPreview(projRef.current, t); // 背景動画を再生位置に追従させる
        renderFrame(canvas.getContext("2d"), t, projRef.current);
      };
      raf = requestAnimationFrame(draw);
      return () => { alive = false; cancelAnimationFrame(raf); };
    }, []);
    return html`
      <div className="preview-box">
        <canvas ref=${canvasRef} width=${CANVAS_W} height=${CANVAS_H}></canvas>
      </div>`;
  }

  /* ---------- 再生コントロール ---------- */
  function TransportBar({ loopId, onClearLoop, extra }) {
    const [, setTick] = useState(0);
    const [rate, setRateState] = useState(1);
    useEffect(() => {
      const iv = setInterval(() => setTick((n) => n + 1), 120);
      return () => clearInterval(iv);
    }, []);
    const setRate = (r) => { AE.setRate(r); setRateState(r); };
    return html`
      <div className="transport">
        <button className="play-btn" title="再生 / 一時停止（スペース）" onClick=${() => AE.toggle()}>
          ${AE.playing ? "⏸" : "▶"}
        </button>
        <span className="time tnum">${fmtTime(AE.t())} / ${fmtTime(AE.duration)}</span>
        <select value=${rate} onChange=${(e) => setRate(parseFloat(e.target.value))}
          title="再生速度（S で 1.0x⇄0.5x）" style=${{ padding: "4px 8px", fontSize: "12px" }}>
          <option value="0.5">0.5x</option>
          <option value="0.75">0.75x</option>
          <option value="1">1.0x</option>
        </select>
        ${loopId && html`<button className="chip accent" onClick=${onClearLoop} title="ループ解除（L / Esc）">🔁 行ループ中 ✕</button>`}
        ${extra || null}
      </div>`;
  }

  /* ---------- 全体ズレ補正（カラオケ表示のタイミングを一括で前後） ---------- */
  function OffsetControl({ project, onCommit }) {
    const ms = project.style.overrides.syncOffsetMs || 0;
    const step = (d) => onCommit((np) => {
      np.style.overrides.syncOffsetMs = clamp((np.style.overrides.syncOffsetMs || 0) + d, -1000, 1000);
    }, { coalesce: true });
    return html`
      <div className="offset-ctl"
        title="カラオケ表示全体のタイミングを一括で前後します（プレビューにも書き出しにも反映）。タップが遅れがちで歌詞が全体的に遅れて見えるときは「早める」を数回押してください">
        <span className="sub" style=${{ fontSize: "11px" }}>全体ズレ補正</span>
        <button className="offset-btn" onClick=${() => step(50)}>◀ 早める</button>
        <span className=${"tnum offset-val" + (ms !== 0 ? " on" : "")}
          title="クリックで0に戻す"
          onClick=${() => onCommit((np) => { np.style.overrides.syncOffsetMs = 0; })}>
          ${ms > 0 ? ms + "ms 早め" : ms < 0 ? (-ms) + "ms 遅め" : "±0"}
        </span>
        <button className="offset-btn" onClick=${() => step(-50)}>遅らせる ▶</button>
      </div>`;
  }

  /* ---------- 歌詞リスト（同期画面 右ペイン） ---------- */
  function LyricsList({ project, selId, loopId, onSelect, onLoop, onTapFrom, onMoveLineStart }) {
    const [editingId, setEditingId] = useState(null);
    const [editVal, setEditVal] = useState("");
    const listRef = useRef(null);
    const manualUntil = useRef(0);
    const autoScrolling = useRef(false);

    // 再生中の自動追従（手動スクロールで10秒停止）
    useEffect(() => {
      const iv = setInterval(() => {
        if (!AE.playing || Date.now() < manualUntil.current) return;
        const t = AE.t();
        const cur = project.lines.find((l) => l.type === "lyric" && l.tStart != null && t >= l.tStart && t < l.tEnd);
        if (!cur || !listRef.current) return;
        const el = listRef.current.querySelector(`[data-lid="${cur.id}"]`);
        if (el) {
          autoScrolling.current = true;
          el.scrollIntoView({ block: "nearest" });
          setTimeout(() => { autoScrolling.current = false; }, 60);
        }
      }, 300);
      return () => clearInterval(iv);
    }, [project]);

    const commitEdit = (line) => {
      const t = parseTime(editVal);
      setEditingId(null);
      if (t != null) onMoveLineStart(line.id, t);
    };

    let num = 0;
    return html`
      <div className="lyr-list" ref=${listRef}
        onScroll=${() => { if (!autoScrolling.current) manualUntil.current = Date.now() + 10000; }}>
        ${project.lines.length === 0 && html`
          <div className="empty-state">
            <div className="big">📝</div>
            <div>まず「② 歌詞」タブで<br/>歌詞を入力しましょう</div>
          </div>`}
        ${project.lines.map((l, i) => {
          if (l.type === "gap") {
            return html`<div key=${l.id} className="lyr-row" style=${{ cursor: "default" }}>
              <span className="lr-num">♪</span>
              <span className="lr-en" style=${{ color: "var(--text-disabled)", letterSpacing: "2px" }}>── 間奏 ──</span>
            </div>`;
          }
          num++;
          const n = num;
          const lyrIdx = n - 1;
          return html`
            <div key=${l.id} data-lid=${l.id}
              className=${"lyr-row" + (l.id === selId ? " sel" : "")}
              onClick=${() => { onSelect(l.id); if (l.tStart != null) AE.seek(l.tStart); }}
              style=${{ cursor: "pointer" }}>
              <span className="lr-num tnum">${n}</span>
              ${editingId === l.id
                ? html`<input className="tnum" autoFocus value=${editVal}
                    style=${{ width: "72px", padding: "1px 4px", fontSize: "12px" }}
                    onChange=${(e) => setEditVal(e.target.value)}
                    onClick=${(e) => e.stopPropagation()}
                    onKeyDown=${(e) => { e.stopPropagation(); if (imeKey(e)) return; if (e.key === "Enter") commitEdit(l); if (e.key === "Escape") setEditingId(null); }}
                    onBlur=${() => commitEdit(l)} />`
                : html`<span className=${"lr-time tnum" + (l.tStart == null ? " unsync" : "")}
                    title="クリックで時刻を直接編集"
                    onClick=${(e) => { e.stopPropagation(); if (l.tStart != null) { setEditingId(l.id); setEditVal(fmtTime(l.tStart)); } }}>
                    ${l.tStart != null ? fmtTime(l.tStart) : "--:--"}
                  </span>`}
              <span className="lr-en">${l.en || "（空の行）"}</span>
              ${loopId === l.id && html`<span className="loop-badge">🔁</span>`}
              <span className="lr-tools">
                <button className="btn-icon" title="この行をループ再生（L）" style=${{ width: "26px", height: "26px" }}
                  onClick=${(e) => { e.stopPropagation(); onLoop(l.id); }}>🔁</button>
                <button className="btn-icon" title="この行からタップ同期をやり直す" style=${{ width: "26px", height: "26px" }}
                  onClick=${(e) => { e.stopPropagation(); onTapFrom(lyrIdx); }}>🎤</button>
              </span>
            </div>`;
        })}
      </div>`;
  }

  /* ---------- ③ 同期画面 ---------- */
  function SyncScreen({ project, selId, selBoundary, loopId, scrubRef, followRef, onCommit,
                        onSelect, onSelectBoundary, onCommitLines, onLoop, onTapStart, onTapFrom, onMoveLineStart }) {
    const synced = syncedLines(project).length;
    const total = lyricLines(project).length;
    return html`
      <div className="sync-wrap">
        <div className="sync-top">
          <div className="sync-preview-pane">
            <div className="preview-flex"><${Preview} project=${project} scrubRef=${scrubRef} /></div>
            <${TransportBar} loopId=${loopId} onClearLoop=${() => onLoop(null)}
              extra=${html`<${OffsetControl} project=${project} onCommit=${onCommit} />`} />
          </div>
          <div className="sync-list-pane">
            <div className="list-head">
              <span className="h2" style=${{ fontSize: "14px" }}>歌詞リスト</span>
              <span className="sub tnum" style=${{ fontSize: "12px" }}>${synced}/${total} 行 同期済み</span>
              <button className=${"btn btn-sm " + (synced === 0 ? "btn-primary" : "btn-secondary")}
                style=${{ marginLeft: "auto" }} disabled=${total === 0}
                onClick=${() => onTapStart(0)}>🎤 タップ同期${synced > 0 ? "をやり直す" : "を始める"}</button>
            </div>
            <${LyricsList} project=${project} selId=${selId} loopId=${loopId}
              onSelect=${onSelect} onLoop=${onLoop} onTapFrom=${onTapFrom} onMoveLineStart=${onMoveLineStart} />
          </div>
        </div>
        <${Timeline} project=${project} selId=${selId} selBoundary=${selBoundary}
          onSelect=${onSelect} onSelectBoundary=${onSelectBoundary}
          onCommitLines=${onCommitLines} scrubRef=${scrubRef} followRef=${followRef} />
      </div>`;
  }

  /* ---------- ② 歌詞入力画面 ---------- */
  function lineTooLong(en) {
    if (!en) return false;
    measureCtx.font = PRESETS.aurora.enFont(PRESETS.aurora.enSize);
    // 「/」で分けた段ごとに測る（いちばん長い段が入りきればOK）
    const segs = enSegments(en);
    return segs.some((s) => measureCtx.measureText(s).width > MAX_TEXT_W);
  }

  function LyricsScreen({ project, onCommit, onPaste, onToast }) {
    const rows = project.lines;
    const enCount = lyricLines(project).length;
    const jaCount = lyricLines(project).filter((l) => l.ja.trim()).length;
    const annotCount = lyricLines(project).filter((l) => (l.notes || []).length || (l.point || "").trim()).length;
    const [annotOpen, setAnnotOpen] = useState(null);   // 💡注釈エディタを開いている行id（常に1行だけ）
    const [glossEdit, setGlossEdit] = useState(null);   // 語義の入力中 { lineId, wi, w, val }

    const update = (id, field, val) => {
      onCommit((np) => {
        const l = np.lines.find((x) => x.id === id);
        if (!l) return;
        const nBefore = field === "en" ? enTokens(l.en).length : 0;
        l[field] = val;
        if (field === "en") {
          const tokens = enTokens(l.en);
          // 語数が変わったら穴あき(mask)はやり直し（番号がズレて誤った語が隠れる事故を防ぐ）
          if (tokens.length !== nBefore) l.mask = [];
          // 💡語義は消さず、綴りスナップショット(w)で新しい位置につなぎ直す（見つからない語は⚠つきで残る）
          l.notes = reanchorNotes(l.notes || [], tokens);
          if (l.tStart != null) {
            // 単語数が変わらない編集（「/」の挿入・スペル修正など）はタイミングを保持
            if (l.words.length && l.words.length === tokens.length) {
              l.words = l.words.map((w, i) => ({ ...w, text: tokens[i] }));
            } else {
              autoAssignWords(l); // 単語数が変わったら再割り付け
            }
          }
        }
      }, { coalesce: true });
    };
    const addRow = (afterId) => {
      onCommit((np) => {
        const idx = afterId ? np.lines.findIndex((l) => l.id === afterId) + 1 : np.lines.length;
        np.lines.splice(idx, 0, makeLine());
      });
    };
    const addGap = () => onCommit((np) => { np.lines.push(makeGap()); });
    const removeRow = (id) => {
      const line = project.lines.find((l) => l.id === id);
      onCommit((np) => { np.lines = np.lines.filter((l) => l.id !== id); });
      onToast((line && line.type === "gap" ? "間奏" : "行") + "を削除しました", "元に戻す");
    };
    const moveRow = (id, dir) => {
      onCommit((np) => {
        const i = np.lines.findIndex((l) => l.id === id);
        const j = i + dir;
        if (i < 0 || j < 0 || j >= np.lines.length) return;
        const [row] = np.lines.splice(i, 1);
        np.lines.splice(j, 0, row);
      });
    };
    // 💡語義の登録/変更/削除（text=null で削除・空文字=下線だけ）。範囲wi..we（フレーズ可）・交差する既存チップは置き換え。
    // wi昇順で保存し、外れた語義(wi:-1)は末尾へ
    const setGloss = (lineId, wi, we, w, text) => {
      onCommit((np) => {
        const l = np.lines.find((x) => x.id === lineId);
        if (!l) return;
        l.notes = (l.notes || []).filter((nt) => nt.wi < 0 || (nt.we ?? nt.wi) < wi || nt.wi > we);
        if (text != null) l.notes.push({ wi, we, w, text: (text || "").trim().slice(0, 20) });
        l.notes.sort((a, b) => (a.wi < 0 ? 999 : a.wi) - (b.wi < 0 ? 999 : b.wi));
      }, { coalesce: true });
    };
    const removeOrphan = (lineId, nt0) => {
      onCommit((np) => {
        const l = np.lines.find((x) => x.id === lineId);
        if (l) l.notes = (l.notes || []).filter((nt) => !(nt.wi < 0 && nt.w === nt0.w && nt.text === nt0.text));
      });
    };

    let num = 0;
    return html`
      <div className="lyrics-wrap">
        <div className="lyrics-toolbar">
          <span className="h1" style=${{ fontSize: "17px" }}>歌詞を入力しましょう</span>
          <div style=${{ marginLeft: "auto", display: "flex", gap: "8px", alignItems: "center" }}>
            <span className="sub tnum" style=${{ fontSize: "12px" }}>
              英語${enCount}行 / 和訳${jaCount}行 ${annotCount > 0 ? "/ 💡注釈" + annotCount + "行" : ""} ${enCount > 0 && jaCount >= enCount ? "✓" : ""}
            </span>
            <button className="btn btn-secondary btn-sm" onClick=${() => onPaste("ja")}>和訳を貼り付け</button>
            <button className="btn btn-primary btn-sm" onClick=${() => onPaste("en")}>英語を貼り付け</button>
          </div>
        </div>
        ${rows.length > 0 && html`<div className="sub" style=${{ fontSize: "12px" }}>
          💡 長い行は「<b>/</b>」を入れるとその位置で改行できます（例: Morning light <b>/</b> is calling my name）。行は分かれないので和訳とのペアやタップ回数はそのままです
        </div>`}
        <div className="lyrics-table-wrap">
          ${rows.length === 0
            ? html`<div className="empty-state">
                <div className="big">🎼</div>
                <div>まず英語の歌詞を貼り付けましょう<br/><span className="sub">Sunoの歌詞をそのままコピーでOK。空行は自動で「間奏」になります</span></div>
                <button className="btn btn-primary" onClick=${() => onPaste("en")}>英語を貼り付け</button>
              </div>`
            : html`<table className="lyrics">
                <thead><tr>
                  <th className="row-num">行</th>
                  <th>英語歌詞（カラオケ表示されます）</th>
                  <th>和訳（下に小さく表示されます）</th>
                  <th style=${{ width: "140px" }}></th>
                </tr></thead>
                <tbody>
                  ${rows.map((l) => {
                    if (l.type === "gap") {
                      return html`<tr key=${l.id} className="gap-row">
                        <td className="row-num">♪</td>
                        <td colSpan="2">──── 間奏 ────</td>
                        <td><div className="row-tools">
                          <button className="btn-icon" title="上へ" onClick=${() => moveRow(l.id, -1)}>↑</button>
                          <button className="btn-icon" title="下へ" onClick=${() => moveRow(l.id, 1)}>↓</button>
                          <button className="btn-icon" title="削除" onClick=${() => removeRow(l.id)}>✕</button>
                        </div></td>
                      </tr>`;
                    }
                    num++;
                    const nts = l.notes || [];
                    const hasAnnot = nts.length > 0 || (l.point || "").trim();
                    const toggleAnnotOpen = () => { setAnnotOpen(annotOpen === l.id ? null : l.id); setGlossEdit(null); };
                    const mainTr = html`<tr key=${l.id}>
                      <td className="row-num tnum">${num}</td>
                      <td>
                        <input className="cell-input" value=${l.en} placeholder="英語の歌詞"
                          onChange=${(e) => update(l.id, "en", e.target.value)} />
                        ${lineTooLong(l.en) && html`<div className="cell-warn">⚠ 長い行のため文字が小さくなります。「/」を入れるとその位置で改行できます（行は分かれず、和訳とのペアもそのまま）</div>`}
                        ${hasAnnot && html`<div className="cell-annot" onClick=${toggleAnnotOpen}>💡 ${nts.length ? "語義" + nts.length + "件" : ""}${nts.length && (l.point || "").trim() ? " ・ " : ""}${(l.point || "").trim() ? "ポイントあり" : ""}</div>`}
                      </td>
                      <td><input className="cell-input" value=${l.ja} placeholder="（和訳・空欄でもOK）"
                        onChange=${(e) => update(l.id, "ja", e.target.value)} /></td>
                      <td><div className="row-tools">
                        <button className=${"btn-icon" + (hasAnnot ? " annot-has" : "")} title="語義・ポイントを仕込む" onClick=${toggleAnnotOpen}>💡</button>
                        <button className="btn-icon" title="上へ" onClick=${() => moveRow(l.id, -1)}>↑</button>
                        <button className="btn-icon" title="下へ" onClick=${() => moveRow(l.id, 1)}>↓</button>
                        <button className="btn-icon" title="下に行を追加" onClick=${() => addRow(l.id)}>⤵</button>
                        <button className="btn-icon" title="削除" onClick=${() => removeRow(l.id)}>✕</button>
                      </div></td>
                    </tr>`;
                    if (annotOpen !== l.id) return mainTr;
                    const ge = glossEdit && glossEdit.lineId === l.id ? glossEdit : null;
                    return [mainTr, html`<tr key=${l.id + ":ae"} className="annot-edit-row">
                      <td></td>
                      <td colSpan="3"><div className="ae-box">
                        <div className="ae-head">
                          <span className="t">💡 この行の注釈</span>
                          <span>授業モードでだけ表示されます（動画には入りません）</span>
                          <span style=${{ marginLeft: "auto" }}></span>
                          <button className="btn btn-secondary btn-sm" onClick=${() => { setAnnotOpen(null); setGlossEdit(null); }}>✔ できあがり</button>
                        </div>
                        <div className="ae-toks">
                          ${(() => {
                            const toks = enTokens(l.en);
                            const tapTok = (i) => {
                              if (ge) {
                                if (i === ge.we + 1 || i === ge.wi - 1) { // となりの語＝フレーズをのばす
                                  const wi2 = Math.min(ge.wi, i), we2 = Math.max(ge.we, i);
                                  setGlossEdit({ ...ge, wi: wi2, we: we2, w: toks.slice(wi2, we2 + 1).join(" ") });
                                  return;
                                }
                                if (i === ge.we && ge.we > ge.wi) { // 端を再タップ＝1語ちぢめる
                                  setGlossEdit({ ...ge, we: ge.we - 1, w: toks.slice(ge.wi, ge.we).join(" ") });
                                  return;
                                }
                                if (i >= ge.wi && i <= ge.we) return; // 範囲の内側＝なにもしない
                              }
                              const g0 = nts.find((nt) => nt.wi >= 0 && nt.wi <= i && i <= (nt.we ?? nt.wi));
                              setGlossEdit(g0
                                ? { lineId: l.id, wi: g0.wi, we: g0.we ?? g0.wi, w: g0.w, val: g0.text }
                                : { lineId: l.id, wi: i, we: i, w: toks[i], val: "" });
                            };
                            const out = [];
                            for (let i = 0; i < toks.length; i++) {
                              const g = nts.find((nt) => nt.wi === i && nt.wi >= 0);
                              if (g) { // 保存済みの語義＝範囲をまとめた1つのピル（フレーズは「is calling ─ 意味」）
                                const gwe = g.we ?? g.wi;
                                out.push(html`<button key=${i} className="ae-tok has" title="タップで意味を書きかえ"
                                  onClick=${() => tapTok(i)}>
                                  <b>${g.w}</b>${g.text ? " ─ " + g.text : " （線だけ）"}
                                  <span className="x" title="この注釈を消す"
                                    onClick=${(e) => { e.stopPropagation(); setGloss(l.id, g.wi, gwe, g.w, null); if (ge && ge.wi === g.wi) setGlossEdit(null); }}>✕</span>
                                </button>`);
                                i = gwe; continue;
                              }
                              const inSel = ge && i >= ge.wi && i <= ge.we;
                              const ext = ge && !inSel && (i === ge.we + 1 || i === ge.wi - 1);
                              out.push(html`<button key=${i} className=${"ae-tok" + (inSel ? " sel" : "") + (ext ? " ext" : "")}
                                title=${inSel ? (i === ge.we && ge.we > ge.wi ? "もう一度タップで1語ちぢめる" : "選択中")
                                  : ext ? "タップでフレーズにふくめる"
                                  : "タップで意味を入力（つづけて となりの語をタップするとフレーズになります）"}
                                onClick=${() => tapTok(i)}>${toks[i]}</button>`);
                            }
                            return out;
                          })()}
                          ${nts.filter((nt) => nt.wi < 0).map((nt, i) => html`<span key=${"o" + i} className="ae-tok has"
                            title="英語を書きかえたため、この単語が見つかりません（行の注釈として表示されます）">
                            ⚠ <b>${nt.w}</b>${nt.text ? " ─ " + nt.text : " （線だけ）"}
                            <span className="x" title="この語義を消す" onClick=${() => removeOrphan(l.id, nt)}>✕</span>
                          </span>`)}
                        </div>
                        ${ge && html`<div className="ae-input-row">
                          <span>「<b>${ge.w}</b>」の意味・はたらき:</span>
                          <input className="cell-input" autoFocus maxLength="20" value=${ge.val}
                            placeholder="例: 進行形（〜しているところ）"
                            onChange=${(e) => setGlossEdit({ ...ge, val: e.target.value })}
                            onKeyDown=${(e) => {
                              if (e.key === "Escape") e.stopPropagation();
                              if (imeKey(e)) return; // 日本語の変換確定では閉じない（もう一度Enterで確定）
                              if (e.key === "Enter") { setGloss(l.id, ge.wi, ge.we, ge.w, ge.val); setGlossEdit(null); }
                              if (e.key === "Escape") setGlossEdit(null);
                            }} />
                          <button className="btn btn-primary btn-sm" onClick=${() => { setGloss(l.id, ge.wi, ge.we, ge.w, ge.val); setGlossEdit(null); }}>
                            ${nts.some((nt) => nt.wi === ge.wi && (nt.we ?? nt.wi) === ge.we) ? "変更" : (ge.val || "").trim() ? "追加" : "線だけ追加"}</button>
                          <button className="btn btn-secondary btn-sm" onClick=${() => setGlossEdit(null)}>やめる</button>
                        </div>`}
                        <div className="ae-point-row">
                          <span>一言ポイント（この行にひとつ・みじかく）:</span>
                          <input className="cell-input" maxLength="60" value=${l.point || ""}
                            placeholder="例: have to 〜 = 〜しなければならない"
                            onChange=${(e) => update(l.id, "point", e.target.value)} />
                        </div>
                        <div className="ae-hint">となりの語をタップすると「is calling」のようなフレーズにまとめられます。意味を空のまま追加すると<b>下線だけ</b>引けます（消すときはチップの✕）。英語の歌詞を書きかえて語が変わると語義は外れます（⚠つきで残ります）</div>
                      </div></td>
                    </tr>`];
                  })}
                </tbody>
              </table>`}
        </div>
        ${rows.length > 0 && html`<div style=${{ display: "flex", gap: "8px" }}>
          <button className="btn btn-secondary btn-sm" onClick=${() => addRow(null)}>＋ 行を追加</button>
          <button className="btn btn-secondary btn-sm" onClick=${addGap}>♪ 間奏を挿入</button>
        </div>`}
      </div>`;
  }

  /* ---------- 貼り付けモーダル ---------- */
  function PasteModal({ kind, hasExisting, onApply, onClose }) {
    const [text, setText] = useState("");
    const [tagMode, setTagMode] = useState("convert");
    const hasTags = /^\s*\[[^\]]+\]\s*$/m.test(text);
    return html`
      <div className="modal-backdrop" onClick=${(e) => { if (e.target === e.currentTarget) onClose(); }}>
        <div className="modal">
          <div className="modal-head">
            <span className="h2">${kind === "en" ? "英語の歌詞を貼り付け" : "和訳を貼り付け"}</span>
            <button className="btn-icon modal-close" onClick=${onClose}>✕</button>
          </div>
          <div className="modal-body" style=${{ display: "flex", flexDirection: "column", gap: "10px" }}>
            ${kind === "en" && hasExisting && html`
              <div className="banner" style=${{ borderRadius: "8px", border: "1px solid var(--border)" }}>
                ⚠ 取り込むと、現在の歌詞（同期のタイミングを含む）はすべて置き換わります
              </div>`}
            <textarea rows="12" autoFocus placeholder=${kind === "en" ? "Sunoの歌詞をそのまま貼り付けてください" : "和訳を1行ずつ貼り付けてください（上から順に英語の行へ割り当てられます）"}
              value=${text} onChange=${(e) => setText(e.target.value)}
              style=${{ resize: "vertical", lineHeight: 1.7 }}></textarea>
            ${kind === "en" && hasTags && html`
              <div className="panel" style=${{ padding: "12px 14px", fontSize: "13px" }}>
                <div style=${{ fontWeight: 600, marginBottom: "6px" }}>［Verse］［Chorus］などのセクション見出しが見つかりました</div>
                ${[["convert", "間奏マークに変換する（おすすめ）"], ["remove", "削除する"], ["keep", "歌詞としてそのまま残す"]].map(([v, label]) => html`
                  <label key=${v} style=${{ display: "flex", alignItems: "center", gap: "8px", padding: "3px 0", cursor: "pointer" }}>
                    <input type="radio" name="tagmode" checked=${tagMode === v} onChange=${() => setTagMode(v)} />${label}
                  </label>`)}
              </div>`}
          </div>
          <div className="modal-foot">
            <button className="btn btn-secondary" onClick=${onClose}>やめる</button>
            <button className="btn btn-primary" disabled=${!text.trim()} onClick=${() => onApply(text, tagMode)}>取り込む</button>
          </div>
        </div>
      </div>`;
  }

  /* ---------- ① 取り込み画面 ---------- */
  function WaveThumb({ epoch }) {
    const ref = useRef(null);
    useEffect(() => {
      const canvas = ref.current;
      if (!canvas || !AE.peaks) return;
      const dpr = window.devicePixelRatio || 1;
      const W = canvas.clientWidth, H = canvas.clientHeight;
      canvas.width = W * dpr; canvas.height = H * dpr;
      const ctx = canvas.getContext("2d");
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      drawWave(ctx, AE.peaks, 0, AE.duration, 0, 0, W, H, "#7C6CFF");
    }, [epoch]);
    return html`<canvas className="wave-thumb" ref=${ref}></canvas>`;
  }

  function ImportScreen({ project, audioEpoch, onLoadFile, onCommit, busy, error }) {
    const [drag, setDrag] = useState(false);
    const fileRef = useRef(null);
    const [, setTick] = useState(0);
    useEffect(() => { const iv = setInterval(() => setTick((n) => n + 1), 300); return () => clearInterval(iv); }, []);

    const pick = (files) => {
      if (!files || !files.length) return;
      onLoadFile(files[0]);
    };
    const loaded = project.audio && AE.ready;

    return html`
      <div className="screen-center" style=${{ gap: "20px" }}
        onDragOver=${(e) => { e.preventDefault(); setDrag(true); }}
        onDragLeave=${() => setDrag(false)}
        onDrop=${(e) => { e.preventDefault(); setDrag(false); pick(e.dataTransfer.files); }}>
        <div className="h1">曲のファイルを取り込みましょう</div>
        ${!loaded && html`
          <div className=${"dropzone" + (drag ? " drag" : "")}>
            <div style=${{ fontSize: "34px" }}>🎵</div>
            ${busy
              ? html`<div>${busy}</div>`
              : html`
                <div style=${{ fontSize: "15px" }}>ここに <b>MP3 / WAV</b> をドラッグ＆ドロップ</div>
                <button className="btn btn-primary" onClick=${() => fileRef.current.click()}>ファイルを選択</button>
                <div className="sub">SunoからダウンロードしたMP3でOKです</div>`}
            ${error && html`<div style=${{ color: "var(--danger)", fontSize: "13px" }}>${error}</div>`}
          </div>`}
        ${loaded && html`
          <div className="panel audio-card">
            <div style=${{ display: "flex", alignItems: "center", gap: "10px" }}>
              <span style=${{ color: "var(--success)" }}>✓</span>
              <b>${project.audio.fileName}</b>
              <span className="sub tnum">${fmtDur(AE.duration)}</span>
              ${project.audio.sample && html`<span className="chip accent">サンプル曲</span>`}
            </div>
            <${WaveThumb} epoch=${audioEpoch} />
            <div style=${{ display: "flex", alignItems: "center", gap: "10px" }}>
              <button className="btn btn-secondary btn-sm" onClick=${() => AE.toggle()}>${AE.playing ? "⏸ 停止" : "▶ 試聴"}</button>
              <span className="sub tnum" style=${{ fontSize: "12px" }}>${fmtTime(AE.t())}</span>
              <button className="btn-text btn-sm" style=${{ marginLeft: "auto" }}
                onClick=${() => { AE.pause(); fileRef.current.click(); }}>別のファイルにする</button>
            </div>
          </div>
          <div style=${{ display: "flex", alignItems: "center", gap: "10px" }}>
            <span className="sub">曲のタイトル:</span>
            <input value=${project.meta.title} style=${{ width: "280px" }}
              onChange=${(e) => onCommit((np) => { np.meta.title = e.target.value; }, { coalesce: true })} />
            <span className="sub" style=${{ fontSize: "11px" }}>（PVのファイル名になります）</span>
          </div>`}
        <input type="file" accept=".mp3,.wav,audio/mpeg,audio/wav,audio/x-wav" ref=${fileRef} style=${{ display: "none" }}
          onChange=${(e) => { pick(e.target.files); e.target.value = ""; }} />
      </div>`;
  }

  /* ---------- ④ デザイン画面 ---------- */
  function BgItem({ b, project, onCommit, onToast, onTick }) {
    const fileRef = useRef(null);
    const status = MediaLib.status(b.id);
    const item = MediaLib.items.get(b.id);
    const lyrics = lyricLines(project);
    const fromLine = b.fromLineId ? project.lines.find((l) => l.id === b.fromLineId) : null;
    const startT = b.fromLineId ? (fromLine && fromLine.tStart != null ? fromLine.tStart : null) : 0;
    const autoOn = !!(project.bgAuto && project.bgAuto.on); // おまかせ中は「どの行から」は使わない

    const relink = async (file) => {
      const it = await MediaLib.add(b.id, file);
      if (it.error) { MediaLib.remove(b.id); onToast(`「${file.name}」を読み込めませんでした`); return; }
      mediaDB.put("bg:" + b.id, file);
      onCommit((np) => {
        const bb = np.backgrounds.find((x) => x.id === b.id);
        if (bb) { bb.fileName = file.name; bb.size = file.size; bb.type = it.kind; }
      });
      onTick();
    };

    return html`
      <div className="bg-item">
        ${status === "ready" && item
          ? (item.kind === "image"
              ? html`<img className="bg-thumb" src=${item.url} />`
              : html`<video className="bg-thumb" muted src=${item.url} preload="metadata"></video>`)
          : html`<div className="bg-thumb-missing">${status === "loading" ? "⏳" : "⚠"}</div>`}
        <div className="bg-info">
          <div className="bg-name">${b.type === "video" ? "🎞" : "🖼"} ${b.fileName}
            <span className="kind">${b.type === "video" ? "動画（自動ループ・無音）" : "画像"}</span>
          </div>
          <div className="bg-row2">
            ${!autoOn && html`
              <select value=${b.fromLineId || ""}
                onChange=${(e) => onCommit((np) => {
                  const bb = np.backgrounds.find((x) => x.id === b.id);
                  if (bb) bb.fromLineId = e.target.value || null;
                })}>
                <option value="">最初から</option>
                ${lyrics.map((l, i) => html`
                  <option key=${l.id} value=${l.id}>
                    行${i + 1}「${(l.en || "").slice(0, 14)}${(l.en || "").length > 14 ? "…" : ""}」から${l.tStart == null ? "（未同期）" : ""}
                  </option>`)}
              </select>`}
            <select value=${b.posY || "center"} title="縦位置（上下がトリミングされるとき）"
              onChange=${(e) => onCommit((np) => {
                const bb = np.backgrounds.find((x) => x.id === b.id);
                if (bb) bb.posY = e.target.value;
              })}>
              <option value="top">上寄せ</option>
              <option value="center">中央</option>
              <option value="bottom">下寄せ</option>
            </select>
            ${!autoOn && html`
              <button className="btn-icon" title="この位置をプレビューで確認"
                onClick=${() => { if (startT != null) { AE.seek(Math.max(0, startT - 1.5)); AE.play(); } }}>▶</button>`}
            <button className="btn-icon" title="この背景を削除"
              onClick=${() => { onCommit((np) => { np.backgrounds = np.backgrounds.filter((x) => x.id !== b.id); }); onToast("背景を削除しました", "元に戻す"); }}>✕</button>
          </div>
          ${!autoOn && b.fromLineId && startT == null && html`
            <div className="bg-warn">⚠ この行はまだ同期されていないため、この背景は表示されません（③同期のあとに反映されます）</div>`}
          ${status !== "ready" && status !== "loading" && html`
            <div className="bg-row2">
              <span className="bg-warn">⚠ ファイルが見つかりません</span>
              <button className="btn btn-secondary btn-sm" onClick=${() => fileRef.current.click()}>ファイルを再選択</button>
            </div>`}
        </div>
        <input type="file" accept="image/*,video/mp4,video/webm,.mp4,.webm,.mov" ref=${fileRef} style=${{ display: "none" }}
          onChange=${(e) => { if (e.target.files.length) relink(e.target.files[0]); e.target.value = ""; }} />
      </div>`;
  }

  // 次の行の表示モード（④デザインの設定＝MP4にも反映 / 授業モードのMキーは一時切替）
  const NEXT_PREVIEW_MODES = ["single", "standby", "duet", "cue"];
  const NEXT_PREVIEW_LABELS = { single: "1行のみ", standby: "スタンバイ", duet: "2段交互", cue: "予告つき" };

  // おまかせローテーション用: 素材の並びを一度だけシャッフル（保存して固定＝プレビュー＝MP4が一致）
  function shuffledBgIds(bgs) {
    const a = (bgs || []).map((b) => b.id);
    for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); const t = a[i]; a[i] = a[j]; a[j] = t; }
    return a;
  }
  const AUTO_DEFAULT = { on: false, by: "time", every: "normal", shuffle: true, order: [] };
  const BG_EVERY_LABELS = { short: "短め", normal: "ふつう", long: "長め" };

  function DesignScreen({ project, onCommit, scrubRef, onToast }) {
    const ov = project.style.overrides;
    const scaleLabel = Object.keys(FONT_SCALES).find((k) => FONT_SCALES[k] === (ov.fontScale || 1)) || "標準";
    const addRef = useRef(null);
    const [, setTick] = useState(0);
    const tick = () => setTick((n) => n + 1);

    const addBgFiles = async (files) => {
      for (const f of Array.from(files)) {
        const isVideo = (f.type || "").startsWith("video") || /\.(mp4|webm|mov|m4v)$/i.test(f.name);
        const isImage = (f.type || "").startsWith("image") || /\.(png|jpe?g|gif|webp|bmp)$/i.test(f.name);
        if (!isVideo && !isImage) { onToast(`「${f.name}」は画像・動画ではないため追加できません`); continue; }
        if (f.size > 200e6) onToast(`「${f.name}」は${Math.round(f.size / 1e6)}MBと大きめです。書き出しに時間がかかることがあります`);
        const bg = makeBackground(f, isVideo ? "video" : "image");
        const item = await MediaLib.add(bg.id, f);
        if (item.error) { MediaLib.remove(bg.id); onToast(`「${f.name}」を読み込めませんでした（対応形式: JPG/PNG/MP4など）`); continue; }
        mediaDB.put("bg:" + bg.id, f);
        onCommit((np) => { np.backgrounds.push(bg); });
      }
      tick();
    };

    // 表示は「登場順」（開始時刻の早い順。未同期行に紐づくものは最後）
    const sortedBgs = [...(project.backgrounds || [])].sort((a, b) => {
      const st = (x) => {
        if (!x.fromLineId) return 0;
        const l = project.lines.find((li) => li.id === x.fromLineId);
        return l && l.tStart != null ? l.tStart : 1e9;
      };
      return st(a) - st(b);
    });

    // おまかせローテーション
    const auto = Object.assign({}, AUTO_DEFAULT, project.bgAuto);
    const bgCount = (project.backgrounds || []).length;
    const withAuto = (fn) => onCommit((np) => { np.bgAuto = Object.assign({}, AUTO_DEFAULT, np.bgAuto); fn(np.bgAuto, np); });
    const toggleAuto = () => withAuto((a, np) => {
      a.on = !a.on;
      if (a.on && a.shuffle && (!a.order || a.order.length !== (np.backgrounds || []).length)) a.order = shuffledBgIds(np.backgrounds);
    });
    const reshuffle = () => withAuto((a, np) => { a.shuffle = true; a.order = shuffledBgIds(np.backgrounds); });
    const setEvery = (e) => withAuto((a) => { a.every = e; });
    const setBy = (by) => withAuto((a) => { a.by = by; });
    // 「歌詞の区切り」が実際に効くか（間奏で区切られた歌詞のかたまりが2つ以上あるか）
    const hasSections = (() => {
      let n = 0, boundary = true;
      for (const l of (project.lines || [])) {
        if (l.type === "gap") { boundary = true; continue; }
        if (l.type !== "lyric" || l.tStart == null) continue;
        if (boundary) { n++; boundary = false; }
      }
      return n >= 2;
    })();
    const setShuffle = (on) => withAuto((a, np) => { a.shuffle = on; if (on && (!a.order || a.order.length !== (np.backgrounds || []).length)) a.order = shuffledBgIds(np.backgrounds); });

    return html`
      <div className="design-wrap">
        <div className="design-preview-pane">
          <div className="preview-flex"><${Preview} project=${project} scrubRef=${scrubRef} /></div>
          <${TransportBar} loopId=${null} onClearLoop=${() => {}} />
          <div className="sub" style=${{ fontSize: "12px" }}>▶ 再生するとカラオケ表示と背景を確認できます</div>
        </div>
        <div className="design-side">
          <div className="side-section">
            <div className="side-title">スタイル</div>
            <div className="preset-grid">
              ${PRESET_META.map((pm) => html`
                <button key=${pm.id}
                  className=${"preset-card" + (project.style.presetId === pm.id ? " sel" : "")}
                  onClick=${() => onCommit((np) => { np.style.presetId = pm.id; })}>
                  <div className="preset-thumb" style=${{ background: pm.thumb.bg, color: pm.thumb.fg, fontFamily: pm.thumb.font || "inherit" }}>${pm.name}</div>
                  <div className="preset-label">
                    ${project.style.presetId === pm.id ? "✓ " : ""}${pm.name}
                  </div>
                  <div className="preset-label cap" style=${{ paddingTop: 0 }}>${pm.cap}</div>
                </button>`)}
            </div>
          </div>
          <div className="side-section">
            <div className="side-title">背景（画像・動画）</div>
            ${(project.backgrounds || []).length === 0 && html`
              <div className="sub" style=${{ fontSize: "12px", marginBottom: "8px" }}>
                背景を入れなくても、プリセットのグラデーション背景で完成品になります。<br/>
                写真や動画を入れると、その上に歌詞が表示されます（Pexels・Pixabayなどのフリー素材がおすすめ）。
              </div>`}
            <div className="bg-list">
              ${sortedBgs.map((b) => html`<${BgItem} key=${b.id} b=${b} project=${project} onCommit=${onCommit} onToast=${onToast} onTick=${tick} />`)}
            </div>
            <div style=${{ marginTop: "10px", display: "flex", gap: "8px", alignItems: "center" }}>
              <button className="btn btn-secondary btn-sm" onClick=${() => addRef.current.click()}>＋ 背景を追加</button>
              ${bgCount > 0 && !auto.on && html`<span className="sub" style=${{ fontSize: "11px" }}>2枚目からは「どの行から」を選べます</span>`}
              ${auto.on && html`<span className="sub" style=${{ fontSize: "11px" }}>放り込むだけで自動で流れます</span>`}
            </div>
            ${bgCount > 1 && html`
              <div className="toggle-row" style=${{ marginTop: "10px" }}>
                <span>おまかせローテーション<span className="sub" style=${{ fontSize: "11px", marginLeft: "6px" }}>（素材を自動で順ぐりに）</span></span>
                <button className=${"toggle" + (auto.on ? " on" : "")} onClick=${toggleAuto}>
                  <span className="knob"></span>
                </button>
              </div>
              ${auto.on && html`
                <div style=${{ margin: "2px 0 4px", padding: "8px 10px", background: "rgba(255,255,255,0.04)", borderRadius: "8px" }}>
                  <div className="toggle-row" style=${{ marginTop: 0 }}>
                    <span style=${{ fontSize: "13px" }}>切り替えのタイミング</span>
                    <div className="segmented">
                      <button className=${auto.by !== "section" ? "on" : ""} onClick=${() => setBy("time")}>時間で</button>
                      <button className=${auto.by === "section" ? "on" : ""} onClick=${() => setBy("section")}>歌詞の区切り</button>
                    </div>
                  </div>
                  ${auto.by === "section"
                    ? html`<div className="sub" style=${{ fontSize: "11px", marginTop: "2px" }}>
                        ${hasSections
                          ? "間奏（②歌詞で入れた空行）ごとに背景が切り替わります。ひとまとまり＝1つの背景。"
                          : "⚠ いまは区切り（間奏の空行）が無いため、時間で切り替わります。②歌詞で空行を入れると区切りで切り替わります。"}</div>`
                    : html`<div className="toggle-row">
                        <span style=${{ fontSize: "13px" }}>切り替え間隔</span>
                        <div className="segmented">
                          ${["short", "normal", "long"].map((e) => html`
                            <button key=${e} className=${auto.every === e ? "on" : ""} onClick=${() => setEvery(e)}>${BG_EVERY_LABELS[e]}</button>`)}
                        </div>
                      </div>`}
                  <div className="toggle-row">
                    <span style=${{ fontSize: "13px" }}>並び順</span>
                    <div style=${{ display: "flex", gap: "6px", alignItems: "center" }}>
                      <div className="segmented">
                        <button className=${auto.shuffle ? "on" : ""} onClick=${() => setShuffle(true)}>シャッフル</button>
                        <button className=${!auto.shuffle ? "on" : ""} onClick=${() => setShuffle(false)}>入れた順</button>
                      </div>
                      ${auto.shuffle && html`<button className="btn btn-secondary btn-sm" title="並びを引き直す" onClick=${reshuffle}>🎲 引き直す</button>`}
                    </div>
                  </div>
                  <div className="sub" style=${{ fontSize: "11px", marginTop: "2px" }}>${auto.by === "section" ? "決めた並びは固定されるので、" : "全部の素材が最低1回は出ます。決めた並びは固定されるので、"}プレビューと書き出すMP4は同じになります。</div>
                </div>`}`}
            ${bgCount > 1 && html`
              <div className="toggle-row" style=${{ marginTop: "6px" }}>
                <span>切り替え効果</span>
                <div className="segmented">
                  <button className=${project.bgTransition !== "cut" ? "on" : ""}
                    onClick=${() => onCommit((np) => { np.bgTransition = "fade"; })}>クロスフェード</button>
                  <button className=${project.bgTransition === "cut" ? "on" : ""}
                    onClick=${() => onCommit((np) => { np.bgTransition = "cut"; })}>カット</button>
                </div>
              </div>`}
            ${(project.backgrounds || []).some((b) => b.type === "image") && html`
              <div className="toggle-row">
                <span>写真をゆっくりズーム<span className="sub" style=${{ fontSize: "11px", marginLeft: "6px" }}>（Ken Burns効果）</span></span>
                <button className=${"toggle" + (ov.kenBurns !== false ? " on" : "")}
                  onClick=${() => onCommit((np) => { np.style.overrides.kenBurns = !(np.style.overrides.kenBurns !== false); })}>
                  <span className="knob"></span>
                </button>
              </div>`}
            <input type="file" multiple accept="image/*,video/mp4,video/webm,.mp4,.webm,.mov" ref=${addRef} style=${{ display: "none" }}
              onChange=${(e) => { if (e.target.files.length) addBgFiles(e.target.files); e.target.value = ""; }} />
          </div>
          <div className="side-section">
            <div className="side-title">調整</div>
            <div className="toggle-row">
              <span>文字サイズ</span>
              <div className="segmented">
                ${Object.keys(FONT_SCALES).map((k) => html`
                  <button key=${k} className=${scaleLabel === k ? "on" : ""}
                    onClick=${() => onCommit((np) => { np.style.overrides.fontScale = FONT_SCALES[k]; })}>${k}</button>`)}
              </div>
            </div>
            <div className="toggle-row">
              <span>和訳を表示</span>
              <button className=${"toggle" + (ov.showJa ? " on" : "")}
                onClick=${() => onCommit((np) => { np.style.overrides.showJa = !np.style.overrides.showJa; })}>
                <span className="knob"></span>
              </button>
            </div>
            <div className="toggle-row">
              <span>行番号を表示<span className="sub" style=${{ fontSize: "11px", marginLeft: "6px" }}>（スタイルに合わせた書体）</span></span>
              <button className=${"toggle" + (ov.lineNumbers ? " on" : "")}
                onClick=${() => onCommit((np) => { np.style.overrides.lineNumbers = !np.style.overrides.lineNumbers; })}>
                <span className="knob"></span>
              </button>
            </div>
            ${ov.lineNumbers && html`
              <div className="toggle-row">
                <span>行番号の位置</span>
                <div className="segmented">
                  <button className=${ov.lineNumPos !== "side" ? "on" : ""}
                    onClick=${() => onCommit((np) => { np.style.overrides.lineNumPos = "shoulder"; })}>左肩（上）</button>
                  <button className=${ov.lineNumPos === "side" ? "on" : ""}
                    onClick=${() => onCommit((np) => { np.style.overrides.lineNumPos = "side"; })}>左横</button>
                </div>
              </div>
              <div className="sub" style=${{ fontSize: "11px" }}>②歌詞・③同期と同じ番号です（間奏は数えません）。授業で「◯行目から」と指示しやすくなります</div>`}
            <div className="toggle-row" style=${{ marginTop: "6px" }}>
              <span>次の行の表示<span className="sub" style=${{ fontSize: "11px", marginLeft: "6px" }}>（カラオケ風の待機）</span></span>
            </div>
            <div className="segmented" style=${{ display: "flex", width: "100%" }}>
              ${NEXT_PREVIEW_MODES.map((m) => html`
                <button key=${m} className=${(ov.nextPreview || "single") === m ? "on" : ""}
                  style=${{ flex: 1, padding: "5px 4px", whiteSpace: "nowrap" }}
                  onClick=${() => onCommit((np) => { np.style.overrides.nextPreview = m; })}>${NEXT_PREVIEW_LABELS[m]}</button>`)}
            </div>
            <div className="sub" style=${{ fontSize: "11px" }}>次の歌詞を下に先出しすると歌い出しがそろいます（書き出すMP4にも反映）。「2段交互」は本物のカラオケ式、「予告つき」は間奏明けにドットでカウントダウン</div>
            <div className="toggle-row">
              <span>全体のズレ補正 <span className="sub tnum">(${ov.syncOffsetMs || 0}ms)</span></span>
              <input type="range" min="-300" max="300" step="10" value=${ov.syncOffsetMs || 0}
                style=${{ width: "140px", padding: 0 }}
                onChange=${(e) => onCommit((np) => { np.style.overrides.syncOffsetMs = parseInt(e.target.value, 10); }, { coalesce: true })} />
            </div>
            <div className="sub" style=${{ fontSize: "11px" }}>歌詞全体が一律に遅れて見えるときはプラスに（プラス=歌詞を早める）</div>
          </div>
        </div>
      </div>`;
  }

  /* ---------- 📲 iPadに配る（曲パック）カード: ⑤書き出しの下段 ---------- */
  function DistribCard({ project, onCommit, onToast }) {
    const [base, setBase] = useState(() => store.get(PUB_BASE_KEY) || "");
    const [editBase, setEditBase] = useState(() => !store.get(PUB_BASE_KEY));
    const [baseDraft, setBaseDraft] = useState(() => store.get(PUB_BASE_KEY) || "");
    const [man, setMan] = useState(null);       // 同梱内容の下調べ結果
    const [phase, setPhase] = useState("idle"); // idle | building | done | error
    const [result, setResult] = useState(null); // { fname, size, url }
    const [err, setErr] = useState(null);
    const qrRef = useRef(null);

    const slug = (project.pub && project.pub.slug) || slugify(project.meta.title);
    const slugOk = SLUG_RE.test(slug);
    const normBase = (s) => {
      let v = String(s || "").trim();
      if (!v) return "";
      if (!/^https?:\/\//.test(v)) v = "https://" + v;
      if (!v.endsWith("/")) v += "/";
      return v;
    };
    const url = base && slugOk ? base + "?song=songs/" + slug + ".pack.json" : "";

    useEffect(() => {
      let alive = true;
      packManifest(project).then((m) => { if (alive) setMan(m); });
      return () => { alive = false; };
    }, [project]);
    useEffect(() => { // 完了パネルのQR描画
      if (phase === "done" && result && result.url && qrRef.current) drawQr(qrRef.current, result.url, 300);
    }, [phase, result]);

    const setSlug = (v) => onCommit((np) => { np.pub = np.pub || { note: "", slug: "" }; np.pub.slug = v; }, { coalesce: true });
    const setNote = (v) => onCommit((np) => { np.pub = np.pub || { note: "", slug: "" }; np.pub.note = v.slice(0, 100); }, { coalesce: true });
    const saveBase = () => {
      const v = normBase(baseDraft);
      if (!v) { onToast && onToast("配布先URLを入力してください（例: https://あなたのID.github.io/singsync/）"); return; }
      store.set(PUB_BASE_KEY, v);
      setBase(v); setBaseDraft(v); setEditBase(false);
    };

    const build = async () => {
      setPhase("building"); setErr(null); setResult(null);
      try {
        const pack = await buildSongPack(project, slug);
        const blob = new Blob([JSON.stringify(pack)], { type: "application/json" });
        const fname = slug + ".pack.json";
        const a = document.createElement("a");
        a.href = URL.createObjectURL(blob);
        a.download = fname;
        a.click();
        setTimeout(() => URL.revokeObjectURL(a.href), 5000);
        setResult({ fname, size: blob.size, url });
        setPhase("done");
        onToast && onToast("曲パックを書き出しました 📲");
      } catch (e) {
        console.error(e);
        setErr(e && e.message === "no-audio"
          ? "曲の音声が読み込まれていません（①取り込みで曲を読み込んでからどうぞ）"
          : "書き出しに失敗しました。もう一度お試しください");
        setPhase("error");
      }
    };

    const copyUrl = async () => {
      try { await navigator.clipboard.writeText(result.url); onToast && onToast("URLをコピーしました"); }
      catch (e) { onToast && onToast("コピーできませんでした（URLをなぞって手動でコピーしてください）"); }
    };
    const savePng = () => {
      const c = qrRef.current; if (!c) return;
      const a = document.createElement("a");
      a.href = c.toDataURL("image/png");
      a.download = slug + "-qr.png";
      a.click();
    };
    const printCard = () => { // 掲示用A4（QR大）: 印刷の間だけbodyにシートを差し込む
      const c = qrRef.current; if (!c || !result) return;
      const esc = (s) => String(s).replace(/[&<>"]/g, (ch) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[ch]));
      const div = document.createElement("div");
      div.className = "qr-print-sheet";
      div.innerHTML = '<div class="qp-title">♪ ' + esc(project.meta.title || "") + '</div>' +
        '<img src="' + c.toDataURL("image/png") + '" alt="QR">' +
        '<div class="qp-url">' + esc(result.url) + '</div>' +
        '<div class="qp-steps">① カメラでQRコードを読みとる<br>② 「▶ はじめる」をタップ<br>③ 🎧 イヤホンがあると聞きやすいよ</div>';
      document.body.appendChild(div);
      document.body.classList.add("printing-qr");
      let closed = false;
      const done = () => { if (closed) return; closed = true; document.body.classList.remove("printing-qr"); div.remove(); window.removeEventListener("afterprint", done); };
      window.addEventListener("afterprint", done);
      window.print();
      setTimeout(done, 2000); // afterprintが来ない環境の保険
    };

    const estMB = man ? man.estBytes / 1048576 : 0;
    return html`
      <div className="dist-card">
        <div className="dc-title">📲 iPadに配る（曲パック）</div>
        <div className="dc-sub">GitHubのページに一度プレイヤーを置けば、あとは曲ごとの「曲パック」ファイルを足すだけで、生徒のiPadでこの曲を練習できます（穴あき・注釈・よみあげ・ペンもそのまま入ります）。はじめての方は、公開フォルダ「singsync-site」の <b>はじめかた.html</b> をご覧ください。</div>
        ${editBase ? html`
          <div className="dist-url">
            <span style=${{ fontSize: "13px", whiteSpace: "nowrap" }}>配布先URL</span>
            <input placeholder="https://あなたのID.github.io/singsync/" value=${baseDraft}
              onInput=${(e) => setBaseDraft(e.target.value)} />
            <button className="btn btn-secondary btn-sm" onClick=${saveBase}>このURLをおぼえる</button>
          </div>
          <div className="dc-sub">⚠ GitHub Pagesは「URLを知っていれば誰でも見られる」公開ページです（検索には載りにくく、QRを配った人だけが実質アクセスします）</div>`
        : html`
          <div className="dist-url">
            <span style=${{ fontSize: "12px", color: "var(--text-secondary)" }}>配布先: <b>${base}</b></span>
            <button className="btn btn-secondary btn-sm" onClick=${() => setEditBase(true)}>変更</button>
          </div>`}
        ${man && html`
          <div className="checklist">
            <div className=${"check-item " + (man.audio && man.audio.ok ? "ok" : "bad")}>
              <span className="mark">${man.audio && man.audio.ok ? "✓" : "✕"}</span>
              音声: ${man.audio ? man.audio.name + "（" + (man.audio.size / 1048576).toFixed(1) + " MB）" : "未読み込み（①取り込みへ）"}
            </div>
            ${man.imgs.length > 0 && html`<div className="check-item ok"><span className="mark">✓</span>背景の写真 ${man.imgs.length}枚（${(man.imgs.reduce((s, x) => s + x.size, 0) / 1048576).toFixed(1)} MB）</div>`}
            ${man.videos.map((v) => html`<div key=${v.id} className="check-item warn"><span className="mark">⚠</span>背景の動画「${v.fileName}」は入りません（その区間は残りの写真やグラデーションで表示されます）</div>`)}
            ${man.missing.map((v) => html`<div key=${v.id} className="check-item warn"><span className="mark">⚠</span>背景「${v.fileName}」が読み込まれていないため入りません（④デザインで再選択できます）</div>`)}
            <div className="check-item"><span className="mark">ℹ</span>穴あき${man.masks}語 ・ 注釈${man.notes}件 ・ 同期データも一緒に入ります ・ 合計 約${estMB.toFixed(1)} MB${estMB > 24 ? "" : "（生徒の読み込み目安: 学校Wi-Fiで10〜30秒）"}</div>
            ${estMB > 24 && html`<div className="check-item warn"><span className="mark">⚠</span>24 MBを超えています。GitHubのブラウザアップロードは25 MBまでのため、GitHub Desktopでアップしてください（④デザインで背景写真を減らすと軽くなります）</div>`}
          </div>`}
        <div className="dist-slug">
          <span>ファイル名</span>
          <input value=${slug} onInput=${(e) => setSlug(e.target.value.toLowerCase().replace(/[^a-z0-9-]/g, "-").replace(/-{2,}/g, "-").slice(0, 40))} />
          <span>.pack.json</span>
          ${!slugOk && html`<span style=${{ color: "var(--danger)", fontSize: "12px" }}>半角の英数字とハイフンで入力してください</span>`}
        </div>
        ${url && html`<div className="dist-urlprev">生徒が開くURL: ${url}</div>`}
        <div className="dist-slug"><span>先生からのひとこと（任意・生徒のタイトル画面に出ます）</span></div>
        <input placeholder="例: 今日は2番まで。穴あきは全部あけてOK！" maxLength=${100}
          value=${(project.pub && project.pub.note) || ""} onInput=${(e) => setNote(e.target.value)} />
        ${phase === "error" && err && html`<div className="check-item bad"><span className="mark">✕</span>${err}</div>`}
        <div style=${{ display: "flex", gap: "10px", alignItems: "center", flexWrap: "wrap" }}>
          <button className="btn btn-primary" disabled=${phase === "building" || !man || !(man.audio && man.audio.ok) || !slugOk}
            onClick=${build}>${phase === "building" ? "📦 パックを組み立てています…" : "📦 曲パックを書き出す"}</button>
          <span className="dc-sub">同じ名前で書き出すと上書き＝曲の差し替えになります</span>
        </div>
        ${phase === "done" && result && html`
          <div className="export-progress" style=${{ borderColor: "rgba(61,220,151,.4)", alignItems: "stretch" }}>
            <div style=${{ fontSize: "14px", fontWeight: 700, color: "var(--success)" }}>✓ 曲パックを書き出しました　${result.fname}（${(result.size / 1048576).toFixed(1)} MB）</div>
            <div className="dc-sub">のこりの手順: ① ${result.fname} を<b>GitHub Desktopのリポジトリ</b>の「songs」フォルダに入れる（メニュー Repository → Show in Finder で開けます。Desktopのsingsync-siteは原本置き場＝入れてもPushされません）→ ② GitHub Desktopで Commit → Push → ③ 2〜3分待つと下のQRで開けます（Pushの前に読むと「曲が見つかりません」になります）</div>
            ${result.url ? html`
              <div className="qr-panel">
                <canvas ref=${qrRef} className="qr-canvas"></canvas>
                <div className="qr-side">
                  <div className="dist-urlprev" style=${{ userSelect: "all" }}>${result.url}</div>
                  <div style=${{ display: "flex", gap: "8px", flexWrap: "wrap" }}>
                    <button className="btn btn-secondary btn-sm" onClick=${copyUrl}>URLをコピー</button>
                    <button className="btn btn-secondary btn-sm" onClick=${savePng}>QRをPNG保存</button>
                    <button className="btn btn-secondary btn-sm" onClick=${printCard}>🖨 配布カードを印刷</button>
                  </div>
                  <div className="dc-sub">印刷はA4に大きめのQRが出ます（教室のうしろからでも読めます）</div>
                </div>
              </div>`
            : html`<div className="check-item warn"><span className="mark">⚠</span>配布先URLが未設定のため、QRコードを作れません（上の欄で設定してください）</div>`}
          </div>`}
      </div>`;
  }

  /* ---------- ⑤ 書き出し画面（フェーズ2で本実装） ---------- */
  function ExportScreen({ project, scrubRef, onToast, onCommit }) {
    const total = lyricLines(project).length;
    const synced = syncedLines(project).length;
    const shortLines = [];
    let num = 0;
    for (const l of project.lines) {
      if (l.type !== "lyric") continue;
      num++;
      if (l.tStart != null && l.tEnd - l.tStart < 1.0) shortLines.push({ n: num, dur: l.tEnd - l.tStart });
    }
    const jaEmpty = lyricLines(project).filter((l) => !l.ja.trim()).length;

    const [pre, setPre] = useState(null);       // null=確認中 / {ok, videoCodec, audioCodec, reason}
    const [quality, setQuality] = useState("normal");
    const [phase, setPhase] = useState("idle"); // idle | running | done | error
    const [prog, setProg] = useState(null);
    const [result, setResult] = useState(null);
    const [err, setErr] = useState(null);
    const taskRef = useRef(null);

    useEffect(() => {
      let alive = true;
      exportPreflight().then((p) => { if (alive) setPre(p); });
      return () => { alive = false; if (taskRef.current) taskRef.current.cancelled = true; };
    }, []);
    useEffect(() => { // 書き出し中のタブ閉じ・リロードをガード
      if (phase !== "running") return;
      const h = (e) => { e.preventDefault(); e.returnValue = ""; };
      window.addEventListener("beforeunload", h);
      return () => window.removeEventListener("beforeunload", h);
    }, [phase]);

    const fname = (((project.meta.title || "PV").replace(/[\\/:*?"<>|]/g, "").trim().replace(/\s+/g, "_")) || "PV") + "_PV.mp4";
    const dur = AE.duration || (project.audio && project.audio.duration) || 0;
    const estMB = dur ? (((EXPORT_QUALITIES[quality].vbr + EXPORT_ABR) / 8) * dur) / 1e6 : 0;
    const canStart = pre && pre.ok && AE.ready && synced > 0 && phase !== "running";

    const start = async () => {
      let fileHandle = null;
      if (window.showSaveFilePicker) {
        try {
          fileHandle = await window.showSaveFilePicker({
            suggestedName: fname,
            types: [{ description: "MP4動画", accept: { "video/mp4": [".mp4"] } }],
          });
        } catch (e) { return; } // 保存先の選択をキャンセル
      }
      const task = { cancelled: false };
      taskRef.current = task;
      setPhase("running"); setProg(null); setErr(null); setResult(null);
      let wakeLock = null;
      try { wakeLock = await navigator.wakeLock.request("screen"); } catch (e) {}
      try {
        const res = await exportMp4({ project, pre, quality, fileHandle, task, onProgress: setProg });
        res.saved = !!fileHandle;
        if (!fileHandle && res.blob) { // 保存ダイアログ非対応ブラウザ: 通常ダウンロードで保存
          res.dlUrl = URL.createObjectURL(res.blob);
          const a = document.createElement("a");
          a.href = res.dlUrl; a.download = fname; a.click();
        }
        setResult(res); setPhase("done");
        onToast && onToast("MP4を書き出しました 🎉");
      } catch (e) {
        if (e && e.message === EXPORT_CANCELLED) {
          setPhase("idle");
          onToast && onToast("書き出しを中止しました（ファイルは作られていません）");
        } else {
          console.error(e);
          setErr(String((e && e.message) || e)); setPhase("error");
        }
      } finally {
        try { wakeLock && wakeLock.release(); } catch (e) {}
        taskRef.current = null;
      }
    };

    const pct = prog ? Math.round(prog.pct * 100) : 0;
    return html`
      <div className="screen">
        <div className="export-wrap">
          <div className="h1" style=${{ textAlign: "center" }}>MP4動画に書き出しましょう</div>
          <div style=${{ display: "flex", gap: "20px", alignItems: "flex-start", flexWrap: "wrap" }}>
            <div style=${{ flex: "1 1 340px", minWidth: "300px" }}>
              <${Preview} project=${project} scrubRef=${scrubRef} />
            </div>
            <div style=${{ flex: "1 1 260px", display: "flex", flexDirection: "column", gap: "6px", fontSize: "13px" }}>
              <div className="side-title">書き出し設定</div>
              <div>解像度: <b>1920×1080</b>・<b>30fps</b>（固定）</div>
              <div>ファイル名: <b style=${{ wordBreak: "break-all" }}>${fname}</b></div>
              <div className="side-title" style=${{ marginTop: "10px" }}>画質</div>
              <div className="seg">
                ${Object.entries(EXPORT_QUALITIES).map(([k, q]) => html`
                  <button key=${k} className=${"seg-btn" + (quality === k ? " active" : "")}
                    disabled=${phase === "running"} onClick=${() => setQuality(k)}>${q.label}</button>`)}
              </div>
              <div className="sub" style=${{ fontSize: "12px" }}>推定ファイルサイズ: 約${estMB ? estMB.toFixed(0) : "--"} MB（曲の長さ ${fmtDur(dur)}）</div>
            </div>
          </div>
          <div className="checklist">
            ${pre == null && html`<div className="check-item"><span className="mark">⏳</span>お使いのブラウザの対応状況を確認しています…</div>`}
            ${pre && pre.ok && pre.audioCodec === "aac" && html`<div className="check-item ok">
              <span className="mark">✓</span>この環境でMP4書き出しができます（映像 H.264 / 音声 AAC）
            </div>`}
            ${pre && pre.ok && pre.audioCodec === "opus" && html`<div className="check-item warn">
              <span className="mark">⚠</span>書き出せますが、AACが使えないため音声はOpus形式になります。再生できないプレイヤーではVLC等をお使いください
            </div>`}
            ${pre && !pre.ok && html`<div className="check-item bad">
              <span className="mark">✕</span>MP4書き出しが使えません: ${pre.reason}
            </div>`}
            <div className=${"check-item " + (AE.ready ? "ok" : "bad")}>
              <span className="mark">${AE.ready ? "✓" : "✕"}</span>
              音声: ${project.audio ? project.audio.fileName + "（" + fmtDur(project.audio.duration || 0) + "）" : "未読み込み"}
            </div>
            <div className=${"check-item " + (total > 0 && synced === total ? "ok" : "warn")}>
              <span className="mark">${total > 0 && synced === total ? "✓" : "⚠"}</span>
              歌詞: ${total}行中 ${synced}行 同期済み${total > 0 && synced < total ? "（③同期タブで残りを同期できます）" : ""}
            </div>
            ${shortLines.slice(0, 3).map((s) => html`
              <div key=${s.n} className="check-item warn">
                <span className="mark">⚠</span>行${s.n}の表示が${s.dur.toFixed(1)}秒と短めです
              </div>`)}
            ${jaEmpty > 0 && html`<div className="check-item">
              <span className="mark">ℹ</span>和訳が空の行が${jaEmpty}行あります（英語のみで表示されます）
            </div>`}
            ${MediaLib.hasVideo(project) && html`<div className="check-item">
              <span className="mark">ℹ</span>背景に動画があるため、書き出しに少し時間がかかります
            </div>`}
            ${MediaLib.missing(project).slice(0, 2).map((b) => html`
              <div key=${b.id} className="check-item warn">
                <span className="mark">⚠</span>背景「${b.fileName}」が読み込まれていません（④デザインで再選択できます。このままだとプリセット背景で書き出されます）
              </div>`)}
          </div>

          ${phase === "running" && html`
            <div className="export-progress">
              <div className="progress-big"><div className="fill" style=${{ width: pct + "%" }}></div></div>
              <div style=${{ display: "flex", justifyContent: "space-between", width: "100%", fontSize: "13px", color: "var(--text-secondary)" }}>
                <span>🎬 書き出し中… ${prog ? `${prog.frame} / ${prog.totalFrames} フレーム（${pct}%）` : "準備中（音声をデコードしています）"}</span>
                <span>${prog && prog.eta != null ? "残り 約" + fmtDur(prog.eta) : ""}</span>
              </div>
              <div style=${{ display: "flex", gap: "12px", alignItems: "center" }}>
                <button className="btn btn-secondary" onClick=${() => { if (taskRef.current) taskRef.current.cancelled = true; }}>⏹ 中止する</button>
                <span className="sub" style=${{ fontSize: "12px" }}>このタブを開いたまましばらくお待ちください</span>
              </div>
            </div>`}

          ${phase === "done" && result && html`
            <div className="export-progress" style=${{ borderColor: "rgba(61,220,151,.4)" }}>
              <div style=${{ fontSize: "15px", fontWeight: 700, color: "var(--success)" }}>✓ 書き出し完了！</div>
              <div className="sub" style=${{ fontSize: "13px" }}>
                ${fmtDur(result.durationSec)} の動画 ・ ${(result.size / 1e6).toFixed(1)} MB ・ 所要 ${fmtDur(result.elapsed)}
                ${result.saved ? " ・ 選んだ場所に保存しました" : " ・ ダウンロードに保存しました"}
              </div>
              <div style=${{ display: "flex", gap: "10px" }}>
                <button className="btn btn-secondary" onClick=${start}>🎬 もう一度書き出す</button>
                ${result.dlUrl && html`<a className="btn btn-secondary" style=${{ textDecoration: "none" }} href=${result.dlUrl} download=${fname}>💾 保存し直す</a>`}
              </div>
            </div>`}

          ${phase !== "running" && phase !== "done" && html`
            <div style=${{ textAlign: "center", display: "flex", flexDirection: "column", gap: "10px", alignItems: "center" }}>
              ${phase === "error" && html`<div className="check-item bad" style=${{ alignSelf: "stretch" }}>
                <span className="mark">✕</span>書き出しに失敗しました: ${err}（もう一度お試しください）
              </div>`}
              <button className="btn btn-primary" disabled=${!canStart} onClick=${start}
                style=${{ height: "48px", padding: "0 32px", fontSize: "15px" }}>
                🎬 書き出しを開始する
              </button>
              <span className="sub" style=${{ fontSize: "12px" }}>目安時間は曲の長さの0.5〜2倍ほど。書き出し中はこのタブを閉じないでください</span>
            </div>`}

          <${DistribCard} project=${project} onCommit=${onCommit} onToast=${onToast} />
        </div>
      </div>`;
  }

  /* ---------- ホーム画面 ---------- */
  function HomeScreen({ recent, onNew, onOpenFile, onSample, onOpenRecent, onDeleteRecent }) {
    const fileRef = useRef(null);
    return html`
      <div className="screen-center">
        <div className="home-title"><span style=${{ color: "var(--accent)" }}>♪</span> SingSync</div>
        <div className="home-sub">Sunoの曲から、歌詞カラオケPVをつくろう</div>
        <div className="home-cards">
          <button className="home-card" onClick=${onNew}>
            <div className="ic">＋</div>
            <div className="t">新規プロジェクト</div>
            <div className="d">MP3/WAVから始める</div>
          </button>
          <button className="home-card" onClick=${() => fileRef.current.click()}>
            <div className="ic">📂</div>
            <div className="t">プロジェクトを開く</div>
            <div className="d">.lyricpv ファイル</div>
          </button>
          <button className="home-card" onClick=${onSample}>
            <div className="ic">✨</div>
            <div className="t">サンプルで試す</div>
            <div className="d">30秒でカラオケ表示を体験</div>
          </button>
        </div>
        ${recent && html`
          <div className="recent-card">
            <span style=${{ fontSize: "22px" }}>🎵</span>
            <div style=${{ flex: 1, minWidth: 0 }}>

  }

  /* ---------- 音源の再リンクモーダル ---------- */
  function RelinkModal({ audioMeta, onPicked, onSkip }) {
    const fileRef = useRef(null);
    const [warn, setWarn] = useState(null);
    const [busy, setBusy] = useState(false);
    const pendingFile = useRef(null);

    const check = async (file) => {
      setBusy(true); setWarn(null);
      try {
        const fp = await fingerprintFile(file);
        await AE.load(file);
        const dOk = Math.abs(AE.duration - (audioMeta.duration || 0)) < 0.5;
        const fpOk = !audioMeta.fingerprint || fp === audioMeta.fingerprint;
        if (dOk && fpOk) { onPicked(file, fp); }
        else {
          pendingFile.current = { file, fp };
          setWarn(dOk
            ? "ファイルの内容が保存時と異なるようです。"
            : `長さが異なります（${fmtDur(audioMeta.duration || 0)} ≠ ${fmtDur(AE.duration)}）。このまま使うと同期がずれる可能性があります。`);
        }
      } catch (e) {
        setWarn("読み込めませんでした。MP3かWAVのファイルを選んでください。");
      }
      setBusy(false);
    };

    return html`
      <div className="modal-backdrop">
        <div className="modal" style=${{ maxWidth: "480px" }}>
          <div className="modal-head"><span className="h2">曲のファイルをもう一度選んでください</span></div>
          <div className="modal-body" style=${{ display: "flex", flexDirection: "column", gap: "12px" }}>
            <div className="sub">プロジェクトには音声ファイル本体は含まれないため、再開時に選び直しが必要です。</div>
            <div className="panel" style=${{ padding: "12px 14px", fontSize: "13px" }}>
              🎵 前回のファイル: <b>${audioMeta.fileName}</b>
              ${audioMeta.duration ? html`<span className="sub tnum">（${fmtDur(audioMeta.duration)}）</span>` : ""}
            </div>
            ${warn && html`<div style=${{ color: "var(--warning)", fontSize: "13px" }}>⚠ ${warn}</div>`}
            ${busy && html`<div className="sub">読み込んでいます…</div>`}
          </div>
          <div className="modal-foot">
            <button className="btn btn-secondary" onClick=${onSkip}>あとで選ぶ</button>
            ${warn && pendingFile.current && html`
              <button className="btn btn-secondary" onClick=${() => { fileRef.current.click(); }}>選び直す</button>
              <button className="btn btn-primary" onClick=${() => onPicked(pendingFile.current.file, pendingFile.current.fp, true)}>このまま使う</button>`}
            ${!warn && html`<button className="btn btn-primary" disabled=${busy} onClick=${() => fileRef.current.click()}>ファイルを選択</button>`}
          </div>
          <input type="file" accept=".mp3,.wav,audio/*" ref=${fileRef} style=${{ display: "none" }}
            onChange=${(e) => { if (e.target.files.length) check(e.target.files[0]); e.target.value = ""; }} />
        </div>
      </div>`;
  }

              <b>Q. 開き直すたびにファイルを選ぶのが面倒</b><br/>→ 曲と背景はブラウザ内に自動でキャッシュされます。ホームの「前回の続き」から開けば、選び直しは不要です（.lyricpvファイルから開いた場合も、同じ曲なら自動で読み込まれます）。<br/>
              <b>Q. 作業を保存したい</b><br/>→ 2秒ごとに自動保存されています。別PCに持ち運ぶときはヘッダーの「保存」で .lyricpv ファイルを書き出せます。

  /* ============================================================
     ▦ 歌詞シート（授業モード内・タップで歌う教科書ページ）
     ・行タップ=その行の歌だけ再生（行末で自動停止）/ すばやく2回 or 🔁=くり返し
     ・単語タップ=TTSでふつうの発音を読み上げ（歌で聞き取れない語の確認用）
     ・再生中の行はPVと同じ単語タイミング（line.words）でカラオケワイプ
     ============================================================ */
  const SHEET_SIZES = [ // A− / 標準 / A+（教室後方からの判読目安）an=💡注釈（和訳の約0.78倍=主従を保つ）
    { en: 28, ja: 19, n: 18, min: 70, an: 15 },
    { en: 34, ja: 22, n: 20, min: 84, an: 17 },
    { en: 42, ja: 26, n: 24, min: 100, an: 20 },
  ];
  const JA_ORDER = ["none", "cur", "all"];
  const JA_MODE_LABELS = { none: "なし", cur: "今の行", all: "全部" };
  const SHEET_PREFS_KEY = "lyric-pv:sheetPrefs:v1";
  const loadSheetPrefs = () => { try { return JSON.parse(localStorage.getItem(SHEET_PREFS_KEY) || "{}") || {}; } catch (e) { return {}; } };

  /* 穴あきリスニング: おまかせ選定（内容語優先・行ごとに最低1穴＝偏り防止。
     乱数は生成クリック時の一度きりで、結果はプロジェクトに保存＝以後は決定的） */
  const MASK_STOPWORDS = new Set(("a an the and or but so if than then that this these those " +
    "i you he she it we they me him her us them my your his its our their mine yours " +
    "is am are was were be been being do does did have has had will would can could " +
    "should shall may might must not no nor as at by for from in into of off on onto " +
    "out over to up down with about there here when where who whom whose what which " +
    "oh ooh whoa yeah hey la na da mm hmm uh ah").split(" "));
  const maskCleanTok = (t) => t.replace(/[^A-Za-z'’-]/g, "").toLowerCase();
  const MASK_LEVELS = [["few", "すこし", 0.15], ["normal", "ふつう", 0.25], ["many", "たっぷり", 0.4]];
  function autoMask(np, ratio) {
    for (const l of np.lines) {
      if (l.type !== "lyric") continue;
      const toks = enTokens(l.en);
      const elig = toks.map((t, i) => ({ i, c: maskCleanTok(t) }))
        .filter((x) => x.c.length >= 2 && !MASK_STOPWORDS.has(x.c));
      if (!elig.length) { l.mask = []; continue; }
      const target = Math.max(1, Math.round(elig.length * ratio));
      // 長い語ほど隠れやすく（＋ジッタで毎回ちがう組み合わせに）
      elig.sort((a, b) => (b.c.length + Math.random() * 6) - (a.c.length + Math.random() * 6));
      l.mask = elig.slice(0, target).map((x) => x.i).sort((a, b) => a - b);
    }
  }

  /* ✎ ペン書き込み（フェーズ3）
     ・SVGインク: 1ストローク=1<path>。行ごとの<g>に載せる「行アンカー」方式で、
       和訳の挟み込み（jaMode=今の行）やスクロールで行が動いてもインクが単語から離れない
     ・保存しない（その場かぎり・板書と同じ）。onCommit不使用・undo/redo履歴にも触れない */
  const SVG_NS = "http://www.w3.org/2000/svg";
  const PEN_COLORS = { red: "#ff5d5d", yellow: "#ffd84d", cyan: "#4fc3f7" }; // 暗背景で映える3色
  const PEN_COLOR_ORDER = ["red", "yellow", "cyan"];
  const PEN_COLOR_LABELS = { red: "赤", yellow: "黄", cyan: "水色" };
  const PEN_TOOLS = [["pen", "✎ ペン"], ["hl", "🖍 マーカー"], ["eraser", "🧽 けしゴム"]];
  const HL_ALPHA = 0.38;           // マーカーの透け具合（下の文字が読める）
  const PEN_W = 4, HL_W = 22, ERASE_R = 16;

  function penPathD(p) { // 中点2次ベジェで滑らかに（p=[x0,y0,x1,y1,...]）
    if (p.length < 4) return "";
    let d = "M" + p[0] + " " + p[1];
    for (let i = 2; i < p.length - 2; i += 2)
      d += "Q" + p[i] + " " + p[i + 1] + " " + (p[i] + p[i + 2]) / 2 + " " + (p[i + 1] + p[i + 3]) / 2;
    d += "L" + p[p.length - 2] + " " + p[p.length - 1];
    return d;
  }
  function penBuildEl(s) {
    const el = document.createElementNS(SVG_NS, "path");
    el.setAttribute("fill", "none");
    el.setAttribute("stroke", PEN_COLORS[s.color] || PEN_COLORS.red);
    el.setAttribute("stroke-width", s.w);
    el.setAttribute("stroke-linecap", "round");
    el.setAttribute("stroke-linejoin", "round");
    if (s.tool === "hl") el.setAttribute("stroke-opacity", HL_ALPHA); // 1本のpathは自己交差しても濃くならない（SVG仕様）
    el.setAttribute("d", penPathD(s.pts));
    return el;
  }
  function penHitPts(p, x, y, thr) { // 点(x,y)が折れ線から距離thr以内か（けしゴムの当たり判定）
    const t2 = thr * thr;
    for (let i = 0; i + 3 < p.length; i += 2) {
      const ax = p[i], ay = p[i + 1], dx = p[i + 2] - ax, dy = p[i + 3] - ay;
      const len2 = dx * dx + dy * dy;
      let t = len2 ? ((x - ax) * dx + (y - ay) * dy) / len2 : 0;
      t = t < 0 ? 0 : t > 1 ? 1 : t;
      const ex = ax + t * dx - x, ey = ay + t * dy - y;
      if (ex * ex + ey * ey <= t2) return true;
    }
    return false;
  }

  /* インク層: SheetViewの100ms再レンダーをmemoで素通りし、SVGの中身はReactを介さず直接さわる。
     ストローク実体は親のinkRefに残るので、J(PV⇔シート)の往復では再マウント時に復元される */
  const InkLayer = React.memo(function InkLayer({ inkRef, penStRef, inkApiRef, onNotify }) {
    const svgRef = useRef(null);
    useEffect(() => {
      const svg = svgRef.current;
      const scroller = svg.parentElement;                // .present-sheet（スクロールコンテナ・inset:0で不動）
      const inner = scroller.querySelector(".sheet-inner");
      const ink = inkRef.current;
      ink.tops = {};                                     // 再マウント時は transform を張り直す
      const gmap = new Map();                            // lid -> <g>
      const gFor = (lid) => {
        let g = gmap.get(lid);
        if (!g) { g = document.createElementNS(SVG_NS, "g"); gmap.set(lid, g); svg.appendChild(g); }
        return g;
      };
      for (const s of ink.strokes) gFor(s.lid).appendChild(s.el); // 復元

      let lastH = -1;
      const sync = () => { // 行アンカー追従: 各<g>をいまの行位置へ（SheetViewの毎レンダー後に呼ばれる）
        const h = Math.max(inner.offsetHeight, scroller.clientHeight);
        if (h !== lastH) { lastH = h; svg.setAttribute("height", h); }
        if (!gmap.size) return;
        const sr = scroller.getBoundingClientRect();
        const rows = {};
        inner.querySelectorAll("[data-lid]").forEach((el) => { rows[el.dataset.lid] = el; });
        for (const [lid, g] of gmap) {
          const row = rows[lid];
          const top = row ? row.getBoundingClientRect().top - sr.top + scroller.scrollTop : 0;
          if (Math.abs((ink.tops[lid] != null ? ink.tops[lid] : -1e9) - top) > 0.5) {
            ink.tops[lid] = top;
            g.setAttribute("transform", "translate(0 " + top + ")");
          }
        }
      };

      let lastW = inner.clientWidth;
      const ro = new ResizeObserver(() => { // 幅が変わる=折返しが変わる → ずれた丸は誤情報なので消す
        if (Math.abs(inner.clientWidth - lastW) > 1) {
          lastW = inner.clientWidth;
          if (ink.strokes.length) { api.clearAll(false); onNotify("layout-cleared"); }
        }
        sync();
      });
      ro.observe(inner);

      /* --- ポインタ処理（1本ゆび=書く・2本ゆび=スクロール・ホイールは素通しで常にスクロール） --- */
      const ptrs = new Map(); // pointerId -> {y}
      let cur = null;         // 描画中 { s, rect, raf, dirty, pid }
      let erasing = null;     // けしゴム中 { op, rect, pid }
