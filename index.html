          let res;
          try { res = await fetch(PLAYER.url, { cache: "no-cache" }); } // no-cache=ETag再検証。曲を差し替えても古いキャッシュを見続けない
          catch (e) { const err = new Error("net"); err.kind = navigator.onLine === false ? "offline" : "notfound"; throw err; }
          if (!res.ok) {
            const err = new Error("http");
            err.kind = res.status === 404 ? "notfound" : "load";
            err.detail = PLAYER.url + " が見つかりません (" + res.status + ")";
            throw err;
          }
          const total = Number(res.headers.get("Content-Length")) || 0;
          const gz = !!res.headers.get("Content-Encoding"); // gzip配信ではtotal=圧縮後サイズで実受信とズレるため%は出さない
          let text;
          if (res.body && res.body.getReader) {
            const reader = res.body.getReader();
            const chunks = []; let received = 0;
            for (;;) {
              let r;
              try { r = await reader.read(); } catch (e) { const err = new Error("stream"); err.kind = "broken"; throw err; }
              if (r.done) break;
              chunks.push(r.value); received += r.value.length;
              if (alive) setPlayer((p) => (p && p.phase === "loading" ? { ...p, received, total: gz ? 0 : total } : p));
            }
            const all = new Uint8Array(received);
            let off = 0; for (const c of chunks) { all.set(c, off); off += c.length; }
            text = new TextDecoder().decode(all);
          } else text = await res.text();
          if (!alive) return;
          setPlayer({ phase: "preparing" });
          let up;
          try { up = unpackSongPack(JSON.parse(text)); }
          catch (e) { if (!e.kind) e.kind = "format"; throw e; }
          try { await AE.load(up.audioFile); }
          catch (e) { const err = new Error("audio"); err.kind = "format"; err.detail = "音声が再生できませんでした"; throw err; }
          MediaLib.clear();
          for (const bg of up.bgFiles) await MediaLib.add(bg.id, bg.file); // mediaDBは使わない（github.ioは全リポジトリでoriginを共有するため書き込まない）
          if (!alive) return;
          setProject(up.project);
          setAudioEpoch((n) => n + 1);
          try { document.title = "♪ " + up.title + " — SingSync"; } catch (e) {}
          setPlayer({ phase: "title", title: up.title, note: up.note, excluded: up.excludedCount });
        } catch (e) {
          if (!alive) return;
          console.error(e);
          setPlayer({ phase: "error", error: { kind: (e && e.kind) || "load", detail: (e && e.detail) || PLAYER.url } });
        }
      })();
      return () => { alive = false; };
    }, []);
    const startPlayer = () => { // 「はじめる」タップ=音声・TTS・全画面のユーザージェスチャをここで確実に満たす
      try { const u = new SpeechSynthesisUtterance(" "); u.volume = 0; speechSynthesis.speak(u); } catch (e) {}
      goFullscreen();
      setPresent(true);
    };

    /* ----- 起動時: 自動保存の読み込み（ホームのカード用） ----- */
    useEffect(() => {
      if (PLAYER) return; // 生徒プレイヤーは自動保存を読まない
      try {
        const raw = store.get(APP_KEY);
        if (raw) {
          const saved = JSON.parse(raw);
          if (saved && saved.project) setRecent(saved);
        }
      } catch (e) {}
    }, []);

    /* ----- コミット（編集の唯一の入口: undo・自動保存つき） ----- */
    const commit = useCallback((fn, opts = {}) => {
      setProject((prev) => {
        const np = structuredClone(prev);
        fn(np);
        np.meta.updatedAt = new Date().toISOString();
        // undo（連続入力は800msでまとめる）
        const now = Date.now();
        if (!(opts.coalesce && now - lastPush.current < 800)) {
          undoStack.current.push(JSON.stringify(prev));
          if (undoStack.current.length > 50) undoStack.current.shift();
          redoStack.current = [];
        }
        lastPush.current = now;
        scheduleAutosave(np);
        return np;
      });
    }, []);

    const scheduleAutosave = (p) => {
      if (PLAYER) return; // 生徒プレイヤーは何も保存しない（穴あき等の変更はその場かぎり）
      clearTimeout(saveTimer.current);
      saveTimer.current = setTimeout(() => {
        const payload = { project: p, screen: stateRef.current.screen, savedAt: new Date().toISOString() };
        store.set(APP_KEY, JSON.stringify(payload));
        setSaveStamp(new Date().toTimeString().slice(0, 5));
      }, 2000);
    };

    const undo = () => {
      if (!undoStack.current.length) return;
      redoStack.current.push(JSON.stringify(stateRef.current.project));
      const p = migrate(JSON.parse(undoStack.current.pop()));
      setProject(p); scheduleAutosave(p);
    };
    const redo = () => {
      if (!redoStack.current.length) return;
      undoStack.current.push(JSON.stringify(stateRef.current.project));
      const p = migrate(JSON.parse(redoStack.current.pop()));
      setProject(p); scheduleAutosave(p);
    };

    const showToast = (msg, actionLabel, actionFn) => {
      setToast({ msg, actionLabel, actionFn });
      clearTimeout(showToast._t);
      showToast._t = setTimeout(() => setToast(null), 4000);
    };

    /* ----- ループ ----- */
    const toggleLoop = (lineId) => {
      const s = stateRef.current;
      const target = lineId === undefined ? s.selId : lineId;
      if (target == null || s.loopId === target) {
        AE._loop.on = false; setLoopId(null); return;
      }
      const line = s.project.lines.find((l) => l.id === target);
      if (!line || line.tStart == null) return;
      AE._loop = { on: true, lineId: target, start: Math.max(0, line.tStart - 0.5), end: Math.min(AE.duration, line.tEnd + 0.5) };
      setLoopId(target); setSelId(target);
      AE.seek(AE._loop.start); AE.play();
    };

    /* ----- タイムラインからのコミット ----- */
    const commitLines = useCallback((lines) => {
      commit((np) => { np.lines = lines; });
      // ループ中の行を編集したらループ範囲も追従
      const s = stateRef.current;
      if (s.loopId) {
        const l = lines.find((x) => x.id === s.loopId);
        if (l && l.tStart != null) AE._loop = { on: true, lineId: l.id, start: Math.max(0, l.tStart - 0.5), end: Math.min(AE.duration, l.tEnd + 0.5) };
      }
    }, [commit]);

    /* ----- ナッジ（← →） ----- */
    const nudge = (ms) => {
      const s = stateRef.current;
      if (!s.selId) return;
      commit((np) => {
        const l = np.lines.find((x) => x.id === s.selId);
        if (!l || l.tStart == null) return;
        const dt = ms / 1000;
        if (s.selBoundary != null && l.words[s.selBoundary]) {
          const i = s.selBoundary;
          const nt = clamp(l.words[i].tStart + dt, l.words[i - 1].tStart + MIN_WORD_DUR, l.words[i].tEnd - MIN_WORD_DUR);
          l.words[i - 1].tEnd = nt; l.words[i].tStart = nt;
          l.wordsManual = true;
        } else {
          const nd = clamp(dt, -l.tStart, (AE.duration || l.tEnd) - l.tEnd);
          l.tStart += nd; l.tEnd += nd;
          l.words = l.words.map((w) => ({ text: w.text, tStart: w.tStart + nd, tEnd: w.tEnd + nd }));
        }
      }, { coalesce: true });
    };

    const selectNeighbor = (dir) => {
      const s = stateRef.current;
      const ls = lyricLines(s.project);
      if (!ls.length) return;
      const i = ls.findIndex((l) => l.id === s.selId);
      const ni = clamp(i === -1 ? 0 : i + dir, 0, ls.length - 1);
      setSelId(ls[ni].id); setSelBoundary(null);
      if (ls[ni].tStart != null) AE.seek(ls[ni].tStart);
    };

    /* ----- キーボードショートカット ----- */
    useEffect(() => {
      const onKey = (e) => {
        if (PLAYER) return; // 生徒プレイヤーに編集ショートカット（Cmd+S等）は無い
        const tag = e.target.tagName;
        if (tag === "INPUT" || tag === "TEXTAREA" || tag === "SELECT" || e.target.isContentEditable) return;
        const s = stateRef.current;
        if (s.tap) return; // タップ同期中は専用ハンドラ
        if (s.present) return; // 授業モード中は専用ハンドラ
        if (s.modal) { if (e.key === "Escape") setModal(null); return; }
        if (e.key === "?") { setModal({ type: "help" }); return; }
        const mod = e.metaKey || e.ctrlKey;
        if (mod && e.key.toLowerCase() === "z") { e.preventDefault(); e.shiftKey ? redo() : undo(); return; }
        if (mod && e.key.toLowerCase() === "s") { e.preventDefault(); exportProjectFile(); return; }
        if (s.screen === "sync" || s.screen === "design" || s.screen === "import") {
          if (e.code === "Space") {
            e.preventDefault();
            if (document.activeElement && document.activeElement.blur) document.activeElement.blur();
            AE.toggle(); return;
          }
        }
        if (s.screen !== "sync") return;
        if (e.key === "ArrowLeft") { e.preventDefault(); nudge(e.shiftKey ? -NUDGE_FINE_MS : -NUDGE_MS); }
        else if (e.key === "ArrowRight") { e.preventDefault(); nudge(e.shiftKey ? NUDGE_FINE_MS : NUDGE_MS); }
        else if (e.key === "ArrowUp") { e.preventDefault(); selectNeighbor(-1); }
        else if (e.key === "ArrowDown") { e.preventDefault(); selectNeighbor(1); }
        else if (e.key === "l" || e.key === "L") { toggleLoop(undefined); }
        else if (e.key === "s" || e.key === "S") { const r = AE.el.playbackRate; AE.setRate(r === 1 ? 0.5 : 1); }
        else if (e.key === "Enter") {
          const line = s.project.lines.find((x) => x.id === s.selId);
          if (line && line.tStart != null) { AE.seek(line.tStart); AE.play(); }
        }
        else if (e.key === "Escape") { AE._loop.on = false; setLoopId(null); }
      };
      window.addEventListener("keydown", onKey);
      return () => window.removeEventListener("keydown", onKey);
    }, []);

    /* ----- 音声ファイル読み込み ----- */
    const loadAudioFile = async (file) => {
      const ext = (file.name.split(".").pop() || "").toLowerCase();
      if (!["mp3", "wav"].includes(ext)) {
        setImportErr(`MP3またはWAVファイルを選んでください（選択されたのは .${ext} です）`);
        return;
      }
      setImportErr(null);
      setBusy("波形を解析しています…");
      try {
        await AE.load(file);
        const fp = await fingerprintFile(file);
        commit((np) => {
          np.audio = { fileName: file.name, size: file.size, duration: AE.duration, fingerprint: fp };
          if (!np.meta.title || np.meta.title === "新しいPV") {
            np.meta.title = file.name.replace(/\.[^.]+$/, "");
          }
        });
        setAudioEpoch((n) => n + 1);
        mediaDB.put("audio", file); // 次回から選び直し不要（ブラウザ内キャッシュ）
      } catch (e) {
        setImportErr("読み込めませんでした。別のMP3/WAVファイルで試してください。");
      }
      setBusy(null);
    };

    /* ----- 歌詞の貼り付け ----- */
    const applyPaste = (kind, text, tagMode) => {
      setModal(null);
      if (kind === "en") {
        const src = text.split("\n").map((s) => s.trim());
        const newLines = [];
        let lastGap = false;
        for (const raw of src) {
          if (!raw) { // 空行 → 間奏（連続はまとめる）
            if (newLines.length && !lastGap) { newLines.push(makeGap()); lastGap = true; }
            continue;
          }
          if (/^\[[^\]]+\]$/.test(raw)) { // セクションタグ
            if (tagMode === "remove") continue;
            if (tagMode === "convert") {
              if (newLines.length && !lastGap) { newLines.push(makeGap()); lastGap = true; }
              continue;
            }
          }
          newLines.push(makeLine(raw));
          lastGap = false;
        }
        commit((np) => { np.lines = newLines; });
        setSelId(null); setSelBoundary(null);
        showToast(`英語${newLines.filter((l) => l.type === "lyric").length}行を取り込みました。次は和訳、またはこのまま③同期へ`);
      } else {
        const jas = text.split("\n").map((s) => s.trim()).filter(Boolean);
        let count = 0, shortage = 0;
        commit((np) => {
          let i = 0;
          for (const l of np.lines) {
            if (l.type !== "lyric") continue;
            if (i < jas.length) { l.ja = jas[i]; count++; }
            else shortage++;
            i++;
          }
        });
        if (shortage > 0) showToast(`和訳${count}行を割り当てました（${shortage}行分足りないため空欄です。あとから個別に入力できます）`);
        else showToast(`和訳${count}行を割り当てました`);
      }
    };

    /* ----- タップ同期 ----- */
    const startTap = (startIndex) => {
      if (!AE.ready) { showToast("先に①取り込みで曲を読み込んでください"); return; }
      AE._loop.on = false; setLoopId(null);
      setTap({ startIndex });
    };
    const applyMarks = (marks, interrupted) => {
      setTap(null);
      if (!marks.length) { if (interrupted) showToast("タップ同期を中断しました"); return; }
      const totalLyr = lyricLines(stateRef.current.project).length;
      commit((np) => {
        for (const m of marks) {
          const l = np.lines.find((x) => x.id === m.lineId);
          if (l) { l.tStart = m.t; l.tEnd = null; l.wordsManual = false; }
        }
        computeLineEnds(np.lines, AE.duration);
        for (const l of np.lines) {
          if (l.type === "lyric" && l.tStart != null && l.tEnd != null && !l.wordsManual) autoAssignWords(l);
        }
      });
      const first = marks[0];
      setSelId(first.lineId); setSelBoundary(null);
      AE.pause(); AE.seek(Math.max(0, first.t - 1));
      showToast(interrupted
        ? `ここまでの${marks.length}行を同期しました（続きは行の🎤から再開できます）`
        : marks.length >= totalLyr
          ? `🎉 全${marks.length}行の同期が完了しました！気になる行だけ波形で微調整できます`
          : `曲が終わったため、ここまでの${marks.length}行を保存しました（続きは行の🎤から再開できます）`);
    };

    /* ----- 行の開始時刻を直接編集（行ごと平行移動） ----- */
    const moveLineStart = (lineId, newStart) => {
      commit((np) => {
        const l = np.lines.find((x) => x.id === lineId);
        if (!l || l.tStart == null) return;
        const nd = clamp(newStart, 0, AE.duration || newStart) - l.tStart;
        l.tStart += nd; l.tEnd += nd;
        l.words = l.words.map((w) => ({ text: w.text, tStart: w.tStart + nd, tEnd: w.tEnd + nd }));
      });
    };

    /* ----- プロジェクトの保存・読み込み ----- */
    const exportProjectFile = () => {
      const s = stateRef.current;
      const blob = new Blob([JSON.stringify(s.project, null, 1)], { type: "application/json" });
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = (s.project.meta.title || "project").replace(/[\\/:*?"<>|]/g, "_") + ".lyricpv";
      a.click();
      setTimeout(() => URL.revokeObjectURL(a.href), 5000);
      showToast("プロジェクトファイル（.lyricpv）を保存しました");
    };

    const openProject = async (p) => {
      undoStack.current = []; redoStack.current = [];
      setSelId(null); setSelBoundary(null); setLoopId(null); AE._loop.on = false;
      MediaLib.clear();
      setProject(p);
      scheduleAutosave(p);
      // 背景素材をブラウザ内キャッシュ（IndexedDB）から復元
      const restoreBgs = async () => {
        for (const b of (p.backgrounds || [])) {
          const f = await mediaDB.get("bg:" + b.id);
          if (f) await MediaLib.add(b.id, f);
        }
        setAudioEpoch((n) => n + 1); // 読み込め次第プレビュー等を更新
      };
      if (p.audio && p.audio.sample) {
        setBusy("サンプル曲を準備しています…");
        try {
          const f = await generateSampleAudio();
          await AE.load(f);
          setAudioEpoch((n) => n + 1);
          setScreen("sync");
        } catch (e) { setScreen("import"); }
        setBusy(null);
        restoreBgs();
      } else if (p.audio) {
        // まずキャッシュの音源を試す（fingerprint照合）→ 一致すれば選び直し不要
        setBusy("前回のファイルを読み込んでいます…");
        let ok = false;
        try {
          const f = await mediaDB.get("audio");
          if (f) {
            const fp = await fingerprintFile(f);
            if (!p.audio.fingerprint || fp === p.audio.fingerprint) {
              await AE.load(f);
              ok = !p.audio.duration || Math.abs(AE.duration - p.audio.duration) < 0.5;
            }
          }
        } catch (e) { ok = false; }
        setBusy(null);
        setAudioEpoch((n) => n + 1);
        setScreen("sync");
        if (ok) showToast("前回の曲を自動で読み込みました。すぐ続きから作業できます");
        else setModal({ type: "relink", audioMeta: p.audio });
        restoreBgs();
      } else {
        setScreen("import");
      }
      // このプロジェクトに関係ないキャッシュを掃除
      mediaDB.prune(["audio", ...(p.backgrounds || []).map((b) => "bg:" + b.id)]);
    };

    const openProjectFile = async (file) => {
      try {
        const json = JSON.parse(await file.text());
        await openProject(migrate(json));
      } catch (e) {
        showToast("読み込めませんでした。.lyricpv ファイルを選んでください");
      }
    };

    const openSample = async () => {
      setBusy("サンプル曲を作成しています…");
      try {
        MediaLib.clear(); mediaDB.prune([]);
        const f = await generateSampleAudio();
        await AE.load(f);
        setAudioEpoch((n) => n + 1);
        const p = buildSampleProject();
        undoStack.current = []; redoStack.current = [];
        setProject(p); scheduleAutosave(p);
        setSelId(lyricLines(p)[0].id);
        setScreen("sync");
        showToast("サンプルを開きました。▶再生でカラオケ表示を、波形で微調整を試せます");
      } catch (e) {
        showToast("サンプルの作成に失敗しました");
      }
      setBusy(null);
    };

    const newProj = () => {
      undoStack.current = []; redoStack.current = [];
      AE._loop.on = false; setLoopId(null);
      MediaLib.clear(); mediaDB.prune([]);
      setProject(newProject()); setSelId(null); setSelBoundary(null);
      setScreen("import"); setImportErr(null);
    };

    /* ----- タブの有効/完了状態 ----- */
    const tabState = (id) => {
      const hasAudio = !!project.audio;
      const hasLyrics = lyricLines(project).length > 0;
      const synced = syncedLines(project).length;
      const total = lyricLines(project).length;
      switch (id) {
        case "import": return { enabled: true, status: hasAudio ? "done" : null };
        case "lyrics": return { enabled: hasAudio, status: hasLyrics ? "done" : null };
        case "sync": return { enabled: hasLyrics, status: total > 0 && synced === total ? "done" : synced > 0 ? "working" : null };
        case "design": return { enabled: true, status: null };
        case "export": return { enabled: synced > 0, status: null };
      }
    };
    const nextOf = { import: "lyrics", lyrics: "sync", sync: "design", design: "export" };
    const nextLabelOf = { import: "歌詞", lyrics: "同期", sync: "デザイン", design: "書き出し" };

    const isChrome = /Chrome\//.test(navigator.userAgent);

    /* ----- 🎬 授業モード ----- */
    const canPresent = AE.ready && syncedLines(project).length > 0;
    const enterPresent = () => {
      // クリック操作の中で呼ぶ（全画面はユーザー操作直下でしか許可されないため）
      setPresent(true);
      try { document.documentElement.requestFullscreen().catch(() => {}); } catch (e) {}
    };
    const exitPresent = () => {
      setPresent(false);
      AE._loop.on = false; setLoopId(null); // 授業モード中のループを編集側に持ち越さない
    };

    /* ----- 📲 生徒プレイヤー: 編集UIはマウントしない（「隠す」ではなく存在しない） ----- */
    if (PLAYER) {
      return html`
        <div className="app-shell">
          ${!present && html`<${PlayerBoot} st=${player || { phase: "loading", received: 0, total: 0 }} onStart=${startPlayer} />`}
          ${present && html`<${PresentOverlay} project=${project} student=${true} studentTitle=${player && player.title}
            onExit=${() => { AE.pause(); setPresent(false); }} onCommit=${commit} />`}
          ${toast && html`
            <div className="toast-wrap"><div className="toast"><span>${toast.msg}</span></div></div>`}
        </div>`;
    }

    /* ----- 画面 ----- */
    return html`
      <div className="app-shell">
        ${screen !== "home" && html`
          <div className="app-header">
            <div className="app-logo" onClick=${() => setScreen("home")} title="ホームへ戻る">
              <span className="note">♪</span> SingSync
            </div>
            <span className="proj-name" title="①取り込みでタイトルを変更できます">${project.meta.title}</span>
            <div className="step-tabs">
              ${STEPS.map((st) => {
                const ts = tabState(st.id);
                return html`
                  <button key=${st.id} disabled=${!ts.enabled}
                    className=${"step-tab" + (screen === st.id ? " active" : "") + (ts.status ? " " + ts.status : "")}
                    onClick=${() => setScreen(st.id)}>
                    <span className="step-num">${ts.status === "done" ? "✓" : ts.status === "working" ? "●" : st.n}</span>
                    ${st.label}
                  </button>`;
              })}
            </div>
            <div className="header-right">
              <span className=${"save-status" + (store.ok() ? " ok" : " warn")}>
                ${store.ok() ? (saveStamp ? `✓ 保存済み ${saveStamp}` : "自動保存 ON") : "⚠ 自動保存が無効（保存ボタンをご利用ください）"}
              </span>
              <button className="btn btn-primary btn-sm" disabled=${!canPresent}
                title=${canPresent
                  ? "書き出さずに、このままフルスクリーンで授業に使えます（数字+Enterで行ジャンプ）"
                  : "①曲の読み込みと③同期を済ませると使えます"}
                onClick=${enterPresent}>🎬 授業モード</button>
              <button className="btn btn-secondary btn-sm" onClick=${exportProjectFile}>保存</button>
              <button className="btn-icon" title="ヘルプ（?）" onClick=${() => setModal({ type: "help" })}>?</button>
            </div>
          </div>`}
        ${!isChrome && screen !== "home" && html`
          <div className="banner">⚠ Chromeでの利用をおすすめします（MP4書き出しに必要な機能のため）</div>`}

        ${screen === "home" && html`<${HomeScreen} recent=${recent}
          onNew=${newProj}
          onOpenFile=${openProjectFile}
          onSample=${openSample}
          onOpenRecent=${() => { setRecent(null); openProject(migrate(recent.project)); }}
          onDeleteRecent=${() => setModal({ type: "confirmDeleteRecent" })} />`}
        ${screen === "import" && html`<${ImportScreen} project=${project} audioEpoch=${audioEpoch}
          onLoadFile=${loadAudioFile} onCommit=${commit} busy=${busy} error=${importErr} />`}
        ${screen === "lyrics" && html`<${LyricsScreen} project=${project} onCommit=${commit}
          onPaste=${(kind) => setModal({ type: "paste", kind })}
          onToast=${(msg, al) => showToast(msg, al, al ? undo : null)} />`}
        ${screen === "sync" && html`<${SyncScreen} project=${project} selId=${selId} selBoundary=${selBoundary}
          loopId=${loopId} scrubRef=${scrubRef} followRef=${followRef} onCommit=${commit}
          onSelect=${(id) => { setSelId(id); }} onSelectBoundary=${setSelBoundary}
          onCommitLines=${commitLines} onLoop=${toggleLoop}
          onTapStart=${startTap} onTapFrom=${startTap} onMoveLineStart=${moveLineStart} />`}
        ${screen === "design" && html`<${DesignScreen} project=${project} onCommit=${commit} scrubRef=${scrubRef}
          onToast=${(msg, al) => showToast(msg, al, al ? undo : null)} />`}
        ${screen === "export" && html`<${ExportScreen} project=${project} scrubRef=${scrubRef} onToast=${showToast} onCommit=${commit} />`}

        ${screen !== "home" && html`
          <div className="app-footer">
            <span className="footer-hint">ヒント: ${HINTS[screen] || ""}</span>
            <div className="footer-next">
              ${nextOf[screen] && html`
                <button className="btn btn-primary" disabled=${!tabState(nextOf[screen]).enabled}
                  onClick=${() => setScreen(nextOf[screen])}>次へ: ${nextLabelOf[screen]} →</button>`}
            </div>
          </div>`}

        ${tap && html`<${TapOverlay} project=${project} startIndex=${tap.startIndex}
          onDone=${(marks) => applyMarks(marks, false)} onCancel=${(marks) => applyMarks(marks, true)} />`}
        ${present && html`<${PresentOverlay} project=${project} onExit=${exitPresent} onCommit=${commit} />`}
        ${modal && modal.type === "help" && html`<${HelpModal} onClose=${() => setModal(null)} />`}
        ${modal && modal.type === "paste" && html`<${PasteModal} kind=${modal.kind}
          hasExisting=${project.lines.length > 0}
          onApply=${(text, tagMode) => applyPaste(modal.kind, text, tagMode)}
          onClose=${() => setModal(null)} />`}
        ${modal && modal.type === "relink" && html`<${RelinkModal} audioMeta=${modal.audioMeta}
          onPicked=${(file, fp, force) => {
            setModal(null); setAudioEpoch((n) => n + 1);
            commit((np) => { if (np.audio) { np.audio.fileName = file.name; np.audio.size = file.size; np.audio.duration = AE.duration; np.audio.fingerprint = fp; } }, {});
            mediaDB.put("audio", file); // 次回から選び直し不要
            showToast(force ? "このファイルで続行します（同期のずれにご注意ください）" : "曲を読み込みました。前回の続きから作業できます");
          }}
          onSkip=${() => { setModal(null); showToast("①取り込みで、あとから曲を選べます"); }} />`}
        ${modal && modal.type === "confirmDeleteRecent" && html`
          <div className="modal-backdrop">
            <div className="modal" style=${{ maxWidth: "420px" }}>
              <div className="modal-head"><span className="h2">前回のプロジェクトを削除しますか？</span></div>
              <div className="modal-body sub">この操作は元に戻せません。大切な場合は先に「開く」→「保存」で .lyricpv ファイルに書き出してください。</div>
              <div className="modal-foot">
                <button className="btn btn-secondary" onClick=${() => setModal(null)}>やめる</button>
                <button className="btn btn-danger" onClick=${() => { store.del(APP_KEY); setRecent(null); setModal(null); }}>削除する</button>
              </div>
            </div>
          </div>`}
        ${busy && screen === "home" && html`
          <div className="modal-backdrop"><div className="modal" style=${{ maxWidth: "320px", padding: "24px", textAlign: "center" }}>${busy}</div></div>`}
        ${toast && html`
          <div className="toast-wrap"><div className="toast">
            <span>${toast.msg}</span>
            ${toast.actionLabel && html`<button className="action" onClick=${() => { toast.actionFn && toast.actionFn(); setToast(null); }}>${toast.actionLabel}</button>`}
          </div></div>`}
      </div>`;
  }

  // 開発・サポート用の内部フック（アプリの動作には不使用）
  window.__lyricPvDebug = { AE, MediaLib, bgSegments, renderFrame, PRESETS, buildSongPack, unpackSongPack, packManifest, slugify, drawQr, PLAYER };

  ReactDOM.createRoot(document.getElementById("root")).render(html`<${App} />`);
})();
</script>
</body>
</html>
