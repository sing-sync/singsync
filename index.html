      if (!starts || starts.length < 2) { // 時間モード（区切りが無いときのフォールバックも兼ねる）
        let nSlots = Math.max(1, Math.round(total / interval));
        nSlots = Math.max(nSlots, pool.length); // 全素材が最低1回は登場するよう保証
        starts = [];
        for (let i = 0; i < nSlots; i++) starts.push((total * i) / nSlots);
      }
      const segs = starts.map((s, i) => ({ start: s, bg: pool[i % pool.length] }));
      segs.forEach((s, i) => { s.end = i + 1 < segs.length ? segs[i + 1].start : Math.max(total, s.start + 1); });
      return segs;
    }
    const segs = [];
    for (const b of (project.backgrounds || [])) {
      let start = 0;
      if (b.fromLineId) {
        const line = project.lines.find((l) => l.id === b.fromLineId);
        if (!line || line.tStart == null) continue;
        start = line.tStart;
      }
      segs.push({ start, bg: b });
    }
    segs.sort((a, b) => a.start - b.start);
    segs.forEach((s, i) => { s.end = i + 1 < segs.length ? segs[i + 1].start : Math.max(dur, s.start + 1); });
    return segs;
  }

  /* ============================================================
     [4] オーディオエンジン（シングルトン）
     ============================================================ */
  const AE = {
    el: new Audio(),
    url: null, duration: 0, sampleRate: 44100,
    peaks: null,          // { levels: [{spb, min:Float32Array, max:Float32Array, n}], sr }
    ready: false,
    async load(file) {
      this.ready = false;
      if (this.url) { URL.revokeObjectURL(this.url); this.url = null; }
      const buf = await file.arrayBuffer();
      const actx = new (window.AudioContext || window.webkitAudioContext)();
      const audioBuf = await actx.decodeAudioData(buf.slice(0));
      actx.close();
      this.duration = audioBuf.duration;
      this.sampleRate = audioBuf.sampleRate;
      // モノラルmixdown → ピークmipmap（フルPCMは以後保持しない）
      this.peaks = await computePeaks(audioBuf);
      this.url = URL.createObjectURL(file);
      this.el.src = this.url;
      this.el.preload = "auto";
      try { this.el.preservesPitch = true; } catch (e) {}
      this.ready = true;
      return { duration: this.duration };
    },
    t() { return this.el.currentTime || 0; },
    seek(t) { this.el.currentTime = clamp(t, 0, this.duration || 0); },
    play() { return this.el.play().catch(() => {}); },
    pause() { this.el.pause(); },
    toggle() { this.el.paused ? this.play() : this.pause(); },
    get playing() { return !this.el.paused && !this.el.ended; },
    setRate(r) { this.el.playbackRate = r; try { this.el.preservesPitch = true; } catch (e) {} },
  };

  async function computePeaks(audioBuf) {
    const n = audioBuf.length, chs = audioBuf.numberOfChannels;
    const mono = new Float32Array(n);
    for (let c = 0; c < chs; c++) {
      const d = audioBuf.getChannelData(c);
      for (let i = 0; i < n; i++) mono[i] += d[i] / chs;
    }
    // 基底: 512サンプル/バケット。上位: 2048/8192/32768
    const spbs = [512, 2048, 8192, 32768];
    const levels = [];
    // 基底レベル（チャンク処理でUIを固めない）
    const base = { spb: 512, n: Math.ceil(n / 512) };
    base.min = new Float32Array(base.n); base.max = new Float32Array(base.n);
    const CHUNK = 44100 * 10; // 10秒分ずつ
    for (let start = 0; start < n; start += CHUNK) {
      const end = Math.min(n, start + CHUNK);
      for (let i = start; i < end; i++) {
        const b = (i / 512) | 0, v = mono[i];
        if (i % 512 === 0) { base.min[b] = v; base.max[b] = v; }
        else { if (v < base.min[b]) base.min[b] = v; if (v > base.max[b]) base.max[b] = v; }
      }
      await new Promise((r) => setTimeout(r, 0));
    }
    levels.push(base);
    // 上位レベルは下位から集約
    for (let li = 1; li < spbs.length; li++) {
      const prev = levels[li - 1], factor = spbs[li] / spbs[li - 1];
      const lv = { spb: spbs[li], n: Math.ceil(prev.n / factor) };
      lv.min = new Float32Array(lv.n); lv.max = new Float32Array(lv.n);
      for (let b = 0; b < prev.n; b++) {
        const t = (b / factor) | 0;
        if (b % factor === 0) { lv.min[t] = prev.min[b]; lv.max[t] = prev.max[b]; }
        else { if (prev.min[b] < lv.min[t]) lv.min[t] = prev.min[b]; if (prev.max[b] > lv.max[t]) lv.max[t] = prev.max[b]; }
      }
      levels.push(lv);
    }
    return { levels, sr: audioBuf.sampleRate };
  }

  // 波形描画（timeline / サムネイル共用）: t0〜t1 を x0〜x1 に描く
  function drawWave(ctx, peaks, t0, t1, x0, y, w, h, color) {
    if (!peaks || w <= 0) return;
    const sr = peaks.sr, dur = t1 - t0;
    const spp = (dur * sr) / w; // samples per pixel
    let lv = peaks.levels[0];
    for (const l of peaks.levels) { if (l.spb <= spp) lv = l; else break; }
    ctx.fillStyle = color;
    const mid = y + h / 2;
    for (let px = 0; px < w; px++) {
      const s0 = ((t0 + (px / w) * dur) * sr / lv.spb) | 0;
      const s1 = Math.max(s0 + 1, ((t0 + ((px + 1) / w) * dur) * sr / lv.spb) | 0);
      let mn = 1, mx = -1;
      for (let b = s0; b < s1 && b < lv.n; b++) {
        if (b < 0) continue;
        if (lv.min[b] < mn) mn = lv.min[b];
        if (lv.max[b] > mx) mx = lv.max[b];
      }
      if (mx < mn) continue;
      const yTop = mid - mx * (h / 2) * 0.95;
      const yBot = mid - mn * (h / 2) * 0.95;
      ctx.fillRect(x0 + px, yTop, 1, Math.max(1, yBot - yTop));
    }
  }

  /* ============================================================
     [7] 同期エンジン（音節推定・単語自動割り付け）
     ============================================================ */
  function syllables(word) {
    let w = word.toLowerCase().replace(/[^a-z\-]/g, "");
    if (!w) return 1;
    if (w.includes("-")) return w.split("-").reduce((a, p) => a + syllables(p), 0);
    const groups = (w.match(/[aeiouy]+/g) || []).length;
    let n = groups;
    if (w.length > 2 && w.endsWith("e") && !w.endsWith("le")) n -= 1; // silent e
    return Math.max(1, n);
  }

  // 行内の単語タイミングを自動割り付け（隙間なし連続が不変条件）
  function autoAssignWords(line) {
    if (line.type !== "lyric" || line.tStart == null || line.tEnd == null) { line.words = []; return; }
    const tokens = enTokens(line.en);
    if (!tokens.length) { line.words = []; return; }
    const avgLen = tokens.reduce((a, t) => a + t.length, 0) / tokens.length;
    const weights = tokens.map((t, i) => {
      let w = syllables(t) + 0.3 * (t.length / avgLen);
      // カンマ・ピリオド等の後にはわずかな間（＝直前の単語を+15%）
      if (/[,.;:!?…]$/.test(t)) w *= 1.15;
      return w;
    });
    const total = weights.reduce((a, b) => a + b, 0);
    // 行末ブレス: 次と接していなければ最後の単語の終端を120ms手前に
    let end = line.tEnd;
    const span = end - line.tStart;
    if (span > 1.0) end -= 0.12;
    const usable = end - line.tStart;
    let t = line.tStart;
    line.words = tokens.map((text, i) => {
      const dur = (weights[i] / total) * usable;
      const w = { text, tStart: t, tEnd: i === tokens.length - 1 ? end : t + dur };
      t += dur;
      return w;
    });
    line.wordsManual = false;
  }

  // 行の開始/終了変更時: 既存の単語割合を保って伸縮
  function rescaleWords(line, newStart, newEnd) {
    const oldStart = line.tStart, oldEnd = line.tEnd;
    const oldSpan = oldEnd - oldStart, newSpan = newEnd - newStart;
    if (line.words.length && oldSpan > 0.001) {
      line.words = line.words.map((w) => ({
        text: w.text,
        tStart: newStart + ((w.tStart - oldStart) / oldSpan) * newSpan,
        tEnd: newStart + ((w.tEnd - oldStart) / oldSpan) * newSpan,
      }));
    }
    line.tStart = newStart; line.tEnd = newEnd;
    if (!line.words.length) autoAssignWords(line);
  }

  // タップ同期後: 各行の終了時刻を決める（次行開始-0.3秒 / 最終行は音節数から推定）
  function computeLineEnds(lines, duration) {
    const ls = lines.filter((l) => l.type === "lyric" && l.tStart != null);
    for (let i = 0; i < ls.length; i++) {
      const cur = ls[i], next = ls[i + 1];
      let end;
      if (next && next.tStart > cur.tStart + MIN_LINE_DUR) {
        end = Math.max(cur.tStart + MIN_LINE_DUR, next.tStart - LINE_GAP_END);
      } else {
        const sylCount = enTokens(cur.en).reduce((a, w) => a + syllables(w), 0);
        end = cur.tStart + clamp(sylCount * 0.35, 1.2, 8);
      }
      cur.tEnd = Math.min(end, duration || end);
      if (cur.tEnd <= cur.tStart) cur.tEnd = cur.tStart + MIN_LINE_DUR;
    }
  }

  /* ============================================================
     [5] レンダラ core — renderFrame(ctx, t, project)
     プレビューと書き出し（フェーズ2）が共有する純関数。
     ============================================================ */
  const layoutCache = new Map();
  let layoutEpoch = 0; // フォント読込完了などでキャッシュ一括無効化
  const measureCtx = document.createElement("canvas").getContext("2d");

  if (document.fonts && document.fonts.ready) {
    ["800 100px Montserrat", '500 100px "Noto Sans JP"', '700 100px "Noto Sans JP"', '900 100px "Noto Sans JP"',
     '600 100px "Playfair Display"', '400 100px "Noto Serif JP"', "700 100px Inter", "700 100px Poppins",
     '500 100px "M PLUS 1p"', '400 100px "Archivo Black"', "500 100px Lora", '500 100px "Zen Maru Gothic"']
      .forEach((f) => { try { document.fonts.load(f, "AWMjg あ歌"); } catch (e) {} });
    document.fonts.ready.then(() => { layoutEpoch++; layoutCache.clear(); });
  }

  // 行レイアウト（行×スタイルでキャッシュ）: 「/」で段に分割し、
  // いちばん長い段に合わせてフォントを自動縮小＋単語のx範囲と所属段を持つ
  function layoutLine(line, preset, fontScale) {
    const key = layoutEpoch + "|" + line.id + "|" + line.en + "|" + fontScale + "|" + preset.id;
    const hit = layoutCache.get(key);
    if (hit) return hit;
    const segs = enSegments(line.en);
    let size = preset.enSize * fontScale;
    if (segs.length > 1) size *= 0.92; // 複数段のときは少しだけ控えめに
    measureCtx.font = preset.enFont(size);
    let maxW = segs.length ? Math.max(...segs.map((s) => measureCtx.measureText(s).width)) : 0;
    if (maxW > MAX_TEXT_W) {
      size = Math.max(size * (MAX_TEXT_W / maxW), size * 0.6); // 最小60%
      measureCtx.font = preset.enFont(size);
      maxW = Math.max(...segs.map((s) => measureCtx.measureText(s).width));
    }
    const spaceW = measureCtx.measureText(" ").width;
    const rows = [];
    const words = [];
    segs.forEach((seg, r) => {
      const tokens = seg.split(/\s+/).filter(Boolean);
      const width = measureCtx.measureText(seg).width;
      const left = CANVAS_W / 2 - width / 2;
      let x = left;
      const start = words.length;
      tokens.forEach((text, i) => {
        const w = measureCtx.measureText(text).width;
        words.push({ text, x, w: i === tokens.length - 1 ? w : w + spaceW, row: r }); // 箱は後続スペースを含む
        x += w + spaceW;
      });
      rows.push({ text: seg, left, width, start, end: words.length });
    });
    if (!rows.length) rows.push({ text: "", left: CANVAS_W / 2, width: 0, start: 0, end: 0 });
    const lay = { size, rows, words, rowH: size * 1.22, width: maxW, tooLong: maxW > MAX_TEXT_W };
    layoutCache.set(key, lay);
    if (layoutCache.size > 400) layoutCache.delete(layoutCache.keys().next().value);
    return lay;
  }

  // t時点のワイプ進捗: done=歌い終わった単語数 / active=歌唱中の単語index / frac=その進捗率
  // （単語は隙間なし連続なので t について単調・連続）
  function wipeProgress(line, t) {
    const n = line.words.length;
    if (!n || t < line.tStart) return { done: 0, active: -1, frac: 0 };
    const last = line.words[n - 1];
    if (t >= last.tEnd) return { done: n, active: -1, frac: 0 };
    for (let i = 0; i < n; i++) {
      const w = line.words[i];
      if (t < w.tEnd) return { done: i, active: i, frac: clamp((t - w.tStart) / Math.max(0.001, w.tEnd - w.tStart), 0, 1) };
    }
    return { done: n, active: -1, frac: 0 };
  }

  // フィルムグレイン用のノイズパターン（シード付き乱数＝毎回同じ絵になり、プレビュー＝書き出しが保たれる）
  let grainCanvas = null;
  function getGrainCanvas() {
    if (grainCanvas) return grainCanvas;
    const c = document.createElement("canvas");
    c.width = 256; c.height = 256;
    const g = c.getContext("2d");
    const img = g.createImageData(256, 256);
    let seed = 123456789;
    for (let i = 0; i < img.data.length; i += 4) {
      seed = (seed * 1664525 + 1013904223) >>> 0;
      const v = 128 + ((seed / 4294967296) - 0.5) * 220;
      img.data[i] = img.data[i + 1] = img.data[i + 2] = v;
      img.data[i + 3] = 255;
    }
    g.putImageData(img, 0, 0);
    return (grainCanvas = c);
  }
  function drawGrain(ctx, alpha, t) {
    const f = Math.floor(t * 30); // フレーム番号でオフセット（決定論的にチラつく）
    const ox = (f * 53) % 256, oy = (f * 97) % 256;
    ctx.save();
    ctx.globalAlpha = alpha;
    ctx.globalCompositeOperation = "overlay";
    const pat = ctx.createPattern(getGrainCanvas(), "repeat");
    ctx.translate(-ox, -oy);
    ctx.fillStyle = pat;
    ctx.fillRect(0, 0, CANVAS_W + 256, CANVAS_H + 256);
    ctx.restore();
  }

  // 画像/動画を16:9キャンバスにカバーフィット（中央基準、縦位置3段階、Ken Burnsズーム）
  function drawMediaCover(ctx, el, natW, natH, zoom, posY, filter, alpha) {
    if (!natW || !natH) return;
    const scale = Math.max(CANVAS_W / natW, CANVAS_H / natH) * (zoom || 1);
    const dw = natW * scale, dh = natH * scale;
    const dx = (CANVAS_W - dw) / 2;
    let dy = (CANVAS_H - dh) / 2;
    if (posY === "top") dy = 0;
    else if (posY === "bottom") dy = CANVAS_H - dh;
    ctx.save();
    if (alpha != null) ctx.globalAlpha = alpha;
    if (filter) ctx.filter = filter;
    try { ctx.drawImage(el, dx, dy, dw, dh); } catch (e) {}
    ctx.restore();
  }

  function drawBackground(ctx, t, project, preset, ov) {
    const bg = preset.bg;
    const drawGradient = (alpha) => {
      ctx.save();
      if (alpha != null) ctx.globalAlpha = alpha;
      const g = ctx.createLinearGradient(0, 0, CANVAS_W, CANVAS_H);
      bg.grad.forEach(([c, p]) => g.addColorStop(p, c));
      ctx.fillStyle = g;
      ctx.fillRect(0, 0, CANVAS_W, CANVAS_H);
      ctx.restore();
    };

    // --- ベース: ユーザー背景（画像/動画・区間切替・クロスフェード）またはプリセットのグラデーション ---
    const segs = bgSegments(project);
    let cur = -1;
    for (let i = 0; i < segs.length; i++) { if (segs[i].start <= t) cur = i; else break; }
    let hasMedia = false;
    const drawSeg = (i, alpha) => {
      const seg = segs[i];
      const item = MediaLib.get(seg.bg.id);
      if (!item) { drawGradient(alpha); return; } // 素材未読込→グラデーションで代替
      hasMedia = true;
      let zoom = 1;
      if (seg.bg.type === "image" && ov.kenBurns !== false) { // Ken Burns: 区間内で8%ゆっくり拡大
        const p = clamp((t - seg.start) / Math.max(1, seg.end - seg.start), 0, 1);
        zoom = 1 + 0.08 * p;
      }
      let filter = bg.mediaFilter || null;
      if (filter && filter.includes("blur")) zoom *= 1.05; // ブラーの縁の透けを外へ追い出す
      drawMediaCover(ctx, item.el, item.w, item.h, zoom, seg.bg.posY, filter, alpha);
    };
    if (cur === -1) drawGradient();
    else {
      const seg = segs[cur];
      const fadeDur = project.bgTransition === "cut" ? 0 : 0.8;
      if (fadeDur > 0 && t < seg.start + fadeDur && seg.start > 0) { // 切替直後: 前の区間の上にフェードイン
        if (cur > 0) drawSeg(cur - 1); else drawGradient();
        drawSeg(cur, clamp((t - seg.start) / fadeDur, 0, 1));
      } else {
        drawSeg(cur);
      }
    }

    // --- 共通の後処理（可読性の担保: オーバーレイ→グラデ→ビネット→レターボックス→グレイン） ---
    const overlay = hasMedia ? (bg.mediaOverlay || bg.overlay) : bg.overlay;
    if (overlay) {
      ctx.fillStyle = overlay;
      ctx.fillRect(0, 0, CANVAS_W, CANVAS_H);
    }
    if (bg.riseGrad) {
      const h = CANVAS_H * (bg.riseGrad.height || 0.6);
      const g2 = ctx.createLinearGradient(0, CANVAS_H, 0, CANVAS_H - h);
      g2.addColorStop(0, hexA(bg.riseGrad.color, bg.riseGrad.alpha));
      g2.addColorStop(1, hexA(bg.riseGrad.color, 0));
      ctx.fillStyle = g2;
      ctx.fillRect(0, CANVAS_H - h, CANVAS_W, h);
    }
    if (bg.bottomGrad > 0) {
      const g2 = ctx.createLinearGradient(0, CANVAS_H * (1 - bg.bottomGrad), 0, CANVAS_H);
      g2.addColorStop(0, "rgba(0,0,0,0)"); g2.addColorStop(1, "rgba(0,0,0,0.55)");
      ctx.fillStyle = g2;
      ctx.fillRect(0, CANVAS_H * (1 - bg.bottomGrad), CANVAS_W, CANVAS_H * bg.bottomGrad);
    }
    if (bg.vignette > 0) {
      const rg = ctx.createRadialGradient(CANVAS_W / 2, CANVAS_H / 2, CANVAS_H * 0.5, CANVAS_W / 2, CANVAS_H / 2, CANVAS_W * 0.72);
      rg.addColorStop(0, "rgba(0,0,0,0)"); rg.addColorStop(1, `rgba(0,0,0,${bg.vignette})`);
      ctx.fillStyle = rg;
      ctx.fillRect(0, 0, CANVAS_W, CANVAS_H);
    }
    if (bg.letterbox) {
      ctx.fillStyle = "#000000";
      ctx.fillRect(0, 0, CANVAS_W, bg.letterbox);
      ctx.fillRect(0, CANVAS_H - bg.letterbox, CANVAS_W, bg.letterbox);
    }
    if (bg.grain) drawGrain(ctx, bg.grain, t);
  }

  // 1行を描画（entrance/exit のアルファ・オフセット込み、「/」による複数段対応、
  // プリセット拡張: 文字プレート / アンダーライン / 二重グロー / 影の濃さ / 横スライド登場）
  // num = 歌詞行の通し番号（間奏は数えない・UIの行番号と同じ数え方）。ov.lineNumbers でバッジ表示
  // mods = 次行プレビュー用の描画モッド（省略時は従来と完全に同じ）:
  //   alpha=登場前の透明度を外部管理 / noMove=登場・退場の移動を殺す（フェードのみ）/
  //   centerY=縦の基準（既定 0.52H）/ hideJa=和訳なし / hideEn=英語なし（昇格中は文字が別で飛ぶ）/
  //   dimmed=待機行（ワイプ・グロー・下線なしの一色）/ plate=プレート上書き / badgePos / badgeScale
  function drawLyricLine(ctx, line, lay, t, preset, ov, num, mods) {
    const ent = preset.entrance, ext = preset.exit;
    let alpha = 1, dy = 0, dx = 0;
    if (t < line.tStart) { // 登場アニメーション（tStart-dur 〜 tStart）
      const p = clamp((t - (line.tStart - ent.dur)) / ent.dur, 0, 1);
      alpha = p; dy = (1 - easeOut(p)) * (ent.dy || 0); dx = (1 - easeOut(p)) * (ent.dx || 0);
    } else if (t > line.tEnd) { // 退場
      const p = clamp((t - line.tEnd) / ext.dur, 0, 1);
      alpha = 1 - p; dy = easeOut(p) * (ext.dy || 0); dx = easeOut(p) * (ext.dx || 0);
    }
    if (mods && mods.noMove) { dy = 0; dx = 0; }
    if (mods && mods.alpha != null) alpha = mods.alpha; // 呼び出し側で透明度を完全管理（duetの待機・昇格・次行フェード）
    if (alpha <= 0.005) return;

    const shAlpha = preset.shadowAlpha != null ? preset.shadowAlpha : 0.5;
    const rows = lay.rows, rowH = lay.rowH;
    // 段が増えても全体の中心が 0.52H 付近に来るように（1段なら従来と同じ位置）
    const baseY0 = (mods && mods.centerY != null ? mods.centerY : CANVAS_H * 0.52) - ((rows.length - 1) * rowH) / 2 + dy;
    ctx.save();
    ctx.globalAlpha = alpha;
    if (dx) ctx.translate(dx, 0);
    ctx.textBaseline = "alphabetic";

    // 和訳のレイアウトを先に計算（Classroomのプレート寸法に必要）
    let jaLay = null;
    const lastRowY = baseY0 + (rows.length - 1) * rowH;
    if (ov.showJa && line.ja && !(mods && mods.hideJa)) {
      const jaSegs = enSegments(line.ja);
      let jSize = preset.jaSize * (ov.fontScale || 1);
      ctx.font = preset.jaFont(jSize);
      let jw = jaSegs.length ? Math.max(...jaSegs.map((s) => ctx.measureText(s).width)) : 0;
      if (jw > MAX_TEXT_W) { jSize = jSize * (MAX_TEXT_W / jw); jw = MAX_TEXT_W; }
      jaLay = { segs: jaSegs, size: jSize, width: jw };
    }

    // 文字プレート（Classroom: 背景が何であれ完全に読める白プレート）
    // 横幅は英語と和訳の広いほう（和訳が長い行でもはみ出さない）
    let plateLeft = null;
    const pl = (mods && mods.plate !== undefined) ? mods.plate : preset.plate;
    if (pl) {
      let left = Math.min(...rows.map((r) => r.left));
      let right = Math.max(...rows.map((r) => r.left + r.width));
      if (jaLay && jaLay.width) {
        left = Math.min(left, CANVAS_W / 2 - jaLay.width / 2);
        right = Math.max(right, CANVAS_W / 2 + jaLay.width / 2);
      }
      plateLeft = left;
      const top = baseY0 - lay.size * 1.02 - pl.padY;
      const bottom = (jaLay
        ? lastRowY + lay.size * 0.35 + jaLay.size * 1.1 + (jaLay.segs.length - 1) * jaLay.size * 1.5 + jaLay.size * 0.35
        : lastRowY + lay.size * 0.3) + pl.padY;
      ctx.save();
      ctx.shadowColor = "rgba(0,0,0,0.25)"; ctx.shadowBlur = 24; ctx.shadowOffsetY = 6;
      ctx.fillStyle = pl.color;
      roundRect(ctx, left - pl.padX, top, (right - left) + pl.padX * 2, bottom - top, pl.radius);
      ctx.fill();
      ctx.restore();
    }

    // 行番号バッジ（プリセットごとの書体・配色 = preset.num。位置は ov.lineNumPos: "shoulder"=左肩 / "side"=左横）
    if (ov.lineNumbers && num != null) {
      const st = preset.num || { font: (px) => `700 ${px}px Inter, "Noto Sans JP", sans-serif`, color: "rgba(255,255,255,0.95)", pill: "rgba(15,18,28,0.55)", border: "rgba(255,255,255,0.30)" };
      const label = String(num);
      const bScale = (mods && mods.badgeScale) || 1;
      const nSize = Math.max(bScale < 1 ? 18 : 26, Math.round(lay.size * 0.40 * bScale));
      ctx.font = st.font(nSize);
      const tw = ctx.measureText(label).width;
      const bh = Math.round(nSize * 1.5), bw = Math.max(bh, Math.round(tw + nSize * 0.9));
      const rad = st.square ? Math.round(bh * 0.22) : bh / 2;
      const blockLeft = pl ? plateLeft - pl.padX : Math.min(...rows.map((r) => r.left));
      const numPos = (mods && mods.badgePos) || ov.lineNumPos;
      let bx, by;
      if (numPos === "side") {                           // 左横: 1段目の大文字の光学中心に合わせる
        bx = Math.max(14, blockLeft - 26 - bw);
        by = baseY0 - lay.size * 0.36 - bh / 2;
      } else {                                            // 左肩（既定）: 歌詞ブロックの左上、少し浮かせる
        bx = Math.max(14, blockLeft);
        const topRef = baseY0 - lay.size * 1.02 - (pl ? pl.padY : 0);
        by = topRef - 12 - bh;
      }
      ctx.shadowColor = "rgba(0,0,0,0.35)"; ctx.shadowBlur = 8; ctx.shadowOffsetY = 2;
      ctx.fillStyle = st.pill;
      roundRect(ctx, bx, by, bw, bh, rad);
      ctx.fill();
      ctx.shadowColor = "transparent"; ctx.shadowBlur = 0; ctx.shadowOffsetY = 0;
      if (st.border) {
        ctx.strokeStyle = st.border; ctx.lineWidth = 1.5;
        roundRect(ctx, bx, by, bw, bh, rad);
        ctx.stroke();
      }
      if (st.glow) { ctx.shadowColor = st.glow.color; ctx.shadowBlur = st.glow.blur; }
      ctx.fillStyle = st.color;
      ctx.fillText(label, bx + (bw - tw) / 2, by + bh / 2 + nSize * 0.36);
      ctx.shadowColor = "transparent"; ctx.shadowBlur = 0;
    }

    ctx.font = preset.enFont(lay.size);
    if (mods && mods.hideEn) {
      // 昇格中: 英語本文は drawLiftText 側が飛ばしているので描かない（プレート・和訳・行番号だけ）
    } else if (mods && mods.dimmed) {
      // 待機行: ワイプ・グロー・下線という「歌唱中の記号」を持たない一色描き
      if (shAlpha > 0 && !pl) { ctx.shadowColor = `rgba(0,0,0,${shAlpha * 0.5})`; ctx.shadowBlur = 6; ctx.shadowOffsetY = 2; }
      ctx.fillStyle = pl ? preset.colors.unsung : preset.colors.ja;
      rows.forEach((row, r) => ctx.fillText(row.text, row.left, baseY0 + r * rowH));
      ctx.shadowColor = "transparent"; ctx.shadowBlur = 0; ctx.shadowOffsetY = 0;
    } else {
    const wp = wipeProgress(line, t);
    // タイミング側(line.words)とレイアウト側(lay.words)は同じトークン列。万一ずれても落ちないように
    const wordBox = (i) => lay.words[Math.min(Math.max(i, 0), lay.words.length - 1)];

    rows.forEach((row, r) => {
      const y = baseY0 + r * rowH;
      // パス1: 段全体を未唱色で（影つき）
      if (shAlpha > 0) {
        ctx.shadowColor = `rgba(0,0,0,${shAlpha})`;
        ctx.shadowBlur = 8; ctx.shadowOffsetY = 3;
      }
      ctx.fillStyle = preset.colors.unsung;
      ctx.fillText(row.text, row.left, y);
      ctx.shadowColor = "transparent"; ctx.shadowBlur = 0; ctx.shadowOffsetY = 0;

      // この段のワイプ先端xを求める（null=まだ、この段は塗らない）
      let wx = null;
      if (lay.words.length && wp.done >= row.end) wx = row.left + row.width; // 段まるごと歌唱済み
      else if (wp.active >= row.start && wp.active < row.end) {              // この段の途中
        const box = wordBox(wp.active);
        wx = box.x + wp.frac * box.w;
      }

      // パス2: ワイプ済み部分を既唱色で（クリップ矩形）
      if (wx != null && wx > row.left) {
        ctx.save();
        ctx.beginPath();
        ctx.rect(row.left - 20, y - lay.size * 1.3, (wx - row.left) + 20, lay.size * 1.8);
        ctx.clip();
        ctx.shadowColor = preset.colors.glow;
        ctx.shadowBlur = preset.glowBlur;
        ctx.fillStyle = preset.colors.sung;
        ctx.fillText(row.text, row.left, y);
        if (preset.glow2) { // ネオン管風: 大きな色グローの上に小さな白グローを重ねる
          ctx.shadowColor = preset.glow2.color;
          ctx.shadowBlur = preset.glow2.blur;
          ctx.fillText(row.text, row.left, y);
        }
        ctx.shadowColor = "transparent"; ctx.shadowBlur = 0;
        ctx.restore();

        // ワイプ先端の残光（歌唱中の単語がこの段にあるときだけ、先端の手前90px）
        if (preset.colors.edgeGrad && wp.active >= row.start && wp.active < row.end && wx < row.left + row.width) {
          const gw = 90;
          ctx.save();
          ctx.beginPath();
          ctx.rect(wx - gw, y - lay.size * 1.3, gw, lay.size * 1.8);
          ctx.clip();
          const g = ctx.createLinearGradient(wx - gw, 0, wx, 0);
          g.addColorStop(0, hexA(preset.colors.edgeGrad[0], 0));
          g.addColorStop(1, hexA(preset.colors.edgeGrad[1], 0.55));
          ctx.fillStyle = g;
          ctx.fillText(row.text, row.left, y);
          ctx.restore();
        }
      }

      // アンダーライン（Classroom: 点灯部分の下を青ラインが指で追うように伸びる）
      if (preset.underline && wx != null && wx > row.left) {
        ctx.fillStyle = preset.underline.color;
        ctx.fillRect(row.left, y + lay.size * 0.14, wx - row.left, preset.underline.h);
      }
    });
    }

    // 和訳（静的・ワイプなし。「/」で段分け可）
    if (jaLay) {
      ctx.font = preset.jaFont(jaLay.size);
      if (shAlpha > 0) {
        ctx.shadowColor = `rgba(0,0,0,${shAlpha * 0.9})`;
        ctx.shadowBlur = 6; ctx.shadowOffsetY = 2;
      }
      ctx.fillStyle = preset.colors.ja;
      jaLay.segs.forEach((s, i) => {
        const jy = lastRowY + lay.size * 0.35 + jaLay.size * 1.1 + i * jaLay.size * 1.5;
        ctx.fillText(s, CANVAS_W / 2 - ctx.measureText(s).width / 2, jy);
      });
      ctx.shadowColor = "transparent"; ctx.shadowBlur = 0; ctx.shadowOffsetY = 0;
    }
    ctx.restore();
  }

  const easeOut = (p) => 1 - Math.pow(1 - p, 3);
  function hexA(hex, a) {
    const r = parseInt(hex.slice(1, 3), 16), g = parseInt(hex.slice(3, 5), 16), b = parseInt(hex.slice(5, 7), 16);
    return `rgba(${r},${g},${b},${a})`;
  }

  /* ============================================================
     [5b] 次の行プレビュー（style.overrides.nextPreview）
     "single"=従来の1行のみ / "standby"=下部に次行を待機 /
     "duet"=カラオケ2段交互 / "cue"=standby＋歌い出し予告ドット
     すべて時刻の純関数（プレビュー＝MP4＝授業モードで同じ絵）
     ============================================================ */
  const SB_BASE_Y = 945;   // 待機行のベースライン（Cinemaのレターボックスにも掛からない）
  const SB_LEAD = 6.0;     // 間奏明け: 何秒前から次行を出すか
  const LIFT_PRESETS = { aurora: 1, neon: 1, bold: 1 }; // 昇格アニメが似合う「動」のプリセット（Classroomは静かなフェード交代）

  // 同期済み歌詞行を時刻順に。num=②歌詞・③同期と同じ通し番号 / slot=duetの段（0=上/1=下）
  function lyricTimeline(project) {
    const arr = [];
    let num = 0;
    for (const l of project.lines) {
      if (l.type !== "lyric") continue;
      num++;
      if (l.tStart != null && l.tEnd != null) arr.push({ line: l, num });
    }
    arr.sort((a, b) => a.line.tStart - b.line.tStart);
    arr.forEach((e, i) => { e.slot = i % 2; });
    return arr;
  }

  function hasGapBetween(project, a, b) { // 配列上で a と b の間に間奏行があるか
    let inside = false;
    for (const l of project.lines) {
      if (l === a) { inside = true; continue; }
      if (l === b) return false;
      if (inside && l.type === "gap") return true;
    }
    return false;
  }

  // 待機ゾーンの状態。次の行が無ければ null。
  // noteA=「♪」の透明度 / textA=待機テキストの透明度 / warm=歌い出し1.5秒前からの「温まり」
  function standbyState(project, time) {
    const tl = lyricTimeline(project);
    if (!tl.length) return null;
    let ci = -1;
    for (let i = 0; i < tl.length; i++) { if (tl[i].line.tStart <= time) ci = i; else break; }
    const cur = ci >= 0 ? tl[ci] : null;
    const next = tl[ci + 1] || null;
    if (!next) return null;
    const silenceStart = cur ? cur.line.tEnd : 0;
    const silence = next.line.tStart - silenceStart;
    // 間奏扱い: 行間3秒以上 or 間に間奏行がある（曲頭はイントロ3秒以上）
    const interlude = silence >= 3.0 || (cur ? hasGapBetween(project, cur.line, next.line) : next.line.tStart >= 3.0);
    let noteA = 0, textA;
    if (interlude) {
      const c = clamp((time - (next.line.tStart - SB_LEAD)) / 0.5, 0, 1); // 6秒前に ♪→次行 へ交代
      noteA = cur ? (1 - c) * clamp((time - (cur.line.tStart + 0.1)) / 0.35, 0, 1) : 0;
      textA = c;
    } else {
      textA = cur ? clamp((time - (cur.line.tStart + 0.1)) / 0.35, 0, 1) : 1;
    }
    const warm = clamp((time - (next.line.tStart - 1.5)) / 1.2, 0, 1);
    return { tl, ci, cur, next, silence, interlude, noteA, textA, warm };
  }

  // 待機行のミニレイアウト（"/"は1段に連結・幅1360px超で自動縮小）
  // 教室の後ろの席でも読める大きさ＝本体の60%（それでも本体との主従は崩れない）
  function standbyLayout(line, preset, ov) {
    const text = enSegments(line.en).join(" / ");
    let size = Math.max(34, Math.round(preset.enSize * 0.60 * (ov.fontScale || 1)));
    measureCtx.font = preset.enFont(size);
    let w = measureCtx.measureText(text).width;
    if (w > 1360) {
      size = Math.max(Math.round(size * 1360 / w), Math.round(size * 0.72));
      measureCtx.font = preset.enFont(size);
      w = measureCtx.measureText(text).width;
    }
    return { text, size, w };
  }

  // 待機行の小さな行番号バッジ（左横・縮小版）
  function drawMiniBadge(ctx, preset, num, xRight, midY, size, alpha) {
    const st = preset.num;
    if (!st || !st.font) return;
    const label = String(num);
    const nSize = Math.max(16, Math.round(size * 0.55));
    ctx.save();
    ctx.font = st.font(nSize);
    const tw = ctx.measureText(label).width;
    const bh = Math.round(nSize * 1.5), bw = Math.max(bh, Math.round(tw + nSize * 0.9));
    const rad = st.square ? Math.round(bh * 0.22) : bh / 2;
    const bx = xRight - bw, by = midY - bh / 2;
    ctx.globalAlpha = alpha;
    ctx.fillStyle = st.pill;
    roundRect(ctx, bx, by, bw, bh, rad); ctx.fill();
    if (st.border) { ctx.strokeStyle = st.border; ctx.lineWidth = 1.2; roundRect(ctx, bx, by, bw, bh, rad); ctx.stroke(); }
    ctx.fillStyle = st.color;
    ctx.fillText(label, bx + (bw - tw) / 2, by + bh / 2 + nSize * 0.36);
    ctx.restore();
  }

  // standby / cue の待機ゾーン描画。現在行より先に呼ぶ（＝現在行が上に載る）
  function drawStandbyZone(ctx, st, preset, ov, mode, time, lift) {
    const nl = st.next.line;
    const sb = standbyLayout(nl, preset, ov);
    let textA = st.textA;
    if (lift) textA *= lift.canLift ? 0 : (1 - lift.p); // 昇格中は飛んでいる文字に任せる / 静のプリセットはその場フェード
    const shAlpha = preset.shadowAlpha != null ? preset.shadowAlpha : 0.5;
    ctx.save();
    ctx.textBaseline = "alphabetic";
    if (st.noteA > 0.01) { // 間奏中の「♪」= このあとすぐは歌わない、の予告
      const ns = Math.round(preset.enSize * 0.5);
      ctx.font = preset.enFont(ns);
      ctx.fillStyle = preset.plate ? preset.colors.unsung : preset.colors.ja;
      ctx.globalAlpha = (preset.plate ? 0.5 : 0.4) * st.noteA;
      ctx.fillText("♪", CANVAS_W / 2 - ctx.measureText("♪").width / 2, SB_BASE_Y);
      ctx.globalAlpha = 1;
    }
    if (textA > 0.01) {
      const x = CANVAS_W / 2 - sb.w / 2;
      ctx.font = preset.enFont(sb.size); // 計測と同じフォントで描く（未設定だとCanvas既定の10pxになる）
      if (preset.plate) { // Classroom: 待機行専用の軽い小プレート（本体より薄く・影なし）
        ctx.globalAlpha = textA;
        ctx.fillStyle = "rgba(255,255,255,0.78)";
        roundRect(ctx, x - 28, SB_BASE_Y - sb.size * 1.02 - 12, sb.w + 56, sb.size * 1.32 + 24, 14);
        ctx.fill();
        ctx.globalAlpha = (0.75 + 0.20 * st.warm) * textA;
        ctx.fillStyle = preset.colors.unsung;
      } else {
        if (shAlpha > 0) { ctx.shadowColor = `rgba(0,0,0,${shAlpha * 0.5})`; ctx.shadowBlur = 6; ctx.shadowOffsetY = 2; }
        ctx.globalAlpha = (0.55 + 0.30 * st.warm) * textA; // 歌い出し接近で温まる
        ctx.fillStyle = preset.colors.ja;
      }
      ctx.fillText(sb.text, x, SB_BASE_Y);
      ctx.shadowColor = "transparent"; ctx.shadowBlur = 0; ctx.shadowOffsetY = 0;
      if (ov.lineNumbers) drawMiniBadge(ctx, preset, st.next.num, x - 20, SB_BASE_Y - sb.size * 0.36, sb.size, 0.7 * textA);
    }
    // 歌い出し予告ドット（cueのみ・行間2.5秒以上のときだけ）: 0.8秒間隔で 3→2→1 と消灯
    if (mode === "cue" && st.silence >= 2.5 && time < nl.tStart) {
      const dotY = SB_BASE_Y - sb.size * 1.02 - 36; // 待機プレートの少し上（文字サイズに追従）
      const acc = (preset.colors.edgeGrad && preset.colors.edgeGrad[0]) || (preset.underline && preset.underline.color) || preset.colors.sung;
      const fadeStart = Math.max(st.cur ? st.cur.line.tEnd : 0, nl.tStart - 3.4);
      const fadeIn = clamp((time - fadeStart) / 0.3, 0, 1);
      if (fadeIn > 0.01) {
        for (let k = 0; k < 3; k++) {
          const tE = nl.tStart - 2.4 + k * 0.8;
          const off = clamp((time - tE) / 0.15, 0, 1); // 消灯は縮小＋フェード
          const a = 0.9 * fadeIn * (1 - off);
          if (a <= 0.01) continue;
          ctx.globalAlpha = a;
          ctx.fillStyle = acc;
          ctx.beginPath();
          ctx.arc(CANVAS_W / 2 + (k - 1) * 30, dotY, 9 * (1 - 0.6 * off), 0, Math.PI * 2);
          ctx.fill();
        }
      }
    }
    ctx.restore();
  }

  // 昇格アニメ: 待機行の文字が中央へ飛びながら大きくなる（1段の行のみ・LIFT_PRESETSのみ）
  // 到着時は drawLyricLine の未唱色1段目と完全に一致する（位置・サイズ・色）
  function drawLiftText(ctx, line, lay, preset, ov, p) {
    const sb = standbyLayout(line, preset, ov);
    const e = easeOut(p);
    const size = sb.size + (lay.size - sb.size) * e;
    const y = SB_BASE_Y + (CANVAS_H * 0.52 - SB_BASE_Y) * e;
    const alpha = 0.85 + 0.15 * e;
    ctx.save();
    ctx.textBaseline = "alphabetic";
    ctx.font = preset.enFont(size);
    const w = ctx.measureText(sb.text).width;
    const x = CANVAS_W / 2 - w / 2;
    if (preset.plate) { // Classroom: 小プレートは飛び立ちの最初で消える（到着先は本体プレートが待つ）
      const pa = 0.78 * (1 - clamp(p / 0.35, 0, 1));
      if (pa > 0.01) {
        ctx.fillStyle = `rgba(255,255,255,${pa})`;
        roundRect(ctx, x - 28, y - size * 1.02 - 12, w + 56, size * 1.32 + 24, 14);
        ctx.fill();
      }
    }
    const shAlpha = preset.shadowAlpha != null ? preset.shadowAlpha : 0.5;
    if (shAlpha > 0 && !preset.plate) { ctx.shadowColor = `rgba(0,0,0,${shAlpha * 0.5})`; ctx.shadowBlur = 6; ctx.shadowOffsetY = 2; }
    ctx.globalAlpha = alpha * (1 - e); // 待機色 → 未唱色 へクロスフェード
    ctx.fillStyle = preset.plate ? preset.colors.unsung : preset.colors.ja;
    ctx.fillText(sb.text, x, y);
    ctx.globalAlpha = alpha * e;
    ctx.fillStyle = preset.colors.unsung;
    ctx.fillText(sb.text, x, y);
    ctx.restore();
  }

  // duet: 本物のカラオケ式2段交互。上下段は tl の並び順で交互（決定論的）
  const DUET_TOP = 436, DUET_BOT = 736, DUET_JA_Y = 920;
  function renderDuet(ctx, time, project, preset, ov) {
    const tl = lyricTimeline(project);
    if (!tl.length) return;
    let ci = -1;
    for (let i = 0; i < tl.length; i++) { if (tl[i].line.tStart <= time) ci = i; else break; }
    const prev = ci >= 1 ? tl[ci - 1] : null;
    const cur = ci >= 0 ? tl[ci] : null;
    const next = tl[ci + 1] || null;
    const next2 = tl[ci + 2] || null;
    const st = standbyState(project, time); // ♪/フェード/温まりのフェーズを standby と共有
    const slotY = (e) => (e.slot === 0 ? DUET_TOP : DUET_BOT);
    const scaleFor = (l) => (ov.fontScale || 1) * 0.88 * (enSegments(l.en).length > 2 ? 0.72 : 1); // 2段共存ぶん少し絞る
    // 白プレートの濃さ: 待機0.65 → 現在0.92 へ prom(0..1) で連続補間（パッと切り替えない）
    const plateFor = (kind, prom) => preset.plate
      ? { color: `rgba(255,255,255,${(kind === "wait" ? 0.65 : 0.65 + 0.27 * (prom == null ? 1 : prom)).toFixed(3)})`, radius: 16, padX: 36, padY: 16 }
      : null;
    const waitMods = (e, alpha) => ({
      centerY: slotY(e), hideJa: true, noMove: true, dimmed: true, alpha,
      plate: plateFor("wait"), badgePos: "side", badgeScale: 0.7,
    });
    // 直前の行のしっぽ: 次の行が始まっても急には消えず、通常の退場フェードを最後まで描く
    if (prev && time <= prev.line.tEnd + preset.exit.dur + 0.01) {
      const lay = layoutLine(prev.line, preset, scaleFor(prev.line));
      drawLyricLine(ctx, prev.line, lay, time, preset, ov, prev.num,
        { centerY: slotY(prev), hideJa: true, noMove: true, plate: plateFor("active"), badgePos: "side" });
    }
    // 現在行（ワイプで点灯・退場はその場フェード）。待機の姿から0.45秒かけてふわっと昇格
    if (cur && time <= cur.line.tEnd + preset.exit.dur + 0.01) {
      const promDur = Math.min(0.45, Math.max(0.15, cur.line.tEnd - cur.line.tStart));
      const pr = clamp((time - cur.line.tStart) / promDur, 0, 1);
      const prom = easeOut(pr);
      const mods = { centerY: slotY(cur), hideJa: true, noMove: true,
                     plate: plateFor("active", prom), badgePos: "side", badgeScale: 0.7 + 0.3 * prom };
      if (pr < 1) mods.alpha = preset.plate ? 0.95 + 0.05 * prom : 0.85 + 0.15 * prom; // 待機時の濃さから連続
      const lay = layoutLine(cur.line, preset, scaleFor(cur.line));
      drawLyricLine(ctx, cur.line, lay, time, preset, ov, cur.num, mods);
    }
    // 待機行（もう一方の段）。直前の行が同じ段から退場しきってから静かに入居
    if (next && st) {
      if (st.noteA > 0.01) {
        const ns = Math.round(preset.enSize * 0.5);
        ctx.save();
        ctx.textBaseline = "alphabetic";
        ctx.font = preset.enFont(ns);
        ctx.fillStyle = preset.plate ? preset.colors.unsung : preset.colors.ja;
        ctx.globalAlpha = (preset.plate ? 0.5 : 0.4) * st.noteA;
        ctx.fillText("♪", CANVAS_W / 2 - ctx.measureText("♪").width / 2, slotY(next));
        ctx.restore();
      }
      if (st.textA > 0.01) {
        let a = (preset.plate ? 0.78 + 0.17 * st.warm : 0.55 + 0.30 * st.warm) * st.textA;
        if (prev) a *= clamp((time - (prev.line.tEnd + preset.exit.dur)) / 0.35, 0, 1); // 段が空くのを待つ
        if (a > 0.01) {
          const lay = layoutLine(next.line, preset, scaleFor(next.line));
          drawLyricLine(ctx, next.line, lay, time, preset, ov, next.num, waitMods(next, a));
        }
      }
    }
    // 次々行: 現在行が退場して空いた段に静かに入居
    if (cur && next2 && time > cur.line.tEnd + preset.exit.dur + 0.15) {
      const a = 0.5 * clamp((time - (cur.line.tEnd + preset.exit.dur + 0.15)) / 0.4, 0, 1);
      const lay = layoutLine(next2.line, preset, scaleFor(next2.line));
      drawLyricLine(ctx, next2.line, lay, time, preset, ov, next2.num, waitMods(next2, a));
    }
    // 和訳バンド（定位置）: 行の切り替わりは白プレートごとクロスフェード
    const drawJaBand = (line, a) => {
      ctx.save();
      ctx.textBaseline = "alphabetic";
      const text = enSegments(line.ja).join("　");
      let jSize = preset.jaSize * (ov.fontScale || 1);
      ctx.font = preset.jaFont(jSize);
      let jw = ctx.measureText(text).width;
      if (jw > MAX_TEXT_W) { jSize *= MAX_TEXT_W / jw; ctx.font = preset.jaFont(jSize); jw = ctx.measureText(text).width; }
      ctx.globalAlpha = a;
      if (preset.plate) {
        ctx.fillStyle = "rgba(255,255,255,0.78)";
        roundRect(ctx, CANVAS_W / 2 - jw / 2 - 24, DUET_JA_Y - jSize * 1.05 - 10, jw + 48, jSize * 1.4 + 20, 12);
        ctx.fill();
      }
      const shAlpha = preset.shadowAlpha != null ? preset.shadowAlpha : 0.5;
      if (shAlpha > 0 && !preset.plate) { ctx.shadowColor = `rgba(0,0,0,${shAlpha * 0.9})`; ctx.shadowBlur = 6; ctx.shadowOffsetY = 2; }
      ctx.fillStyle = preset.colors.ja;
      ctx.fillText(text, CANVAS_W / 2 - jw / 2, DUET_JA_Y);
      ctx.restore();
    };
    if (ov.showJa) {
      // 順送り: 前の和訳が消えきってから次をフェードイン（二重写しにしない）
      if (prev && prev.line.ja && time <= prev.line.tEnd + preset.exit.dur + 0.01) {
        const a = 1 - clamp((time - prev.line.tEnd) / preset.exit.dur, 0, 1);
        if (a > 0.01) drawJaBand(prev.line, a);
      }
      if (cur && cur.line.ja && time <= cur.line.tEnd + preset.exit.dur + 0.01) {
        const jaStart = Math.max(cur.line.tStart, prev ? prev.line.tEnd + preset.exit.dur : 0);
        let a = clamp((time - jaStart) / 0.3, 0, 1);
        if (time > cur.line.tEnd) a *= 1 - clamp((time - cur.line.tEnd) / preset.exit.dur, 0, 1);
        if (a > 0.01) drawJaBand(cur.line, a);
      }
    }
  }

  // ★ 心臓部: 時刻 t の1フレームを描く純関数（プレビュー＝書き出し）
  // 背景動画のフレームだけは MediaLib 側で供給される（プレビュー=並走再生 / 書き出し=シーク済み）
  function renderFrame(ctx, t, project) {
    const preset = PRESETS[project.style.presetId] || PRESETS.aurora;
    const ov = project.style.overrides;
    const time = t + (ov.syncOffsetMs || 0) / 1000;
    drawBackground(ctx, time, project, preset, ov);
    const npMode = ov.nextPreview || "single";
    if (npMode === "duet") { renderDuet(ctx, time, project, preset, ov); return; }
    // 次行の待機表示（standby / cue）。現在行より先に描く＝現在行が上に載る
    let lift = null;
    if (npMode === "standby" || npMode === "cue") {
      const st = standbyState(project, time);
      if (st) {
        const nl = st.next.line;
        const liftDur = Math.max(preset.entrance.dur, 0.32);
        if (time >= nl.tStart - liftDur) {
          lift = { line: nl, dur: liftDur, p: clamp((time - (nl.tStart - liftDur)) / liftDur, 0, 1),
                   canLift: !!LIFT_PRESETS[preset.id] && enSegments(nl.en).length === 1 };
        }
        drawStandbyZone(ctx, st, preset, ov, npMode, time, lift);
      }
    }
    // 表示ウィンドウ内の行（登場前0.35s〜退場後0.35s）を描画
    let num = 0; // 歌詞行の通し番号（間奏は数えない＝②歌詞・③同期の行番号と一致）
    for (const line of project.lines) {
      if (line.type !== "lyric") continue;
      num++;
      if (line.tStart == null || line.tEnd == null) continue;
      const lifting = lift && lift.canLift && line === lift.line && time < line.tStart;
      const entDur = lifting ? lift.dur : preset.entrance.dur;
      if (time < line.tStart - entDur - 0.01) continue;
      if (time > line.tEnd + preset.exit.dur + 0.01) continue;
      const lay = layoutLine(line, preset, ov.fontScale || 1);
      if (lifting) {
        // 昇格: 到着先のプレート・和訳・行番号を後半でフェードイン、英語本文は下から飛んでくる
        drawLyricLine(ctx, line, lay, time, preset, ov, num,
          { alpha: clamp((lift.p - 0.6) / 0.4, 0, 1), hideEn: true, noMove: true });
        drawLiftText(ctx, line, lay, preset, ov, lift.p);
      } else {
        drawLyricLine(ctx, line, lay, time, preset, ov, num);
      }
    }
  }

  /* ============================================================
     [6] MP4書き出しエンジン（フェーズ2）
     renderFrame を 1/30 秒刻みでオフライン描画し、WebCodecs で
     H.264（音声は AAC、不可なら Opus）にエンコードして
     mp4-muxer で MP4 に固める。プレビューと完全に同じ絵になる。
     ============================================================ */
  const EXPORT_FPS = 30;
  const EXPORT_CANCELLED = "export-cancelled";
  const EXPORT_QUALITIES = {
    high:   { label: "高画質", vbr: 12000000 },
    normal: { label: "標準",   vbr: 8000000 },
    light:  { label: "軽め",   vbr: 5000000 },
  };
  const EXPORT_ABR = 192000; // 音声ビットレート

  // 環境チェック: { ok, videoCodec, audioCodec:'aac'|'opus', reason }
  async function exportPreflight() {
    if (!("VideoEncoder" in window) || !("AudioEncoder" in window) || !window.Mp4Muxer) {
      return { ok: false, reason: "このブラウザはWebCodecs未対応です。Chrome/Edgeの最新版をお使いください" };
    }
    let videoCodec = null;
    for (const c of ["avc1.640028", "avc1.4d0028", "avc1.420028"]) { // High→Main→Baseline 4.0
      try {
        const s = await VideoEncoder.isConfigSupported({ codec: c, width: CANVAS_W, height: CANVAS_H, bitrate: 8000000, framerate: EXPORT_FPS });
        if (s.supported) { videoCodec = c; break; }
      } catch (e) {}
    }
    if (!videoCodec) return { ok: false, reason: "H.264エンコーダが見つかりません（Chrome/Edgeの最新版をお使いください）" };
    let audioCodec = null;
    try {
      const a = await AudioEncoder.isConfigSupported({ codec: "mp4a.40.2", sampleRate: 48000, numberOfChannels: 2, bitrate: EXPORT_ABR });
      if (a.supported) audioCodec = "aac";
    } catch (e) {}
    if (!audioCodec) {
      try {
        const o = await AudioEncoder.isConfigSupported({ codec: "opus", sampleRate: 48000, numberOfChannels: 2, bitrate: 160000 });
        if (o.supported) audioCodec = "opus";
      } catch (e) {}
    }
    if (!audioCodec) return { ok: false, reason: "音声エンコーダ（AAC/Opus）が見つかりません" };
    return { ok: true, videoCodec, audioCodec };
  }

  // 実行本体。fileHandle があれば FSA へストリーム書き込み、なければメモリ上に生成して blob を返す。
  // task = { cancelled } を毎フレーム見て中断できる。
  async function exportMp4({ project, pre, quality, fileHandle, onProgress, task }) {
    if (!AE.ready || !AE.url) throw new Error("音声が読み込まれていません（①取り込みからやり直してください）");

    // --- フォントと背景素材の準備（未ロードのまま焼き込まない）
    try { await document.fonts.ready; } catch (e) {}
    MediaLib.exportMode = true; // プレビュー側の動画制御を止め、書き出しがシークを専有する
    for (const it of MediaLib.items.values()) {
      if (it.kind === "video" && it.el) { try { it.el.pause(); } catch (e) {} }
    }

    // --- 音声を48kHzでフルデコード（Opusの必須レートに合わせる。ピークしか保持していないので元ファイルから）
    const srcBuf = await (await fetch(AE.url)).arrayBuffer();
    const probe = new OfflineAudioContext(2, 1, 48000);
    const abuf = await probe.decodeAudioData(srcBuf);
    const channels = abuf.numberOfChannels >= 2 ? 2 : 1;
    const sr = abuf.sampleRate;
    const durationSec = abuf.duration;
    const totalFrames = Math.ceil(durationSec * EXPORT_FPS);

    // --- 出力先とマルチプレクサ
    let writable = null;
    const target = fileHandle
      ? new Mp4Muxer.FileSystemWritableFileStreamTarget(writable = await fileHandle.createWritable())
      : new Mp4Muxer.ArrayBufferTarget();
    const muxer = new Mp4Muxer.Muxer({
      target,
      video: { codec: "avc", width: CANVAS_W, height: CANVAS_H },
      audio: { codec: pre.audioCodec === "aac" ? "aac" : "opus", numberOfChannels: channels, sampleRate: sr },
      fastStart: fileHandle ? false : "in-memory",
    });

    // --- エンコーダ
    let encError = null;
    const venc = new VideoEncoder({
      output: (chunk, meta) => muxer.addVideoChunk(chunk, meta),
      error: (e) => { encError = e; },
    });
    venc.configure({
      codec: pre.videoCodec, width: CANVAS_W, height: CANVAS_H,
      bitrate: (EXPORT_QUALITIES[quality] || EXPORT_QUALITIES.normal).vbr,
      framerate: EXPORT_FPS, latencyMode: "quality", avc: { format: "avc" },
    });
    const aenc = new AudioEncoder({
      output: (chunk, meta) => muxer.addAudioChunk(chunk, meta),
      error: (e) => { encError = e; },
    });
    aenc.configure(pre.audioCodec === "aac"
      ? { codec: "mp4a.40.2", sampleRate: sr, numberOfChannels: channels, bitrate: EXPORT_ABR }
      : { codec: "opus", sampleRate: sr, numberOfChannels: channels, bitrate: 160000 });

    // --- 音声供給（映像の進みに合わせて1秒ずつ）
    const ch0 = abuf.getChannelData(0);
    const ch1 = channels === 2 ? abuf.getChannelData(1) : null;
    let audioOff = 0;
    const feedAudioUpTo = (sampleEnd) => {
      const end = Math.min(sampleEnd, abuf.length);
      while (audioOff < end) {
        const n = Math.min(sr, end - audioOff);
        const data = new Float32Array(n * channels);
        data.set(ch0.subarray(audioOff, audioOff + n), 0);
        if (ch1) data.set(ch1.subarray(audioOff, audioOff + n), n);
        const ad = new AudioData({
          format: "f32-planar", sampleRate: sr, numberOfFrames: n, numberOfChannels: channels,
          timestamp: Math.round((audioOff / sr) * 1e6), data,
        });
        aenc.encode(ad); ad.close();
        audioOff += n;
      }
    };

    // --- 描画キャンバス（プレビューと同じ renderFrame を使う）
    const canvas = document.createElement("canvas");
    canvas.width = CANVAS_W; canvas.height = CANVAS_H;
    const ctx = canvas.getContext("2d", { alpha: false });

    // タブが背面でも減速しない yield（setTimeoutはバックグラウンドで1秒に絞られる）
    const yieldChan = new MessageChannel();
    const microYield = () => new Promise((r) => { yieldChan.port1.onmessage = () => r(); yieldChan.port2.postMessage(0); });
    const waitDequeue = (enc) => new Promise((r) => {
      const h = () => { clearTimeout(tm); r(); };
      const tm = setTimeout(() => { enc.removeEventListener("dequeue", h); r(); }, 250);
      enc.addEventListener("dequeue", h, { once: true });
    });

    const t0 = performance.now();
    try {
      for (let i = 0; i < totalFrames; i++) {
        if (task && task.cancelled) throw new Error(EXPORT_CANCELLED);
        if (encError) throw encError;
        await MediaLib.seekForFrame(project, i / EXPORT_FPS); // 背景動画をフレーム正確に合わせる（単調増加＝高速）
        renderFrame(ctx, i / EXPORT_FPS, project);
        const frame = new VideoFrame(canvas, {
          timestamp: Math.round((i * 1e6) / EXPORT_FPS),
          duration: Math.round(1e6 / EXPORT_FPS),
        });
        venc.encode(frame, { keyFrame: i % (EXPORT_FPS * 2) === 0 }); // 2秒ごとにキーフレーム
        frame.close();
        feedAudioUpTo(Math.ceil(((i + 1) / EXPORT_FPS) * sr));
        if (venc.encodeQueueSize > 6) await waitDequeue(venc); // バックプレッシャ
        if (i % 3 === 2) await microYield();                   // UIに息継ぎ
        if (onProgress && (i % 15 === 0 || i === totalFrames - 1)) {
          const elapsed = (performance.now() - t0) / 1000;
          onProgress({
            frame: i + 1, totalFrames, pct: (i + 1) / totalFrames, elapsed,
            eta: elapsed > 2 ? ((totalFrames - i - 1) * elapsed) / (i + 1) : null,
          });
        }
      }
      feedAudioUpTo(abuf.length);
      await venc.flush(); await aenc.flush();
      if (encError) throw encError;
      muxer.finalize();
      try { venc.close(); aenc.close(); } catch (e) {}
      let size = 0, blob = null;
      if (writable) {
        await writable.close();
        try { size = (await fileHandle.getFile()).size; } catch (e) {}
      } else {
        blob = new Blob([target.buffer], { type: "video/mp4" });
        size = blob.size;
      }
      return { size, blob, durationSec, totalFrames, elapsed: (performance.now() - t0) / 1000, audioCodec: pre.audioCodec };
    } catch (e) {
      try { venc.close(); } catch (e2) {}
      try { aenc.close(); } catch (e2) {}
      if (writable) { try { await writable.abort(); } catch (e2) {} } // 中断時はファイルを残さない
      throw e;
    } finally {
      MediaLib.exportMode = false; // プレビューの動画同期を再開
    }
  }

  /* ============================================================
     [6] 波形タイムラインエディタ（canvas・ヒットテスト・ドラッグ）
     ============================================================ */
  const LANE_H = 56;   // 行ブロック帯
  const RULER_H = 20;  // 時間目盛り

  function hitTestTimeline(x, y, geom) {
    // geom: { lines, selId, view:{t0,pps}, width, laneH, waveTop, waveH }
    const { lines, selId, view } = geom;
    const t = view.t0 + x / view.pps;
    if (y <= geom.laneH) {
      // 1. 選択行の単語境界ハンドル（画面に表示されているズーム率のときだけ）
      const sel = lines.find((l) => l.id === selId);
      if (geom.showWords && sel && sel.type === "lyric" && sel.tStart != null && sel.words.length > 1) {
        for (let i = 1; i < sel.words.length; i++) {
          const bx = (sel.words[i].tStart - view.t0) * view.pps;
          if (Math.abs(x - bx) <= 6) return { type: "wordBoundary", lineId: sel.id, idx: i };
        }
      }
      // 2. 行端 → 3. 行本体（選択行を優先）
      const ordered = [...lines].sort((a, b) => (a.id === selId ? -1 : 0) - (b.id === selId ? -1 : 0));
      for (const l of ordered) {
        if (l.type !== "lyric" || l.tStart == null) continue;
        const x0 = (l.tStart - view.t0) * view.pps, x1 = (l.tEnd - view.t0) * view.pps;
        if (Math.abs(x - x0) <= 8) return { type: "lineStart", lineId: l.id };
        if (Math.abs(x - x1) <= 8) return { type: "lineEnd", lineId: l.id };
        if (x > x0 && x < x1) return { type: "lineMove", lineId: l.id };
      }
      return { type: "laneEmpty", t };
    }
    return { type: "seek", t };
  }

  function Timeline({ project, selId, selBoundary, onSelect, onSelectBoundary, onCommitLines, scrubRef, followRef }) {
    const wrapRef = useRef(null);
    const canvasRef = useRef(null);
    const viewRef = useRef({ t0: 0, pps: 30 }); // pxPerSec: 10〜1000
    const dragRef = useRef(null);
    const linesRef = useRef(project.lines);
    const propsRef = useRef({});
    propsRef.current = { selId, selBoundary, onSelect, onSelectBoundary, onCommitLines, project };
    if (!dragRef.current) linesRef.current = project.lines;

    // 初期表示: 全体
    useEffect(() => {
      const el = wrapRef.current;
      if (el && AE.duration > 0) {
        const w = el.clientWidth;
        viewRef.current = { t0: 0, pps: clamp(w / AE.duration, 3, 120) };
      }
    }, [AE.duration]);

    // 描画ループ（常時rAF・波形はmipmapで軽量）
    useEffect(() => {
      let raf, alive = true;
      const draw = () => {
        if (!alive) return;
        raf = requestAnimationFrame(draw);
        const canvas = canvasRef.current, wrap = wrapRef.current;
        if (!canvas || !wrap) return;
        const dpr = window.devicePixelRatio || 1;
        const W = wrap.clientWidth, H = wrap.clientHeight;
        if (canvas.width !== W * dpr || canvas.height !== H * dpr) {
          canvas.width = W * dpr; canvas.height = H * dpr;
        }
        const ctx = canvas.getContext("2d");
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        const view = viewRef.current;
        const dur = AE.duration || 1;
        const t = AE.t();

        // 再生追従（ドラッグ中を除く）
        if (AE.playing && !dragRef.current && followRef.current) {
          const px = (t - view.t0) * view.pps;
          if (px > W * 0.85 || px < 0) view.t0 = clamp(t - (W * 0.15) / view.pps, 0, Math.max(0, dur - W / view.pps));
        }
        view.t0 = clamp(view.t0, 0, Math.max(0, dur - W / view.pps));

        ctx.clearRect(0, 0, W, H);
        const waveTop = LANE_H, waveH = H - LANE_H - RULER_H;
        const t1 = view.t0 + W / view.pps;

        // --- 波形 ---
        drawWave(ctx, AE.peaks, view.t0, t1, 0, waveTop + 4, W, waveH - 8, "#3A4150");
        const phX = (t - view.t0) * view.pps;
        if (phX > 0) {
          ctx.save();
          ctx.beginPath(); ctx.rect(0, waveTop, Math.min(phX, W), waveH); ctx.clip();
          drawWave(ctx, AE.peaks, view.t0, t1, 0, waveTop + 4, W, waveH - 8, "rgba(124,108,255,0.5)");
          ctx.restore();
        }

        // --- 時間目盛り ---
        const steps = [0.1, 0.25, 0.5, 1, 2, 5, 10, 15, 30, 60];
        const step = steps.find((s) => s * view.pps >= 70) || 60;
        ctx.fillStyle = "#5A6172"; ctx.font = "10px Inter, sans-serif"; ctx.textBaseline = "top";
        ctx.strokeStyle = "#2A2F3C";
        for (let s = Math.ceil(view.t0 / step) * step; s <= t1; s += step) {
          const x = (s - view.t0) * view.pps;
          ctx.beginPath(); ctx.moveTo(x, waveTop); ctx.lineTo(x, H - RULER_H); ctx.stroke();
          ctx.fillText(step < 1 ? s.toFixed(1) : fmtDur(s), x + 3, H - RULER_H + 4);
        }

        // --- 行ブロック ---
        const lines = linesRef.current;
        const showWords = (W / view.pps) <= 15; // 1画面15秒以下で単語境界表示
        ctx.textBaseline = "middle";
        let num = 0;
        for (const l of lines) {
          if (l.type !== "lyric") continue;
          num++;
          if (l.tStart == null) continue;
          const x0 = (l.tStart - view.t0) * view.pps, x1 = (l.tEnd - view.t0) * view.pps;
          if (x1 < -20 || x0 > W + 20) continue;
          const sel = l.id === propsRef.current.selId;
          const bw = Math.max(2, x1 - x0);
          ctx.fillStyle = sel ? "rgba(124,108,255,0.28)" : "#2A2F3A";
          roundRect(ctx, x0, 8, bw, LANE_H - 16, 7);
          ctx.fill();
          if (sel) { ctx.strokeStyle = "#7C6CFF"; ctx.lineWidth = 1.5; roundRect(ctx, x0, 8, bw, LANE_H - 16, 7); ctx.stroke(); }
          // ラベル
          if (bw > 30) {
            ctx.save();
            ctx.beginPath(); ctx.rect(x0 + 6, 8, bw - 12, LANE_H - 16); ctx.clip();
            ctx.fillStyle = sel ? "#EDEFF5" : "#9AA3B5";
            ctx.font = "11px Inter, 'Noto Sans JP', sans-serif";
            ctx.fillText(num + "  " + l.en, x0 + 8, LANE_H / 2 - (showWords && sel ? 8 : 0));
            ctx.restore();
          }
          // 単語境界（選択行のみハンドル＋ラベル、他は薄い線）
          if (showWords && l.words.length > 1) {
            for (let i = 1; i < l.words.length; i++) {
              const bx = (l.words[i].tStart - view.t0) * view.pps;
              if (bx < x0 + 2 || bx > x1 - 2) continue;
              const isSelB = sel && propsRef.current.selBoundary === i;
              ctx.strokeStyle = isSelB ? "#FFB454" : sel ? "rgba(124,108,255,0.9)" : "rgba(255,255,255,0.12)";
              ctx.lineWidth = isSelB ? 2 : 1;
              ctx.beginPath(); ctx.moveTo(bx, sel ? 12 : 20); ctx.lineTo(bx, LANE_H - 12); ctx.stroke();
            }
            if (sel && bw / l.words.length > 26) {
              ctx.fillStyle = "rgba(237,239,245,0.75)"; ctx.font = "9px Inter, sans-serif";
              for (let i = 0; i < l.words.length; i++) {
                const wx0 = (l.words[i].tStart - view.t0) * view.pps;
                ctx.save();
                ctx.beginPath(); ctx.rect(wx0 + 1, LANE_H - 24, (l.words[i].tEnd - l.words[i].tStart) * view.pps - 2, 14); ctx.clip();
                ctx.fillText(l.words[i].text, wx0 + 3, LANE_H - 16);
                ctx.restore();
              }
            }
          }
          // 端ハンドル（選択行）
          if (sel) {
            ctx.fillStyle = "#7C6CFF";
            roundRect(ctx, x0 - 2.5, 14, 5, LANE_H - 28, 2.5); ctx.fill();
            roundRect(ctx, x1 - 2.5, 14, 5, LANE_H - 28, 2.5); ctx.fill();
          }
        }

        // --- 背景切替マーカー（🖼 表示のみ・操作は④デザインの背景リストで） ---
        const proj = propsRef.current.project;
        if (proj && proj.backgrounds && proj.backgrounds.length) {
          const bsegs = bgSegments(proj);
          ctx.font = "12px sans-serif";
          for (const s of bsegs) {
            if (s.start <= 0.001 && !s.bg.fromLineId) continue; // 曲頭の背景はマーク不要
            const bx = (s.start - view.t0) * view.pps;
            if (bx < -14 || bx > W + 14) continue;
            ctx.strokeStyle = "rgba(255,255,255,0.30)";
            ctx.lineWidth = 1;
            ctx.setLineDash([3, 4]);
            ctx.beginPath(); ctx.moveTo(bx, waveTop); ctx.lineTo(bx, H - RULER_H); ctx.stroke();
            ctx.setLineDash([]);
            ctx.fillText("🖼", bx + 3, waveTop + 14);
          }
        }

        // --- ループ範囲ハイライト ---
        const loop = AE._loop;
        if (loop && loop.on) {
          const lx0 = (loop.start - view.t0) * view.pps, lx1 = (loop.end - view.t0) * view.pps;
          ctx.fillStyle = "rgba(124,108,255,0.10)";
          ctx.fillRect(lx0, waveTop, lx1 - lx0, waveH);
        }

        // --- 再生ヘッド ---
        ctx.strokeStyle = "#FFFFFF"; ctx.lineWidth = 1;
        ctx.beginPath(); ctx.moveTo(phX, 0); ctx.lineTo(phX, H - RULER_H); ctx.stroke();
        ctx.fillStyle = "#FFFFFF";
        ctx.beginPath(); ctx.moveTo(phX - 5, 0); ctx.lineTo(phX + 5, 0); ctx.lineTo(phX, 7); ctx.closePath(); ctx.fill();

        // --- ドラッグ中の時刻ツールチップ ---
        const d = dragRef.current;
        if (d && d.tipText) {
          ctx.font = "11px Inter, sans-serif";
          const tw = ctx.measureText(d.tipText).width + 12;
          const tipX = clamp(d.tipX - tw / 2, 4, W - tw - 4);
          ctx.fillStyle = "#1E2230";
          roundRect(ctx, tipX, LANE_H + 6, tw, 20, 5); ctx.fill();
          ctx.strokeStyle = "#2A2F3C"; ctx.lineWidth = 1; roundRect(ctx, tipX, LANE_H + 6, tw, 20, 5); ctx.stroke();
          ctx.fillStyle = "#EDEFF5"; ctx.fillText(d.tipText, tipX + 6, LANE_H + 16);
        }
      };
      raf = requestAnimationFrame(draw);
      return () => { alive = false; cancelAnimationFrame(raf); };
    }, []);

    // ホイール: Cmd/Ctrl+ホイール=ズーム、他=横スクロール（passive:false が必要なので手動登録）
    useEffect(() => {
      const el = wrapRef.current;
      if (!el) return;
      const onWheel = (e) => {
        e.preventDefault();
        const view = viewRef.current, W = el.clientWidth;
        if (e.ctrlKey || e.metaKey) {
          const mx = e.offsetX, tAt = view.t0 + mx / view.pps;
          const factor = Math.exp(-e.deltaY * 0.0015);
          view.pps = clamp(view.pps * factor, 3, 1000);
          view.t0 = tAt - mx / view.pps;
        } else {
          const delta = (Math.abs(e.deltaX) > Math.abs(e.deltaY) ? e.deltaX : e.deltaY);
          view.t0 += delta / view.pps;
        }
        view.t0 = clamp(view.t0, 0, Math.max(0, (AE.duration || 0) - W / view.pps));
      };
      el.addEventListener("wheel", onWheel, { passive: false });
      return () => el.removeEventListener("wheel", onWheel);
    }, []);

    const getGeom = () => {
      const wrap = wrapRef.current;
      return {
        lines: linesRef.current, selId: propsRef.current.selId, view: viewRef.current,
        width: wrap.clientWidth, laneH: LANE_H, waveTop: LANE_H, waveH: wrap.clientHeight - LANE_H - RULER_H,
        showWords: (wrap.clientWidth / viewRef.current.pps) <= 15,
      };
    };

    const onPointerDown = (e) => {
      const el = wrapRef.current;
      const rect = el.getBoundingClientRect();
      const x = e.clientX - rect.left, y = e.clientY - rect.top;
      const hit = hitTestTimeline(x, y, getGeom());
      const view = viewRef.current;
      if (hit.type === "seek" || hit.type === "laneEmpty") {
        AE.seek(hit.t);
        dragRef.current = { type: "seek" };
        propsRef.current.onSelectBoundary(null);
      } else {
        // 行操作: 作業用ディープコピーを作る
        const lines = linesRef.current.map((l) => (l.id === hit.lineId ? JSON.parse(JSON.stringify(l)) : l));
        const line = lines.find((l) => l.id === hit.lineId);
        dragRef.current = {
          type: hit.type, lineId: hit.lineId, idx: hit.idx, lines, line,
          startX: x, orig: JSON.parse(JSON.stringify(line)), moved: false,
        };
        linesRef.current = lines;
        propsRef.current.onSelect(hit.lineId);
        propsRef.current.onSelectBoundary(hit.type === "wordBoundary" ? hit.idx : null);
      }
      try { el.setPointerCapture(e.pointerId); } catch (err) {}
    };

    const onPointerMove = (e) => {
      const el = wrapRef.current;
      const rect = el.getBoundingClientRect();
      const x = e.clientX - rect.left, y = e.clientY - rect.top;
      const view = viewRef.current;
      const d = dragRef.current;
      if (!d) { // ホバー時のカーソル
        const hit = hitTestTimeline(x, y, getGeom());
        el.style.cursor = hit.type === "wordBoundary" || hit.type === "lineStart" || hit.type === "lineEnd"
          ? "col-resize" : hit.type === "lineMove" ? "grab" : "default";
        return;
      }
      if (d.type === "seek") { AE.seek(view.t0 + x / view.pps); return; }
      const t = view.t0 + x / view.pps;
      const dt = (x - d.startX) / view.pps;
      if (Math.abs(x - d.startX) > 2) d.moved = true;
      const line = d.line, orig = d.orig;
      const lyrics = d.lines.filter((l) => l.type === "lyric" && l.tStart != null);
      const li = lyrics.indexOf(line);
      const prev = lyrics[li - 1], next = lyrics[li + 1];
      const snap = (v) => Math.round(v * 100) / 100; // 10ms単位

      if (d.type === "lineMove") {
        let nd = clamp(dt, -orig.tStart, (AE.duration || orig.tEnd) - orig.tEnd);
        line.tStart = snap(orig.tStart + nd); line.tEnd = snap(orig.tEnd + nd);
        line.words = orig.words.map((w) => ({ text: w.text, tStart: snap(w.tStart + nd), tEnd: snap(w.tEnd + nd) }));
        d.tipText = fmtTime(line.tStart) + " (" + (nd >= 0 ? "+" : "") + nd.toFixed(2) + ")";
        d.tipX = (line.tStart - view.t0) * view.pps;
        if (scrubRef) scrubRef.current = line.tStart;
      } else if (d.type === "lineStart") {
        let ns = clamp(snap(t), prev ? prev.tEnd : 0, line.tEnd - MIN_LINE_DUR);
        rescaleWords(line, ns, line.tEnd);
        d.tipText = fmtTime(ns) + " (" + (ns - orig.tStart >= 0 ? "+" : "") + (ns - orig.tStart).toFixed(2) + ")";
        d.tipX = (ns - view.t0) * view.pps;
        if (scrubRef) scrubRef.current = ns + 0.01;
      } else if (d.type === "lineEnd") {
        let ne = clamp(snap(t), line.tStart + MIN_LINE_DUR, next ? next.tStart : (AE.duration || t));
        rescaleWords(line, line.tStart, ne);
        d.tipText = fmtTime(ne) + " (" + (ne - orig.tEnd >= 0 ? "+" : "") + (ne - orig.tEnd).toFixed(2) + ")";
        d.tipX = (ne - view.t0) * view.pps;
        if (scrubRef) scrubRef.current = ne - 0.01;
      } else if (d.type === "wordBoundary") {
        const i = d.idx;
        const lo = line.words[i - 1].tStart + MIN_WORD_DUR;
        const hi = line.words[i].tEnd - MIN_WORD_DUR;
        const nt = clamp(snap(t), lo, hi);
        line.words[i - 1].tEnd = nt; line.words[i].tStart = nt;
        line.wordsManual = true;
        d.tipText = line.words[i].text + "  " + fmtTime(nt);
        d.tipX = (nt - view.t0) * view.pps;
        if (scrubRef) scrubRef.current = nt + 0.01;
      }
    };

    const onPointerUp = (e) => {
      const d = dragRef.current;
      dragRef.current = null;
      if (scrubRef) scrubRef.current = null;
      if (d && d.type !== "seek" && d.moved) {
        propsRef.current.onCommitLines(d.lines);
      } else if (d && d.type !== "seek") {
        linesRef.current = d.lines; // 変更なし（選択のみ）
      }
    };

    // 行ブロックをダブルクリック → その行の頭から再生（単語境界なら、その単語の頭から）
    const onDblClick = (e) => {
      const el = wrapRef.current;
      const rect = el.getBoundingClientRect();
      const hit = hitTestTimeline(e.clientX - rect.left, e.clientY - rect.top, getGeom());
      if (!hit.lineId) return;
      const line = linesRef.current.find((l) => l.id === hit.lineId);
      if (!line || line.tStart == null) return;
      const t0 = hit.type === "wordBoundary" && line.words[hit.idx] ? line.words[hit.idx].tStart : line.tStart;
      AE.seek(t0);
      AE.play();
    };

    const zoom = (factor) => {
      const el = wrapRef.current, view = viewRef.current;
      const W = el.clientWidth;
      const center = AE.t(); // 再生ヘッド中心
      const cx = clamp((center - view.t0) * view.pps, 0, W);
      view.pps = clamp(view.pps * factor, 3, 1000);
      view.t0 = clamp(center - cx / view.pps, 0, Math.max(0, AE.duration - W / view.pps));
    };
    const fitAll = () => {
      const el = wrapRef.current, view = viewRef.current;
      view.t0 = 0; view.pps = clamp(el.clientWidth / (AE.duration || 1), 3, 1000);
    };

    return html`
      <div className="timeline-pane">
        <div className="timeline-bar">
          <span className="sub" style=${{ fontWeight: 600 }}>波形タイムライン</span>
          <span className="sub" style=${{ fontSize: "11px" }}>行をドラッグで移動 / 端で伸縮 / 縦線で単語調整 / ダブルクリックで行の頭から再生</span>
          <div style=${{ marginLeft: "auto", display: "flex", gap: "4px" }}>
            <button className="btn-icon" title="ズームアウト" onClick=${() => zoom(1 / 1.4)}>－</button>
            <button className="btn-icon" title="ズームイン" onClick=${() => zoom(1.4)}>＋</button>
            <button className="btn-text btn-sm" onClick=${fitAll}>全体表示</button>
          </div>
        </div>
        <div className="timeline-canvas-wrap" ref=${wrapRef}
          onPointerDown=${onPointerDown} onPointerMove=${onPointerMove} onPointerUp=${onPointerUp} onDoubleClick=${onDblClick}>
          <canvas ref=${canvasRef}></canvas>
        </div>
      </div>`;
  }

  function roundRect(ctx, x, y, w, h, r) {
    r = Math.min(r, w / 2, h / 2);
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  /* ============================================================
     タップ同期オーバーレイ
     ============================================================ */
  let beepCtx = null;
  function beep(freq, dur, gain) {
    try {
      beepCtx = beepCtx || new AudioContext();
      if (beepCtx.state === "suspended") beepCtx.resume();
      const o = beepCtx.createOscillator(), g = beepCtx.createGain();
      o.frequency.value = freq; o.type = "sine";
      g.gain.setValueAtTime(gain, beepCtx.currentTime);
      g.gain.exponentialRampToValueAtTime(0.0001, beepCtx.currentTime + dur);
      o.connect(g).connect(beepCtx.destination);
      o.start(); o.stop(beepCtx.currentTime + dur);
    } catch (e) {}
  }

  function TapOverlay({ project, startIndex, onDone, onCancel }) {
    const lyrics = useMemo(() => lyricLines(project), [project]);
    const [idx, setIdx] = useState(startIndex);
    const [marks, setMarks] = useState([]); // {lineId, t}
    const [count, setCount] = useState(startIndex === 0 ? 3 : 0);
    const [paused, setPaused] = useState(false);
    const [flash, setFlash] = useState(false);
    const waveRef = useRef(null);
    const doneRef = useRef(false);
    const stateRef = useRef({});
    stateRef.current = { idx, marks, count, paused, lyrics };

    // 開始処理
    useEffect(() => {
      AE.pause(); AE.setRate(1);
      if (startIndex === 0) {
        AE.seek(0);
        let c = 3;
        const tick = () => {
          if (c > 0) { beep(880, 0.06, 0.06); setCount(c); c--; setTimeout(tick, 900); }
          else { setCount(0); beep(1320, 0.09, 0.07); AE.play(); }
        };
        tick();
      } else {
        // 途中の行から再開: 直前の同期済み行の2秒前から
        const prevLine = lyrics[startIndex - 1];
        const from = prevLine && prevLine.tStart != null ? Math.max(0, prevLine.tStart - 2) : 0;
        AE.seek(from); AE.play();
      }
      return () => AE.pause();
    }, []);

    // 波形ストリップ描画
    useEffect(() => {
      let raf, alive = true;
      const draw = () => {
        if (!alive) return;
        raf = requestAnimationFrame(draw);
        const canvas = waveRef.current;
        if (!canvas) return;
        const dpr = window.devicePixelRatio || 1;
        const W = canvas.clientWidth, H = canvas.clientHeight;
        if (canvas.width !== W * dpr) { canvas.width = W * dpr; canvas.height = H * dpr; }
        const ctx = canvas.getContext("2d");
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        ctx.clearRect(0, 0, W, H);
        drawWave(ctx, AE.peaks, 0, AE.duration || 1, 0, 2, W, H - 4, "#3A4150");
        // マーク位置
        ctx.fillStyle = "#3DDC97";
        for (const m of stateRef.current.marks) {
          const x = (m.t / (AE.duration || 1)) * W;
          ctx.fillRect(x, 0, 1.5, H);
        }
        const px = (AE.t() / (AE.duration || 1)) * W;
        ctx.fillStyle = "#FFFFFF"; ctx.fillRect(px, 0, 2, H);
        // 曲が終わったら自動終了
        if (AE.el.ended) finish(stateRef.current.marks);
      };
      raf = requestAnimationFrame(draw);
      return () => { alive = false; cancelAnimationFrame(raf); };
    }, []);

    const finish = (mks) => {
      if (doneRef.current) return;
      doneRef.current = true;
      onDone(mks);
    };

    const mark = () => {
      const s = stateRef.current;
      if (s.count > 0 || s.paused) return;
      if (s.idx >= s.lyrics.length) return;
      const t = Math.round(AE.t() * 1000) / 1000;
      beep(1560, 0.04, 0.05);
      setFlash(true); setTimeout(() => setFlash(false), 120);
      const newMarks = [...s.marks, { lineId: s.lyrics[s.idx].id, t }];
      setMarks(newMarks);
      setIdx(s.idx + 1);
      if (s.idx + 1 >= s.lyrics.length) {
        setTimeout(() => finish(newMarks), 600); // 最終行 → 自動終了
      }
    };

    const undo = () => {
      const s = stateRef.current;
      if (!s.marks.length) return;
      const last = s.marks[s.marks.length - 1];
      setMarks(s.marks.slice(0, -1));
      setIdx(Math.max(startIndex, s.idx - 1));
      AE.seek(Math.max(0, last.t - 3));
      if (!AE.playing && !s.paused) AE.play();
    };

    const togglePause = () => {
      const s = stateRef.current;
      if (s.paused) { AE.seek(Math.max(0, AE.t() - 2)); AE.play(); setPaused(false); }
      else { AE.pause(); setPaused(true); }
    };

    // キー操作
    useEffect(() => {
      const onKey = (e) => {
        if (e.repeat) return;
        if (e.code === "Space") { e.preventDefault(); mark(); }
        else if (e.key === "ArrowLeft" || e.key === "Backspace") { e.preventDefault(); undo(); }
        else if (e.key === "p" || e.key === "P") { e.preventDefault(); togglePause(); }
        else if (e.key === "Escape") { e.preventDefault(); onCancel(stateRef.current.marks); }
      };
      window.addEventListener("keydown", onKey);
      return () => window.removeEventListener("keydown", onKey);
    }, []);

    const cur = lyrics[idx];
    const lastMark = marks.length ? marks[marks.length - 1] : null;
    // 直前にタップした行（＝いま歌われている行）。途中再開時は前セッションで同期済みの行
    const sungLine = lastMark
      ? lyrics.find((l) => l.id === lastMark.lineId)
      : (startIndex > 0 ? lyrics[startIndex - 1] : null);
    const sungT = lastMark ? lastMark.t : (sungLine && sungLine.tStart != null ? sungLine.tStart : null);
    const next1 = lyrics[idx + 1], next2 = lyrics[idx + 2];

    return html`
      <div className="tap-overlay">
        ${count > 0 && html`<div className="countdown"><span key=${count}>${count}</span></div>`}
        <div className="tap-head">
          <span style=${{ fontWeight: 700 }}>🎤 タップ同期中</span>
          ${startIndex > 0 && html`<span className="chip accent">${startIndex + 1}行目から再開</span>`}
          ${paused && html`<span className="chip warn">一時停止中</span>`}
          <div style=${{ marginLeft: "auto", display: "flex", gap: "8px" }}>
            <button className="btn btn-secondary btn-sm" onClick=${togglePause}>${paused ? "▶ 再開 (P)" : "⏸ 一時停止 (P)"}</button>
            <button className="btn btn-secondary btn-sm" onClick=${() => onCancel(stateRef.current.marks)}>✕ やめる (Esc)</button>
          </div>
        </div>
        <div className="tap-body">
          <div className="tap-slot">
            ${sungLine
              ? html`
                  <div className="tap-label">♪ いま歌っている行<span className="stamp">✓ ${sungT != null ? fmtTime(sungT) : ""} でマーク済</span></div>
                  <div className=${"tap-line tap-sung" + (flash ? " flash" : "")}>
                    ${withBreaks(sungLine.en)}
                    ${sungLine.ja && html`<div className="ja">${withBreaks(sungLine.ja)}</div>`}
                  </div>`
              : html`<div className="tap-label" style=${{ opacity: 0.45 }}>タップすると、いま歌っている行がここに大きく表示されます</div>`}
          </div>
          <div className="tap-label" style=${{ color: "var(--accent-hover)" }}>
            ${cur ? "▶ 次はこの行 ── 歌い出しの瞬間にスペースキー！" : "🎉 全行マーク完了"}
          </div>
          <div className="tap-line tap-current">
            ${cur ? withBreaks(cur.en) : "完了！"}
            ${cur && cur.ja && html`<div className="ja">${withBreaks(cur.ja)}</div>`}
          </div>
          <div className="tap-next">${next1 ? "その次: " + next1.en : ""}</div>
          <div className="tap-next" style=${{ opacity: 0.6 }}>${next2 ? "その次: " + next2.en : ""}</div>
        </div>
        <div className="tap-foot">
          <canvas className="tap-wave" ref=${waveRef}></canvas>
          <div className="tap-progress">
            <div className="bar"><div className="fill" style=${{ width: ((startIndex + marks.length) / Math.max(1, lyrics.length) * 100) + "%" }}></div></div>
            <span className="tnum">${Math.min(startIndex + marks.length, lyrics.length)} / ${lyrics.length} 行</span>
          </div>
          <div className="tap-keys">
            <span><span className="kbd">スペース</span>この行をマーク</span>
            <span><span className="kbd">←</span>1行やり直し</span>
            <span><span className="kbd">P</span>一時停止</span>
            <span><span className="kbd">Esc</span>中断（保存されます）</span>
          </div>
        </div>
      </div>`;
  }

  /* ============================================================
     サンプル曲（権利クリアな自作短曲を実行時に合成）
     ============================================================ */
  const SAMPLE_LYRICS = [
    ["Morning light is calling my name", "朝の光が僕を呼んでいる"],
    ["I open up the window again", "もう一度窓を開けてみる"],
    ["A brand new day is starting to shine", "真新しい一日が輝き出す"],
    ["I know this dream is mine", "この夢は僕のものだと分かってる"],
    null, // 間奏
    ["Walking down the street with a smile", "笑顔で通りを歩いていく"],
    ["Every little step feels so right", "一歩一歩が心地いい"],
    ["Singing out the words of my heart", "心の言葉を歌いながら"],
    ["Today is where I start", "今日がはじまりの日"],
  ];
  const SAMPLE_STARTS = [2.0, 4.8, 7.6, 10.4, null, 15.4, 18.2, 21.0, 23.8];
  const SAMPLE_DUR_TOTAL = 27.5;

  async function generateSampleAudio() {
    const sr = 44100;
    const octx = new OfflineAudioContext(2, Math.ceil(SAMPLE_DUR_TOTAL * sr), sr);
    const master = octx.createGain(); master.gain.value = 0.7; master.connect(octx.destination);
    const NOTE = (name) => 440 * Math.pow(2, (name - 69) / 12); // MIDI番号→Hz
    // コード進行 C - G - Am - F（2.8秒ごと）
    const chords = [[60, 64, 67], [55, 59, 62], [57, 60, 64], [53, 57, 60]];
    for (let seg = 0; seg * 2.8 < SAMPLE_DUR_TOTAL; seg++) {
      const t0 = seg * 2.8, chord = chords[seg % 4];
      for (const n of chord) {
        const o = octx.createOscillator(), g = octx.createGain();
        o.type = "triangle"; o.frequency.value = NOTE(n - 12);
        g.gain.setValueAtTime(0.0001, t0);
        g.gain.linearRampToValueAtTime(0.05, t0 + 0.25);
        g.gain.setValueAtTime(0.05, t0 + 2.3);
        g.gain.linearRampToValueAtTime(0.0001, t0 + 2.75);
        o.connect(g).connect(master);
        o.start(t0); o.stop(t0 + 2.8);
      }
    }
    // メロディ（歌行の位置に合わせたペンタトニック）
    const melodyPat = [72, 74, 76, 79, 76, 74, 72, 69];
    SAMPLE_STARTS.forEach((st, li) => {
      if (st == null) return;
      for (let k = 0; k < 4; k++) {
        const t0 = st + k * 0.55;
        const o = octx.createOscillator(), g = octx.createGain();
        o.type = "sine"; o.frequency.value = NOTE(melodyPat[(li * 3 + k) % melodyPat.length]);
        g.gain.setValueAtTime(0.0001, t0);
        g.gain.linearRampToValueAtTime(0.14, t0 + 0.03);
        g.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.5);
        o.connect(g).connect(master);
        o.start(t0); o.stop(t0 + 0.55);
      }
    });
    const buf = await octx.startRendering();
    return new File([audioBufferToWav(buf)], "sample-song.wav", { type: "audio/wav" });
  }

  function audioBufferToWav(buf) {
    const chs = buf.numberOfChannels, sr = buf.sampleRate, n = buf.length;
    const bytes = 44 + n * chs * 2;
    const ab = new ArrayBuffer(bytes), dv = new DataView(ab);
    const ws = (o, s) => { for (let i = 0; i < s.length; i++) dv.setUint8(o + i, s.charCodeAt(i)); };
    ws(0, "RIFF"); dv.setUint32(4, bytes - 8, true); ws(8, "WAVE");
    ws(12, "fmt "); dv.setUint32(16, 16, true); dv.setUint16(20, 1, true);
    dv.setUint16(22, chs, true); dv.setUint32(24, sr, true);
    dv.setUint32(28, sr * chs * 2, true); dv.setUint16(32, chs * 2, true); dv.setUint16(34, 16, true);
    ws(36, "data"); dv.setUint32(40, n * chs * 2, true);
    let off = 44;
    const chData = [];
    for (let c = 0; c < chs; c++) chData.push(buf.getChannelData(c));
    for (let i = 0; i < n; i++) {
      for (let c = 0; c < chs; c++) {
        const v = Math.max(-1, Math.min(1, chData[c][i]));
        dv.setInt16(off, v < 0 ? v * 0x8000 : v * 0x7FFF, true);
        off += 2;
      }
    }
    return ab;
  }

  function buildSampleProject() {
    const p = newProject("サンプル：A Brand New Day");
    p.audio = { fileName: "sample-song.wav", size: 0, duration: SAMPLE_DUR_TOTAL, fingerprint: null, sample: true };
    p.lines = SAMPLE_LYRICS.map((pair, i) => {
      if (!pair) return makeGap();
      const l = makeLine(pair[0], pair[1]);
      l.tStart = SAMPLE_STARTS[i];
      l.tEnd = SAMPLE_STARTS[i] + 2.4;
      return l;
    });
    computeLineEnds(p.lines, SAMPLE_DUR_TOTAL);
    p.lines.forEach((l) => { if (l.type === "lyric") autoAssignWords(l); });
    return p;
  }

  /* ============================================================
     [9] React UI
     ============================================================ */
  AE._loop = { on: false, lineId: null, start: 0, end: 0 };

  /* ---------- 単語読み上げ（歌詞シート用・英語TTS） ----------
     Macには「Bad News」「Bubbles」などジョーク用の声が混ざっていて、
     単純に「最初に見つかったen-US」を使うとそれを掴むことがある。
     → ジョーク声を除外し、聞きやすい定番の声を優先して自動選択。
       利用者が選んだ声は localStorage に記憶して次回も使う。 */
  const TTS_VOICE_KEY = "lyric-pv:ttsVoice:v1";
  const TTS = {
    voice: null,
    wanted: (() => { try { return localStorage.getItem(TTS_VOICE_KEY) || ""; } catch (e) { return ""; } })(),
    // 日本語環境のMacでは一部が和名になる（ささやき声=Whisper・道化=Jester・震え=Wobble等）ので両方はじく
    NOVELTY: /\b(albert|bad news|bahh|bells|boing|bubbles|cellos|deranged|eddy|flo|fred|good news|grandma|grandpa|hysterical|jester|junior|kathy|organ|ralph|reed|rocko|sandy|shelley|superstar|trinoids|whisper|wobble|zarvox)\b|ささやき|オルガン|スーパースター|トリノイド|ベル|道化|震え|鐘|泡|チェロ/i,
    PREF: ["samantha", "ava", "allison", "zoe", "nicky", "noelle", "joelle", "evan", "nathan", "aaron", "alex", "susan", "vicki", "victoria", "tom", "google us english", "google", "microsoft"],
    list() {
      const vs = (window.speechSynthesis && speechSynthesis.getVoices()) || [];
      const en = vs.filter((v) => /^en([-_]|$)/i.test(v.lang || ""));
      const pool = en.filter((v) => !this.NOVELTY.test(v.name || ""));
      const use = pool.length ? pool : en; // まともな声がゼロの環境では仕方なく全部
      const score = (v) => {
        const n = (v.name || "").toLowerCase();
        let s = 0;
        const pi = this.PREF.findIndex((p) => n.includes(p));
        if (pi >= 0) s += 200 - pi * 5;                 // 定番の聞きやすい声を最優先
        if (/premium|enhanced|natural/i.test(n)) s += 40;
